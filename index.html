  const py = ay + dy*0.5 - dx*0.8660254;
  return kochPuntos(x0,y0,ax,ay,n-1).concat(
         kochPuntos(ax,ay,px,py,n-1),
         kochPuntos(px,py,bx,by,n-1),
         kochPuntos(bx,by,x1,y1,n-1));
}

/* Árbol fractal: ramificación recursiva, la regla de crecimiento de casi
   cualquier planta. Devuelve trazo puro. */
function arbolFractal(r0, r1, niveles){
  let d = '';
  (function rec(x, y, ang, len, n){
    const x2 = x + len*Math.sin(ang), y2 = y - len*Math.cos(ang);
    d += ` M ${x.toFixed(1)},${y.toFixed(1)} L ${x2.toFixed(1)},${y2.toFixed(1)}`;
    if (n <= 0) return;
    rec(x2, y2, ang - 0.44, len*0.68, n - 1);
    rec(x2, y2, ang + 0.44, len*0.68, n - 1);
  })(0, -r0, 0, (r1 - r0) * 0.40, niveles || 3);
  return d.trim();
}

/* Copo de Koch completo: los tres lados de un triángulo equilátero
   subdivididos. Es la fractal más reconocible de todas, y cerrada se lee de
   inmediato — a diferencia de un borde suelto, que se pierde entre el resto. */
function copoKoch(R, niveles){
  const v = [pt(0, R), pt(120, R), pt(240, R)];
  let pts = [];
  for (let i = 0; i < 3; i++){
    const a = v[i], b = v[(i + 1) % 3];
    pts = pts.concat(kochPuntos(a[0], a[1], b[0], b[1], niveles));
  }
  return `M ${v[0][0].toFixed(1)},${v[0][1].toFixed(1)} `
       + pts.map(p => `L ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') + ' Z';
}

/* Triángulo de Sierpinski: el triángulo se parte en tres copias de sí mismo,
   nivel tras nivel. Autosimilitud pura. */
function sierpinski(R, niveles){
  let d = '';
  (function rec(ax, ay, bx, by, cx, cy, n){
    if (n <= 0){
      d += ` M ${ax.toFixed(1)},${ay.toFixed(1)} L ${bx.toFixed(1)},${by.toFixed(1)} `
         + `L ${cx.toFixed(1)},${cy.toFixed(1)} Z`;
      return;
    }
    const ab = [(ax+bx)/2, (ay+by)/2], bc = [(bx+cx)/2, (by+cy)/2], ca = [(cx+ax)/2, (cy+ay)/2];
    rec(ax, ay, ab[0], ab[1], ca[0], ca[1], n - 1);
    rec(ab[0], ab[1], bx, by, bc[0], bc[1], n - 1);
    rec(ca[0], ca[1], bc[0], bc[1], cx, cy, n - 1);
  })(...pt(0, R), ...pt(120, R), ...pt(240, R), niveles);
  return d.trim();
}

/* Empaquetado de círculos: dentro de cada círculo caben tres más pequeños,
   y así sucesivamente. La lógica de las burbujas y de la espuma. */
function circulosFractal(R, niveles){
  let d = circuloPath(0, 0, R);
  (function rec(cx, cy, r, n){
    if (n <= 0) return;
    for (let i = 0; i < 3; i++){
      const a = (i * 120 + (n % 2 ? 60 : 0)) * D2R, rr = r * 0.42;
      const nx = cx + (r - rr) * Math.cos(a), ny = cy + (r - rr) * Math.sin(a);
      d += ' ' + circuloPath(nx, ny, rr);
      rec(nx, ny, rr, n - 1);
    }
  })(0, 0, R, niveles);
  return d;
}

/* Copo dendrítico: seis brazos, y cada brazo lleva ramas que repiten al brazo.
   Es la fractal del hielo — la que de verdad forma un copo de nieve — y a
   diferencia del copo de Koch NO se construye sobre un triángulo, que es lo que
   no leía como naturaleza. Devuelve figura cerrada: se puede pintar. */
function copoDendrita(R, niveles){
  let d = '';
  const rama = (x, y, ang, len, w, n) => {
    const x2 = x + len*Math.sin(ang), y2 = y - len*Math.cos(ang);
    const nx = Math.cos(ang), ny = Math.sin(ang);          // normal al eje
    d += ` M ${(x + nx*w).toFixed(1)},${(y + ny*w).toFixed(1)} `
       + `L ${(x2 + nx*w*0.42).toFixed(1)},${(y2 + ny*w*0.42).toFixed(1)} `
       + `L ${(x2 - nx*w*0.42).toFixed(1)},${(y2 - ny*w*0.42).toFixed(1)} `
       + `L ${(x - nx*w).toFixed(1)},${(y - ny*w).toFixed(1)} Z`;
    if (n <= 0) return;
    [0.34, 0.60, 0.84].forEach(f => {
      const px = x + (x2 - x)*f, py = y + (y2 - y)*f, L = len*0.44*(1 - f*0.45);
      rama(px, py, ang - 1.05, L, w*0.55, n - 1);
      rama(px, py, ang + 1.05, L, w*0.55, n - 1);
    });
  };
  // Seis brazos: la simetría hexagonal del hielo.
  for (let i = 0; i < 6; i++) rama(0, 0, i * Math.PI / 3, R*0.92, R*0.055, niveles);
  return d.trim();
}

/* Filotaxis: semillas colocadas con el ángulo áureo (137.5°). Es la
   disposición real de una cabezuela de girasol o de una piña. */
function filotaxis(R0, R1, n){
  const phi = Math.PI * (3 - Math.sqrt(5));
  let d = '';
  for (let i = 0; i < n; i++){
    const t = Math.sqrt(i / n), rad = R0 + (R1 - R0) * t, a = i * phi;
    d += circuloPath(rad*Math.cos(a), rad*Math.sin(a), Math.max(1.6 + 3.4*t, 1.2)) + ' ';
  }
  return d.trim();
}

/* --- Piezas estructurales del yantra --- */

// Un lado del bhupura (el marco cuadrado). Va de esquina a esquina; el
// renderer lo repite 4 veces con rotate(90) para cerrar el cuadrado.
// Con prof > 0 lleva la puerta en T hacia afuera del punto cardinal.
function ladoBhupura(S, ancho, prof, alas){
  if (!prof) return `M ${-S},${-S} L ${S},${-S}`;
  const a = ancho / 2, e = alas, d = prof, d1 = prof * 0.42;
  return `M ${-S},${-S} L ${-a},${-S} L ${-a},${-S-d1} L ${-a-e},${-S-d1} `
       + `L ${-a-e},${-S-d} L ${a+e},${-S-d} L ${a+e},${-S-d1} L ${a},${-S-d1} `
       + `L ${a},${-S} L ${S},${-S}`;
}

// Nueve triángulos entrelazados: 4 hacia arriba (Shiva) y 5 hacia abajo
// (Shakti), todos con las esquinas de la base apoyadas en el mismo círculo.
const TRI_ARRIBA = [[1.00,0.42],[0.86,0.16],[0.60,0.64],[0.32,0.88]];
const TRI_ABAJO  = [[1.00,0.42],[0.88,0.14],[0.66,0.62],[0.36,0.86],[0.12,0.96]];
function trianguloYantra(R, apice, base, abajo){
  const s  = abajo ? -1 : 1;
  const yA = s * -R * apice;
  const yB = s *  R * base;
  const w  = Math.sqrt(Math.max(R*R - yB*yB, 1));
  return `M 0,${yA.toFixed(1)} L ${(-w).toFixed(1)},${yB.toFixed(1)} L ${w.toFixed(1)},${yB.toFixed(1)} Z`;
}

/* Núcleos del yantra. La semilla elige uno, así que el corazón del mandala
   cambia de una generación a otra en vez de ser siempre el mismo.
   Firma: (add, R, grosor, rnd, N).                                        */
const NUCLEOS = {
  // Sri Yantra: los nueve triángulos entrelazados.
  sriYantra(add, R, g){
    TRI_ARRIBA.forEach(([a, b]) => add(trianguloYantra(R, a, b, false), 1, 0, true, g));
    TRI_ABAJO .forEach(([a, b]) => add(trianguloYantra(R, a, b, true ), 1, 0, true, g));
  },
  // Shatkona: dos triángulos equiláteros entrelazados (Shiva y Shakti).
  shatkona(add, R, g){
    add(`M ${P(0,R)} L ${P(120,R)} L ${P(240,R)} Z`, 1, 0, true, g * 1.4);
    add(`M ${P(60,R)} L ${P(180,R)} L ${P(300,R)} Z`, 1, 0, true, g * 1.4);
    add(circuloPath(0, 0, R * 0.5), 1, 0, true, g * 0.8);
  },
  // Ashtakona: dos cuadrados girados 45°, estrella de ocho puntas.
  ashtakona(add, R, g){
    add(`M ${P(0,R)} L ${P(90,R)} L ${P(180,R)} L ${P(270,R)} Z`, 1, 0, true, g * 1.3);
    add(`M ${P(45,R)} L ${P(135,R)} L ${P(225,R)} L ${P(315,R)} Z`, 1, 0, true, g * 1.3);
    add(circuloPath(0, 0, R * 0.44), 1, 0, true, g * 0.8);
  },
  // Chakra: rueda de radios con cubo central.
  chakra(add, R, g, rnd, N){
    const k = Math.max(8, Math.min(24, N * 2));
    add(circuloPath(0, 0, R), 1, 0, true, g * 1.3);
    add(`M ${P(0, R*0.3)} L ${P(0, R)}`, k, 0, true, g * 1.1);
    add(circuloPath(0, 0, R * 0.62), 1, 0, true, g * 0.7);
  },
  // Loto central de ocho o doce pétalos.
  lotoCentro(add, R, g, rnd, N){
    const k = rnd() < 0.5 ? 8 : 12;
    add(MOTIVOS.loto(R * 0.24, R, 180 / k).d, k, 0, false, 0);
    add(MOTIVOS.loto(R * 0.36, R * 0.86, 180 / k * 0.55).d, k, 0, true, g * 0.7);
    add(circuloPath(0, 0, R), 1, 0, true, g * 0.9);
  },
  // Navayoni: triángulos concéntricos alternando el sentido.
  navayoni(add, R, g){
    [1, 0.76, 0.54, 0.34].forEach((f, i) =>
      add(trianguloYantra(R * f, 1, 0.5, i % 2 === 1), 1, 0, true, g));
    add(circuloPath(0, 0, R), 1, 0, true, g * 0.8);
  },
  // Estrella radiante: puntas macizas saliendo del bindu.
  rayosEstrella(add, R, g, rnd, N){
    const k = Math.max(8, Math.min(32, N * 2));
    const hw = 180 / k * 0.6;
    add(`M ${P(0,R)} L ${P(-hw, R*0.2)} L ${P(hw, R*0.2)} Z`, k, 0, false, 0);
    add(circuloPath(0, 0, R), 1, 0, true, g * 0.9);
  },

  /* --- núcleos fractales ---
     El yantra ya es autosimilar por naturaleza (triángulos dentro de
     triángulos); estos lo hacen explícito. */
  // Sierpinski: el triángulo repetido dentro de sí mismo, cuatro niveles.
  sierpinskiYantra(add, R, g){
    add(sierpinski(R, 4), 1, 0, false, 0);
    add(circuloPath(0, 0, R), 1, 0, true, g);
  },
  // Shatkona anidada: la misma estrella a escalas decrecientes, girando.
  shatkonaFractal(add, R, g){
    [[1, 0], [0.56, 30], [0.31, 0], [0.17, 30]].forEach(([f, rot], i) => {
      add(`M ${P(rot,R*f)} L ${P(rot+120,R*f)} L ${P(rot+240,R*f)} Z`, 1, 0, true, g * (1.4 - i*0.22));
      add(`M ${P(rot+60,R*f)} L ${P(rot+180,R*f)} L ${P(rot+300,R*f)} Z`, 1, 0, true, g * (1.4 - i*0.22));
    });
  },
  // Copo de Koch: el borde infinito, en dos orientaciones superpuestas.
  kochYantra(add, R, g){
    add(copoKoch(R, 3), 1, 0, true, g * 1.2);
    add(copoKoch(R * 0.62, 2), 1, 180, true, g);
    add(circuloPath(0, 0, R * 0.24), 1, 0, false, 0);
  },
  // Sri Yantra que se contiene a sí mismo a media escala.
  sriYantraFractal(add, R, g){
    [[1, 0], [0.44, 180]].forEach(([f, rot], i) => {
      TRI_ARRIBA.forEach(([a, b]) => add(trianguloYantra(R*f, a, b, false), 1, rot, true, g * (1 - i*0.3)));
      TRI_ABAJO .forEach(([a, b]) => add(trianguloYantra(R*f, a, b, true ), 1, rot, true, g * (1 - i*0.3)));
    });
  }
};
const NOMBRES_NUCLEOS = Object.keys(NUCLEOS);

/* =========================================================================
   4. GENERADORES
   ========================================================================= */
function repeticionesArmonicas(N, rnd){
  const opts = new Set([N]);
  for (let d = 4; d <= N; d++) if (N % d === 0) opts.add(d);
  if (N * 2 <= 96) opts.add(N * 2);
  const arr = [...opts].filter(v => v >= 3 && v <= 96);
  return arr.length ? elegir(rnd, arr) : N;
}

/* Repeticiones elegidas por la proporción de la banda: busca que el motivo
   quede aproximadamente tan ancho como alto, y luego se queda con el valor
   armónico más cercano. Sin esto, una banda ancha con pocas repeticiones
   deja huecos enormes entre figura y figura.                              */
// `prop` = ancho deseado del motivo como fracción de su alto. 0.95 ≈ tan ancho
// como alto (el caso general); ~0.5 para pétalos, que son alargados y por eso
// caben muchos más en la misma circunferencia.
function repeticionesParaBanda(N, mid, alto, rnd, prop){
  const ideal = Math.max(4, Math.round(2 * Math.PI * mid / Math.max(alto * (prop ?? 0.95), 12)));
  const opts = new Set([N]);
  for (let d = 4; d <= N; d++) if (N % d === 0) opts.add(d);
  for (let m = 2; m <= 8; m++) if (N * m <= 96) opts.add(N * m);
  const arr = [...opts].filter(v => v >= 3 && v <= 96)
                       .sort((a, b) => Math.abs(a - ideal) - Math.abs(b - ideal));
  if (!arr.length) return N;
  return arr[rnd() < 0.75 ? 0 : Math.min(1, arr.length - 1)];
}

/* Reparto de bandas radiales concéntricas, compartido por varios estilos.
   Devuelve [radioInterno, radioExterno, altoTotal] por anillo.            */
function bandas(cfg, rnd, creciente, hueco, solape){
  creciente = creciente ?? 0.10; hueco = hueco ?? 0.93; solape = solape ?? 0;
  const pesos = [];
  for (let i = 0; i < cfg.anillos; i++) pesos.push(0.6 + rnd() * 0.75 + i * creciente);
  const suma = pesos.reduce((a, b) => a + b, 0);
  const out = [];
  let r = R_MIN;
  for (let i = 0; i < cfg.anillos; i++){
    const alto = (R_MAX - R_MIN) * pesos[i] / suma;
    // Cada anillo muerde hacia dentro del anterior. Como se dibuja después,
    // queda por encima: eso es lo que produce la sensación de trenzado y lo
    // que cierra las zonas blancas que quedaban entre anillo y anillo.
    const r0 = i === 0 ? r : Math.max(R_MIN * 0.6, r - alto * solape);
    out.push([r0, r + alto * hueco, r + alto * hueco - r0]);
    r += alto;
  }
  return out;
}

/* --- Motor de anillos concéntricos, parametrizado por vocabulario.
       Lo usan el estilo geométrico y el africano: misma estructura,
       repertorio de motivos y carácter de trazo distintos.               --- */
function generarAnillos(semilla, cfg, voc){
  const rnd = mulberry32(semilla >>> 0);
  const N = cfg.simetria;
  const dens = cfg.densidad / 100;
  const motivosDisp = voc.motivos.slice(0, Math.max(3, Math.min(voc.motivos.length, limites().motivos)));

  const pesos = [];
  for (let i = 0; i < cfg.anillos; i++) pesos.push(0.6 + rnd() * 0.75 + i * 0.10);
  const suma = pesos.reduce((a, b) => a + b, 0);

  const partes = [];
  let r = R_MIN, previo = null;
  // Fase del trenzado: los anillos alternan medio sector de desfase, así las
  // puntas de uno caen en los huecos del siguiente en vez de enfrentarse.
  const fase = rnd() < 0.5 ? 0 : 1;

  partes.push({ d: circuloPath(0, 0, R_MIN * 0.82), k: 1, off: 0, trazo: false, grosor: 0 });

  for (let i = 0; i < cfg.anillos; i++){
    const alto = (R_MAX - R_MIN) * pesos[i] / suma;
    const rBase = r;
    r += alto;
    // El anillo muerde hacia dentro del anterior y se asoma sobre el siguiente.
    const r0 = i === 0 ? rBase : Math.max(R_MIN * 0.6, rBase - alto * voc.solape);
    const r1 = rBase + alto * voc.hueco;
    const altoEf = r1 - r0;

    // En bandas anchas solo entran motivos que llenan; en las finas, cualquiera.
    let repertorio = motivosDisp;
    if (altoEf > 68){
      const filtrado = motivosDisp.filter(m => MOTIVOS_LLENADORES.includes(m));
      if (filtrado.length) repertorio = filtrado;
    }
    let motivo = elegir(rnd, repertorio);
    if (motivo === previo) motivo = elegir(rnd, repertorio);
    previo = motivo;

    // Proporcionadas a la banda: con la regla armónica a secas salían pocas
    // figuras muy separadas entre sí dentro del mismo anillo.
    const k  = repeticionesParaBanda(N, (r0 + r1) / 2, altoEf, rnd);
    const hw = (180 / k) * entre(rnd, voc.ancho[0], voc.ancho[1]);
    const m  = MOTIVOS[motivo](r0, r1, hw, rnd);
    const zB = -(r0 + r1) / 2;          // profundidad: más lejos del centro, más al fondo

    // El grosor se limita a lo que da la banda. Era un valor suelto del
    // vocabulario, sin mirar el tamaño de la figura: en el africano, que usa
    // trazos gruesos a propósito, un motivo pequeño con 12 de grosor se
    // rellenaba solo y salían manchas negras. El tope es una fracción del lado
    // menor de la casilla — el alto de la banda o la cuerda entre repeticiones.
    const cuerda  = 2 * ((r0 + r1) / 2) * Math.sin(hw * D2R);
    const casilla = Math.max(Math.min(altoEf, cuerda), 6);
    const grosorBanda = () =>
      Math.max(Math.min(entre(rnd, voc.grosor[0], voc.grosor[1]), casilla * 0.17), 1.6);

    partes.push({
      d: m.d, k, off: ((i + fase) % 2) ? 180 / k : 0, evenodd: !!m.evenodd, z: zB,
      trazo: !!m.trazo, grosor: m.trazo ? grosorBanda() : 0
    });

    // Tira de textura pegada al borde interior del anillo. En los tejidos de
    // referencia una cenefa nunca es una fila sola: es una franja de figuras
    // más una tira de rayas, puntos o greca justo debajo.
    if (voc.compuesto && altoEf > 40 && rnd() < 0.28 + dens * 0.68){
      const sec = elegir(rnd, voc.compuesto);
      const ra = r0 + altoEf * 0.02, rb = r0 + altoEf * 0.22;
      const kS = repeticionesParaBanda(N, (ra + rb) / 2, rb - ra, rnd);
      const mS = MOTIVOS[sec](ra, rb, 180 / kS, rnd);
      partes.push({ d: mS.d, k: kS, off: 180 / kS, evenodd: !!mS.evenodd, z: zB,
                    trazo: !!mS.trazo,
                    grosor: mS.trazo ? Math.min(entre(rnd, 3, 6), (rb - ra) * 0.32) : 0 });
    }

    // Adornos que controla el deslizador de Detalle. Sin ellos el deslizador
    // no cambiaba nada visible en estos estilos y no se entendía para qué era.
    const offM = ((i + fase) % 2) ? 180 / k : 0;
    if (!m.trazo && dens > 0.32 && altoEf > 30)
      partes.push({ d: MOTIVOS[motivo](r0 + altoEf*0.20, r1 - altoEf*0.18, hw*0.55, rnd).d,
                    k, off: offM, trazo: true, z: zB, grosor: grosorBanda() * 0.45 });

    if (rnd() < dens && altoEf > 40){
      const k2 = repeticionesArmonicas(N, rnd);
      const rr = Math.min(6 + dens * 8, altoEf * 0.16);
      const [cx, cy] = pt(0, r0 + rr * 1.5);
      partes.push({ d: circuloPath(cx, cy, rr), k: k2, off: 180 / k2, trazo: false, grosor: 0, z: zB });
    }

    // El aro va en el límite nominal, no en r1: con solape, r1 cae dentro del
    // anillo siguiente y el aro se vería fuera de sitio.
    if (rnd() < voc.aros || i === cfg.anillos - 1){
      partes.push({ d: circuloPath(0, 0, r), k: 1, off: 0, trazo: true, z: -r,
                    grosor: grosorBanda() * 0.7 });
    }
  }
  return { semilla, N, partes };
}

/* Roseta: florecilla de n pétalos en una caja de ±R, para las esquinas del
   bhupura. Se construye con trigonometría en vez de rotaciones anidadas
   porque tiene que caber en un solo path.                                 */
function roseta(R, n, ancho){
  // `ancho` controla lo gordo del pétalo. Con muchos pétalos hay que
  // adelgazarlos o la flor se ve como un bulto.
  const w = (ancho ?? 0.30) * Math.min(1, 8 / n);
  let d = circuloPath(0, 0, R * 0.24);
  for (let i = 0; i < n; i++){
    const ar = i * 2 * Math.PI / n;
    const ux = Math.sin(ar), uy = -Math.cos(ar);   // radial
    const vx = Math.cos(ar), vy = Math.sin(ar);    // perpendicular
    const p = (rr, ss) => `${(ux*rr + vx*ss).toFixed(1)},${(uy*rr + vy*ss).toFixed(1)}`;
    d += ` M ${p(R*0.24,0)} C ${p(R*0.46, R*w)} ${p(R*0.86, R*w*0.62)} ${p(R,0)} `
       + `C ${p(R*0.86,-R*w*0.62)} ${p(R*0.46,-R*w)} ${p(R*0.24,0)} Z`;
  }
  return d;
}

/* Cadena de perlas siguiendo el borde de un pétalo: los puntos se separan y se
   vuelven a juntar acompañando el ancho de la figura. Es el remate que aparece
   en casi toda lámina de mandala y no se consigue con un anillo de puntos
   concéntrico, porque ese no sigue la forma. */
function perlasDePetalo(r0, r1, hw, n, rr){
  const h = r1 - r0;
  let d = '';
  for (let i = 1; i <= n; i++){
    const t = i / (n + 1);
    const rad = r0 + h * t, ang = hw * Math.sin(Math.PI * t) * 0.88;
    const [ax, ay] = pt(ang, rad), [bx, by] = pt(-ang, rad);
    d += circuloPath(ax, ay, rr) + ' ' + circuloPath(bx, by, rr) + ' ';
  }
  return d.trim();
}

// Ancho de la cuerda del pétalo en su punto más ancho.
const cuerdaPetalo = (r0, r1, hw) => 2 * ((r0 + r1) / 2) * Math.sin(hw * D2R);

/* Capa de pétalos DECORADA: pétalo grande, dos contornos interiores anidados,
   cadena de perlas siguiendo el borde y una gota dentro. Un pétalo liso
   repetido no se parece en nada a una lámina de mandala; lo que la hace es
   esta acumulación de detalle dentro de cada pétalo.
   `add` debe aceptar (d, k, off, trazo, grosor).                            */
function capaPetalos(add, r0, r1, k, off, g, rnd, opts){
  opts = opts || {};
  const h = r1 - r0, sector = 180 / k;
  // Los pétalos SÍ llenan su sector y se tocan: en las láminas de referencia
  // no hay hueco entre ellos, el anillo va lleno. Lo que permite leerlos uno a
  // uno es el contorno propio de más abajo, no el aire. Dejar hueco fue un
  // error: se veía espaciado y perdía la densidad de flor.
  const hw = sector * (opts.ancho ?? 0.99);
  const forma = opts.forma || 'ojival';

  // Cuando hay muchos pétalos son estrechos, y meterles el mismo detalle que a
  // uno ancho solo produce ruido. El detalle se dosifica según la cuerda.
  const cu = cuerdaPetalo(r0, r1, hw), ancho = cu / h;

  // `detalle` (0..1) decide CUÁNTOS adornos lleva el pétalo. Es lo que hace
  // que el deslizador de Detalle se note: a 0 el pétalo va limpio y a 100 lleva
  // doble contorno, gota, perlas y nervaduras.
  const det = opts.detalle ?? 1;

  const dPetalo = MOTIVOS[forma](r0, r1, hw).d;
  add(dPetalo, k, off, false, 0);                     // relleno
  // Contorno propio y grueso: sin él, dos pétalos del mismo color se funden.
  add(dPetalo, k, off, true, g * 1.7);
  if (det > 0.12)
    add(MOTIVOS[forma](r0 + h*0.14, r1 - h*0.10, hw*0.66).d, k, off, true, g);
  if (h > 46 && ancho > 0.42 && det > 0.55)
    add(MOTIVOS[forma](r0 + h*0.28, r1 - h*0.24, hw*0.40).d, k, off, true, g*0.8);

  // Gota o punto en el corazón del pétalo.
  if (h > 34 && cu > 12 && det > 0.25){
    const [cx, cy] = pt(0, r0 + h * 0.34);
    add(circuloPath(cx, cy, Math.min(h*0.075, cu*0.20, 6)), k, off, false, 0);
  }
  // Orla de perlas siguiendo el borde por dentro: con los pétalos tocándose,
  // por fuera caerían encima del vecino.
  if (opts.perlas !== false && h > 30 && cu > 16 && det > 0.38)
    add(perlasDePetalo(r0 + h*0.06, r1 - h*0.03, hw*0.80, det > 0.75 ? 7 : 5,
                       Math.max(Math.min(h*0.034, cu*0.12, 4.5), 1.5)), k, off, false, 0);
  // Rayado interior: las nervaduras que llevan los pétalos de las láminas.
  if (opts.rayado && cu > 22 && h > 40){
    let dR = '';
    for (let i = 1; i <= 4; i++){
      const a = -hw*0.58 + hw*1.16*i/5;
      dR += ` M ${P(a, r0 + h*0.26)} L ${P(a*0.30, r1 - h*0.16)}`;
    }
    add(dR.trim(), k, off, true, g*0.5);
  }
  // Festón bajo la base, como el borde dentado de las láminas.
  if (opts.feston)
    add(`M ${P(-hw*0.9, r0)} Q ${P(0, r0 - h*0.13)} ${P(hw*0.9, r0)}`, k, off, true, g*0.7);
}

/* --- Estilo hindú (yantra) ---
   Estructura tradicional, de afuera hacia adentro:
   bhupura (marco cuadrado con cuatro puertas) + rosetas en las esquinas →
   collar de perlas y rayos → círculos concéntricos → orlas decorativas, cada
   una con su contorno interior y su fila de puntos → anillo de loto exterior
   → anillo de loto interior → nueve triángulos entrelazados → bindu.

   El carácter que se busca es el de un mandala de libro para colorear:
   línea fina, muchas capas anidadas, poco vacío.                          */
function generarHindu(semilla, cfg){
  const rnd  = mulberry32((semilla ^ 0x9E3779B9) >>> 0);
  const N    = Math.max(6, cfg.simetria);
  const dens = cfg.densidad / 100;
  const partes = [];
  let zB = 0;   // profundidad de la zona en curso (ver cuerpoMandala)
  const add = (d, k, off, trazo, grosor, tr) =>
    partes.push({ d, k: k || 1, off: off || 0, trazo: !!trazo, grosor: grosor || 0, tr: tr || '', z: zB });
  const fino = 1.5 + dens * 1.7;   // línea fina: es lo que da el aire de lámina para colorear

  // Los aros y collares llevan la profundidad de su propio radio, no la de la
  // zona en curso, para que el orden de dibujado siga siendo de fuera adentro.
  const dobleCirculo = (rad, g) => {
    const z0 = zB; zB = -rad;
    add(circuloPath(0, 0, rad), 1, 0, true, g);
    add(circuloPath(0, 0, rad - 6), 1, 0, true, g * 0.55);
    zB = z0;
  };
  // Collar de perlas: hilera de puntos sobre una circunferencia.
  const collar = (rad, k, rr) => {
    const z0 = zB; zB = -rad;
    const [cx, cy] = pt(0, rad);
    add(circuloPath(cx, cy, rr), k, 180 / k, false, 0);
    zB = z0;
  };
  const rayos = (ra, rb, k, g) => add(`M ${P(0,ra)} L ${P(0,rb)}`, k, 180 / k, true, g);

  // --- Bhupura: el marco cuadrado con las cuatro puertas en T ---
  // No siempre: es el elemento del yantra, pero la lámina de mandala floral
  // clásica no lo lleva y su contorno lo dibujan las puntas de los pétalos.
  // La semilla decide, así que salen de los dos tipos.
  const conMarco = rnd() < 0.45;
  const S = 390;
  if (conMarco){
    zB = -S - 20;                     // el marco, al fondo de todo
    add(ladoBhupura(S, 128, 46, 28), 4, 0, true, fino * 2.0);
    add(ladoBhupura(S - 18, 0, 0, 0), 4, 0, true, fino * 1.2);
    add(ladoBhupura(S - 29, 0, 0, 0), 4, 0, true, fino * 0.8);

    // Rosetas en las cuatro esquinas: sin ellas el cuadrado queda hueco.
    const cE = S - 68, rE = 52;
    zB = -cE * 1.41;
    add(roseta(rE, 8), 4, 0, false, 0, ` translate(${cE},${-cE})`);
    add(roseta(rE * 0.55, 8), 4, 0, true, fino * 0.8, ` translate(${cE},${-cE})`);
  }

  // Sin marco, los pétalos llegan casi al borde y el contorno queda lobulado.
  const R_INT = conMarco ? 322 : 436;
  if (conMarco){
    zB = -348;
    rayos(R_INT + 4, 344, Math.min(96, N * 2), fino * 0.7);
    collar(352, Math.min(96, N * 4), 6 + dens * 3);
  }

  // --- Reparto radial ---
  // Las separaciones se descuentan ANTES de repartir; si no, se comen el
  // núcleo de triángulos, que es el corazón del yantra y debe dominar.
  const SEP = 9;
  // En las láminas de referencia el mandala son CAPAS DE PÉTALOS grandes y
  // superpuestas —tres o cuatro—, no dos anillos de pétalos perdidos entre
  // muchas orlas finas. Las orlas quedan como remate entre capa y capa.
  const nOrlas = Math.min(2, Math.max(0, cfg.anillos - 6));
  const nCapas = Math.max(3, Math.min(6, cfg.anillos - 1));
  // Las capas se generan de fuera adentro (c = 0 es la exterior). El peso CRECE
  // hacia el centro: los pétalos de dentro son grandes y van menguando hacia
  // fuera, como en las láminas de referencia.
  const pesoCapa = c => 0.80 + c * 0.24;
  const pYantra = 0.95, pOrla = 0.40;
  let sumaCapas = 0;
  for (let c = 0; c < nCapas; c++) sumaCapas += pesoCapa(c);
  const sumaPesos = pYantra + sumaCapas + nOrlas * pOrla;
  const u = (R_INT - (1 + nCapas + nOrlas) * SEP) / sumaPesos;
  // Cada zona se asoma hacia FUERA sobre la anterior. Como el orden de
  // dibujado va de fuera adentro, la zona interior queda encima: es el efecto
  // de flor abierta. `r0` no se mueve, así que el reparto radial no cambia.
  // Solape generoso: en una flor abierta la punta de una capa entra bien
  // adentro de la siguiente. Con poco solape las capas se ven como anillos
  // apilados en vez de como pétalos montados.
  const SOL = Math.min(u * 0.55, SEP + 34);
  let r = R_INT;

  // Sin marco no se dibuja el círculo exterior: si estuviera, el contorno del
  // mandala volvería a ser una circunferencia perfecta en vez de las puntas.
  if (conMarco) dobleCirculo(r, fino);

  // --- Orlas decorativas: motivo + contorno interior + fila de puntos ---
  // Van DESPUÉS de las capas de pétalos, o sea hacia dentro. Puestas fuera se
  // comían el borde con anillos finos y los pétalos no llegaban al contorno,
  // que es justo lo contrario de lo que hacen las láminas de referencia.
  const orlas = ['loto','paisley','petalo','gota','escama','punto','radial','triangulo','rombo'];
  const dibujarOrlas = () => {
  let kPrev = 0;
  for (let i = 0; i < nOrlas; i++){
    const alto = u * pOrla;
    const r0 = r - SEP - alto, r1 = r - SEP + SOL;
    if (r0 < 40) break;
    zB = -(r0 + r1) / 2;
    const fasePar = (i % 2) ? 1 : 0;
    // Una orla de cada tantas lleva mini-yantras: el mandala contiene copias
    // de sí mismo. Es la autosimilitud que ya está implícita en el Sri Yantra,
    // hecha explícita.
    if (rnd() < 0.3 && alto > 26){
      const mF = (r0 + r1) / 2;
      const kF = repeticionesParaBanda(N, mF, r1 - r0, rnd);
      const cu = 2 * mF * Math.sin(180 / kF * D2R);
      const sF = Math.min(r1 - r0, cu) / 104;
      const trF = ` translate(0,${(-mF).toFixed(1)}) scale(${sF.toFixed(3)})`;
      const pieza = rnd() < 0.5
        ? `M ${P(0,50)} L ${P(120,50)} L ${P(240,50)} Z M ${P(60,50)} L ${P(180,50)} L ${P(300,50)} Z`
        : sierpinski(50, 3);
      add(pieza, kF, fasePar ? 180 / kF : 0, false, 0, trF);
      r = r0;
      add(circuloPath(0, 0, r), 1, 0, true, fino * 0.75);
      continue;
    }
    const tipo = elegir(rnd, orlas);
    // Repeticiones proporcionadas a la banda: con `repeticionesArmonicas` a
    // secas salían pocas figuras muy separadas y quedaba mucho blanco.
    let k = repeticionesParaBanda(N, (r0 + r1) / 2, r1 - r0, rnd);
    // Para que los pétalos de un anillo caigan ENTRE los del anillo de fuera,
    // las repeticiones se encajan a la mitad, el mismo número o el doble. Con
    // cuentas dispares el desfase de medio sector no intercala nada.
    if (kPrev){
      const cand = [kPrev/2, kPrev, kPrev*2].filter(v => Number.isInteger(v) && v >= 4 && v <= 96);
      if (cand.length) k = cand.reduce((a, b) => Math.abs(b - k) < Math.abs(a - k) ? b : a);
    }
    kPrev = k;
    const esTrazo = !!MOTIVOS[tipo](r0, r1, 1).trazo;
    const hw = (180 / k) * (esTrazo ? 1 : entre(rnd, 0.96, 1));
    const off = fasePar ? 180 / k : 0;
    // Las orlas de pétalo van decoradas como las capas grandes; el resto, no.
    if (!esTrazo && (tipo === 'loto' || tipo === 'petalo') && (r1 - r0) > 30){
      capaPetalos(add, r0, r1, k, off, fino * 0.7, rnd,
                  { forma:'ojival', detalle: dens, perlas:(r1-r0) > 42 });
    } else {
      add(MOTIVOS[tipo](r0, r1, hw, rnd).d, k, off, esTrazo, esTrazo ? fino : 0);
      // Copia interior de contorno: es lo que multiplica el detalle sin
      // añadir figuras nuevas, y deja más zonas para colorear.
      if (!esTrazo && (r1 - r0) > 22)
        add(MOTIVOS[tipo](r0 + alto*0.24, r1 - alto*0.30, hw*0.52, rnd).d, k, off, true, fino * 0.7);
    }
    r = r0;
    if (rnd() < 0.55) collar(r + alto*0.5, Math.min(96, k * 2), Math.min(alto*0.1, 4.5));
    // Un solo aro por defecto: doblarlos todos convierte el mandala en
    // una sopa de circunferencias y se pierden las figuras.
    if (rnd() < 0.35) dobleCirculo(r, fino * 0.75);
    else { const z0 = zB; zB = -r; add(circuloPath(0, 0, r), 1, 0, true, fino * 0.75); zB = z0; }
  }
  };

  // --- Capas de pétalos: el cuerpo de la flor, y lo PRIMERO que se reparte ---
  // La forma se fija por mandala para que las capas sean coherentes entre sí.
  const formaPetalo = elegir(rnd, ['ojival','ojival','ojival','loto']);
  // Las capas alternan N y 2N pétalos, y media vuelta de desfase, para que los
  // de una caigan entre los de la otra. Se solapan mucho: en una flor abierta
  // los pétalos se montan, no se tocan de canto.
  let kCapa = 0, cuerdaBase = 0;
  for (let c = 0; c < nCapas; c++){
    const r0c = r - SEP - u * pesoCapa(c);
    // La capa exterior no se asoma hacia fuera cuando no hay marco: su punta
    // ES el borde del mandala.
    const r1c = (c === 0 && !conMarco) ? r : r - SEP + SOL * 1.6;
    if (r0c < 30) break;
    const midC = (r0c + r1c) / 2;
    // El número de pétalos sale de la circunferencia disponible, no de un N
    // fijo: por eso las capas de fuera llevan muchos más que las de dentro,
    // que es exactamente lo que hace una flor abierta.
    // Cada capa lleva TANTOS pétalos como quepan manteniendo una proporción de
    // pétalo esbelto (ancho ≈ 0.75 del alto). Como el alto crece hacia dentro,
    // el pétalo interior sale más grande igualmente, pero sin quedarse en
    // cuatro figuras sueltas: el suelo es 10.
    // Fijar una cuerda que creciera un 30% por capa —lo anterior— hundía el
    // número hasta 6 pétalos en la capa interior y el anillo se veía vacío.
    const kIdeal = 2 * Math.PI * midC / Math.max((r1c - r0c) * 0.75, 12);
    const kC = Math.max(10, Math.min(40, 2 * Math.round(kIdeal / 2)));
    kCapa = kC;
    zB = -midC;
    capaPetalos(add, r0c, r1c, kC, (c % 2) ? 180 / kC : 0, fino * 0.75, rnd,
                { forma: formaPetalo, detalle: dens,
                  feston: c === 0 && conMarco, rayado: rnd() < dens });
    r = r0c;
    // Nada de aros entre capa y capa: dejaban una banda blanca visible y
    // rompían la continuidad de la flor. Solo un collar de perlas de vez en
    // cuando, que rellena en vez de separar.
    if (rnd() < dens * 0.8) collar(r + u * pesoCapa(c) * 0.45, Math.min(96, kC * 2), 3.2);
  }
  dobleCirculo(r, fino * 0.8);   // un único aro, ya bajo la última capa

  dibujarOrlas();
  collar(r - 9, Math.min(96, N * 2), 3.5);

  // --- Núcleo: la semilla elige cuál de los siete ---
  const Ry = Math.max(r - SEP * 2.2, 34);
  zB = -Ry;
  add(circuloPath(0, 0, Ry + 5), 1, 0, true, fino * 0.6);
  const nucleo = elegir(rnd, NOMBRES_NUCLEOS);
  NUCLEOS[nucleo](add, Ry, fino, rnd, N);

  // --- Bindu: punto central con dos aros ---
  zB = 0;                            // lo más cercano al centro, encima de todo
  const rb = Math.max(Ry * 0.085, 5);
  add(circuloPath(0, 0, rb * 2.6), 1, 0, true, fino * 0.6);
  add(circuloPath(0, 0, rb * 1.7), 1, 0, true, fino * 0.8);
  add(circuloPath(0, 0, rb), 1, 0, false, 0);

  return { semilla, N, partes };
}

/* --- Estilo circuitos: buses concéntricos, trazas con quiebre, pads y chips --- */
function generarCircuito(semilla, cfg){
  const rnd = mulberry32((semilla ^ 0x2C1B3F5D) >>> 0);
  const N = cfg.simetria, dens = cfg.densidad / 100;
  const partes = [];
  let zB = 0;   // profundidad de la banda en curso (ver cuerpoMandala)
  const add = (d, k, off, trazo, grosor, eo) =>
    partes.push({ d, k: k || 1, off: off || 0, trazo: !!trazo, grosor: grosor || 0, evenodd: !!eo, z: zB });
  const g = 2.4 + dens * 2.6;

  // --- Borde del die ---
  // Antes era siempre el mismo anillo de pads gordos, y con lo oscuro que es se
  // comía la mandala entera: seis semillas distintas daban seis bordes idénticos.
  const kPads = Math.min(96, Math.max(8, N * 2));
  const borde = elegir(rnd, ['pads','datos','escala']);
  if (borde === 'pads')
    add(MOTIVOS.padIO(R_MAX - 42, R_MAX, 180 / kPads * 0.62).d, kPads, 0, false, 0);
  else if (borde === 'datos')
    add(MOTIVOS.anilloDatos(R_MAX - 34, R_MAX, 180 / Math.max(6, Math.round(kPads/4)) * 0.96).d,
        Math.max(6, Math.round(kPads / 4)), 0, false, 0);
  else
    add(MOTIVOS.escalaRadial(R_MAX - 38, R_MAX, 180 / Math.max(8, Math.round(kPads/3)) * 0.96).d,
        Math.max(8, Math.round(kPads / 3)), 0, false, 0);

  // --- Anillos de potencia VDD / VSS ---
  add(circuloPath(0, 0, R_MAX - 52), 1, 0, true, g * 2.6);
  add(circuloPath(0, 0, R_MAX - 66), 1, 0, true, g * 1.1);

  // Coloca un motivo dentro de unos límites respetando su trazo y su evenodd.
  const poner = (tipo, ra, rb, kk, anc, oo, forzarTrazo) => {
    if (rb - ra < 4) return;
    const m = MOTIVOS[tipo](ra, rb, (180 / kk) * anc, rnd);
    const esTrazo = forzarTrazo || !!m.trazo;
    add(m.d, kk, oo, esTrazo, esTrazo ? g * (forzarTrazo ? 0.55 : 1) : 0, !!m.evenodd);
  };

  // El núcleo del die vive dentro del anillo de I/O: se comprimen las bandas.
  const f = (R_MAX - 78 - R_MIN) / (R_MAX - R_MIN);
  let previa = '';
  bandas(cfg, rnd, 0.06, 0.90).forEach(([b0, b1, ba]) => {
    const r0 = R_MIN + (b0 - R_MIN) * f, r1 = R_MIN + (b1 - R_MIN) * f, h = ba * f;
    zB = -(r0 + r1) / 2;

    // Tres familias, y nunca dos bandas seguidas de la misma. El estilo se veía
    // repetitivo porque todas las bandas salían del mismo saco de motivos: con
    // ocho anillos, casi siempre tocaban dos o tres iguales.
    // Una banda de cada cuatro se deja casi vacía: el aire es la mitad del
    // look de las referencias. Llenando las ocho coronas, el resultado se
    // vuelve una maraña donde no se distingue ninguna pieza.
    // Menos bandas vacías cuanto más alto el Detalle: es lo que más se nota al
    // mover el deslizador en este estilo.
    const fam = rnd() < 0.34 - dens * 0.24 && previa !== 'aire'
      ? 'aire'
      : elegir(rnd, ['hud','rutado','bloques'].filter(x => x !== previa));
    previa = fam;

    // Las repeticiones salen de la proporción de la banda, no de un armónico
    // suelto: con `repeticionesArmonicas` una banda ancha se quedaba con seis
    // piezas y el anillo salía medio vacío. El HUD quiere tramos anchos (pocos)
    // y el rutado también: una pista tiene que ser larga para leerse como
    // pista — troceada en cuarenta copias diminutas es pelusa.
    const mid = (r0 + r1) / 2;
    const prop = fam === 'hud' ? 2.1 : fam === 'rutado' ? 1.7 : 0.95;
    // Tope de repeticiones por familia. Sin tope, en una banda estrecha el
    // reparto proporcional pide sesenta copias y la escala de marcas deja de
    // leerse como escala: es un peine.
    const k = Math.min(repeticionesParaBanda(N, mid, h, rnd, prop),
                       fam === 'rutado' ? 20 : fam === 'hud' ? 24 : 30);
    const hw = 180 / k;
    const off = rnd() < 0.5 ? hw : 0;

    if (fam === 'aire'){
      if (rnd() < 0.6) poner('flechaTicks', r0 + h*0.30, r1 - h*0.30,
                             elegir(rnd, [3, 4, 6]), 0.5, off);
      add(circuloPath(0, 0, r1), 1, 0, true, g * (rnd() < 0.4 ? 1.8 : 0.7));
      return;
    }

    if (fam === 'hud'){
      // Instrumento: arcos partidos, bloques sobre el arco y escalas.
      const tipo = h > 44 ? elegir(rnd, ['arcoBloques','arcoSegmentado','anilloDatos','arcoBloques'])
                          : elegir(rnd, ['escalaRadial','anilloDatos','flechaTicks','escalaRadial']);
      poner(tipo, r0, r1, k, 0.98, off);
      if (h > 44 && rnd() < 0.35 + dens * 0.45)
        poner('escalaRadial', r0 + h*0.68, r1, k, 0.90, off + hw);
      if (rnd() < 0.10 + dens * 0.45)
        poner('cunaHud', r0, r1, Math.max(3, Math.round(k / 2)), 0.90, off);
      if (h > 30 && rnd() < dens * 0.55)
        poner('flechaTicks', r0 + h*0.20, r1 - h*0.20, k, 0.40, off + hw);

    } else if (fam === 'rutado'){
      // Capa de metal: pistas con quiebre, buses a 45° y sus vías.
      const tipo = h > 44 ? elegir(rnd, ['busDiagonal','trazaVia','busDiagonal','manhattan'])
                          : elegir(rnd, ['manhattan','trazaVia','manhattan']);
      poner(tipo, r0, r1, k, 0.98, off);
      // Segunda pasada desfasada: en las referencias las pistas van en haz, no
      // sueltas. Una sola pasada dejaba la banda casi vacía.
      if (rnd() < 0.25 + dens * 0.6) poner(tipo, r0 + h*0.10, r1 - h*0.10, k, 0.72, off + hw*0.5);
      if (tipo === 'manhattan') poner('viaCuadrada', r0 + h*0.30, r0 + h*0.54, k, 0.94, off);
      if (rnd() < 0.55)
        poner(elegir(rnd, ['viaRedonda','padTermina','viaCuadrada']),
              r0 + h*0.18, r1 - h*0.18, k, 0.90, off + hw);
      // Vías sueltas: las controla el deslizador de Detalle.
      if (dens > 0.35 && h > 28)
        poner('viaCuadrada', r0 + h*0.60, r0 + h*0.86, k, 0.90, off + hw);

    } else {
      // Bloques del die: macros, celdas, conectores y retículas de puntos.
      const tipo = h > 44 ? elegir(rnd, ['chip','celdas','conector','matrizPuntos','arrayMem'])
                          : elegir(rnd, ['celdas','matrizPuntos','pad','pines','conector']);
      // El macro de memoria son siete líneas por sector: repetido treinta veces
      // es una trama de doscientas líneas, no un macro.
      const kk = tipo === 'arrayMem' ? Math.min(k, 12) : k;
      poner(tipo, r0, r1, kk, 0.98, off);
      if (tipo === 'chip') poner('pines', r0, r1, k, 0.94, off, true);
      if (h > 44 && rnd() < 0.20 + dens * 0.6)
        poner(elegir(rnd, ['viaRedonda','matrizPuntos','flechaTicks']),
              r0 + h*0.24, r1 - h*0.24, k, 0.44, off + hw);
      if (h > 26 && rnd() < dens * 0.5)
        poner('viaRedonda', r0 + h*0.10, r0 + h*0.34, k, 0.36, off + hw);
    }
    // Aros: gruesos y finos alternados, como los buses de potencia.
    if (rnd() < 0.62) add(circuloPath(0, 0, r1), 1, 0, true, g * (rnd() < 0.3 ? 2.4 : 0.9));
  });

  // --- Pistas largas que cruzan varias coronas y mueren en un pad ---
  // En las referencias son lo que ata el conjunto: sin ellas cada anillo va a
  // lo suyo y el dibujo se lee como coronas apiladas, no como una placa.
  if (rnd() < 0.85){
    const kL = elegir(rnd, [6, 8, 12, 16]), hwL = 180 / kL;
    const ra = R_MIN * 3.4, rb = R_MAX - 74, s = rnd() < 0.5 ? 1 : -1;
    zB = -(ra + rb) / 2;
    add(`M ${P(-s*hwL*0.26, ra)} L ${P(-s*hwL*0.26, ra + (rb-ra)*0.36)} `
      + `L ${P(s*hwL*0.12, ra + (rb-ra)*0.48)} L ${P(s*hwL*0.12, rb)}`,
        kL, 0, true, g * 0.9);
    add(circuloPath(...pt(s*hwL*0.12, rb), Math.max(g * 1.5, 5)), kL, 0, false, 0);
  }

  // --- Centro: en las referencias es un disco vacío rodeado de escalas ---
  const Rc = R_MIN * 2.6;
  zB = 0;
  add(circuloPath(0, 0, Rc), 1, 0, true, g * 2);
  add(MOTIVOS.escalaRadial(Rc * 0.60, Rc * 0.96, 180 / 12 * 0.9).d, 12, 0, false, 0);
  add(circuloPath(0, 0, Rc * 0.50), 1, 0, true, g * 0.8);
  add(circuloPath(0, 0, R_MIN * 0.5), 1, 0, false, 0);
  return { semilla, N, partes };
}

/* --- Estilo naturaleza: dendritas de copo de nieve, hojas y venas --- */
function generarNatura(semilla, cfg){
  const rnd = mulberry32((semilla ^ 0x7E5A11C3) >>> 0);
  const N = cfg.simetria, dens = cfg.densidad / 100;
  const partes = [];
  let zB = 0;   // profundidad de la banda en curso (ver cuerpoMandala)
  const add = (d, k, off, trazo, grosor, tr, eo) =>
    partes.push({ d, k: k || 1, off: off || 0, trazo: !!trazo, grosor: grosor || 0,
                  tr: tr || '', evenodd: !!eo, z: zB });

  const bs = bandas(cfg, rnd, 0.14, 1.06, 0.18);
  const fase = rnd() < 0.5 ? 0 : 1;

  // El centro es SIEMPRE una fractal, y ocupa las dos primeras bandas enteras
  // para que se vea. Con un radio pequeño la idea de fractal no se lee.
  //
  // Aquí NO entran el copo de Koch ni el triángulo de Sierpinski aunque sean
  // las fractales de manual: los dos se construyen sobre un triángulo
  // equilátero y el triángulo no dice naturaleza — dice geometría. Las que
  // quedan son las que la naturaleza usa de verdad: dendrita de hielo,
  // filotaxis, empaquetado de burbujas y espiral logarítmica. Todas cerradas,
  // porque una fractal en trazo suelto no se puede pintar.
  const Rc = bs.length > 1 ? bs[1][1] : R_MIN * 4;
  const centro = elegir(rnd, ['dendrita','filotaxis','burbujas','espiral','dendrita','filotaxis']);
  if (centro === 'dendrita'){
    add(copoDendrita(Rc, 3), 1, 0, false, 0);
    add(circuloPath(0, 0, Rc * 0.16), 1, 0, false, 0);
  } else if (centro === 'burbujas'){
    add(circulosFractal(Rc, 3), 1, 0, false, 0, '', true);
    add(circuloPath(0, 0, Rc), 1, 0, true, 2.2);
  } else if (centro === 'espiral'){
    // Corona de nautilos: la espiral logarítmica es más legible repetida en
    // anillo que una sola grande en el centro.
    add(MOTIVOS.nautilo(Rc*0.20, Rc*0.98, 36).d, 5, 0, false, 0, '', true);
    add(circuloPath(0, 0, Rc*0.17), 1, 0, false, 0);
    add(circuloPath(0, 0, Rc), 1, 0, true, 2.2);
  } else {
    add(filotaxis(R_MIN * 0.2, Rc, 60 + Math.round(dens * 120)), 1, 0, false, 0);
    add(circuloPath(0, 0, Rc), 1, 0, true, 2.2);
  }
  // Una banda lleva un collar de fractales sueltas: es lo que hace que la
  // autosimilitud se note a simple vista y no solo en el centro.
  const bandaFractal = 2 + Math.floor(rnd() * Math.max(1, bs.length - 2));

  bs.forEach(([r0, r1, alto], iB) => {
    if (iB < 2) return;                       // reservadas para el centro
    zB = -(r0 + r1) / 2;
    if (iB === bandaFractal && alto > 34){
      const mid = (r0 + r1) / 2;
      const k = repeticionesParaBanda(N, mid, alto, rnd);
      const off = rnd() < 0.5 ? 180 / k : 0;
      // Collar de fractales: copos de hielo completos, o piezas que crecen por
      // recursión (fronda, dendrita, nautilo). Todas rellenas.
      if (rnd() < 0.5){
        const cuerda = 2 * mid * Math.sin(180 / k * D2R);
        const s = Math.min(alto, cuerda) / 108;
        add(copoDendrita(50, 2), k, off, false, 0,
            ` translate(0,${(-mid).toFixed(1)}) scale(${s.toFixed(3)})`);
      } else {
        const tipo = elegir(rnd, ['fronda','dendrita','nautilo','escamaPina']);
        const m = MOTIVOS[tipo](r0, r1, 180 / k * 0.96, rnd);
        add(m.d, k, off, false, 0, '', !!m.evenodd);
      }
      add(circuloPath(0, 0, r1), 1, 0, true, 2);
      return;
    }
    const mid = (r0 + r1) / 2;
    const k = repeticionesParaBanda(N, mid, alto, rnd), hw = 180 / k;
    // Igual que en el estilo geométrico: una banda ancha con un motivo fino
    // queda vacía, así que por encima de cierto alto solo entran los que llenan.
    // Tres familias: tierra (flores y hojas), agua y viento. Cada mandala
    // toma la suya para que el conjunto tenga un tema, no una ensalada.
    const familia = ['tierra','agua','viento'][(iB + Math.floor(rnd()*3)) % 3];
    // Casi todo relleno: en una lámina para colorear, un anillo de trazo suelto
    // es un anillo que no se puede pintar. Los de línea quedan como acento.
    const anchos = {
      tierra: ['flor','flor','hoja','hojaLobulada','fronda','ramaHojas','escamaPina','hoja'],
      agua:   ['ola','gotaAgua','ola','flor','cumulo','ondaBanda','cumulo'],
      viento: ['remolinoAncho','rachaAncha','remolinoAncho','hoja','dendrita','rachaAncha']
    };
    const finos = {
      tierra: ['semillero','punto','escamaPina','ramaHojas','escama','hoja','vena','nautilo'],
      agua:   ['ondaBanda','cumulo','punto','gotaAgua','nautilo','onda'],
      viento: ['rachaAncha','dendrita','remolinoAncho','semillero','punto','racha']
    };
    const tipo = alto > 44 ? elegir(rnd, anchos[familia]) : elegir(rnd, finos[familia]);
    const off = ((iB + fase) % 2) ? hw : 0;

    // Las capas anchas de hoja o pétalo van decoradas: contornos anidados,
    // gota dentro y perlas siguiendo el borde. Es lo que separa una lámina de
    // mandala de un anillo de manchas.
    if ((tipo === 'hoja' || tipo === 'hojaLobulada') && alto > 52){
      capaPetalos(add, r0, r1, k, off, 2.6, rnd,
                  { forma: rnd() < 0.5 ? 'ojival' : 'hoja', feston: rnd() < 0.5 });
    } else if (tipo === 'flor'){
      // Las flores se colocan como pieza completa, no como sector.
      const cuerda = 2 * mid * Math.sin(hw * D2R);
      const s = Math.min(alto, cuerda) / 98;
      const nP = elegir(rnd, [5, 6, 8, 12]);
      const tr = ` translate(0,${(-mid).toFixed(1)}) scale(${s.toFixed(3)})`;
      add(roseta(50, nP, 0.24), k, off, false, 0, tr);
      add(roseta(26, nP, 0.30), k, off, true, 2.6, tr);
    } else if (tipo === 'arbol'){
      add(arbolFractal(r0, r1, alto > 90 ? 4 : 3), k, off, true, entre(rnd, 2.2, 3.6));
    } else {
      const m = MOTIVOS[tipo](r0, r1, hw * entre(rnd, 0.95, 1), rnd);
      add(m.d, k, off, !!m.trazo, m.trazo ? entre(rnd, 3, 5.5) : 0);
      // La vena va con el mismo desfase que la hoja o queda desalineada.
      if ((tipo === 'hoja' || tipo === 'hojaLobulada') && alto > 50)
        add(MOTIVOS.vena(r0 + alto*0.12, r1 - alto*0.12, hw*0.45).d, k, off, true, 2);
    }
    // Semillas entre las hojas: rellenan el hueco que dejan los motivos
    // grandes y son lo que da textura al estilo.
    if (alto > 40 && rnd() < 0.5 + dens * 0.4){
      const [cx, cy] = pt(0, r0 + alto * 0.5);
      add(circuloPath(cx, cy, Math.min(alto * 0.11, 7)), k, off ? 0 : hw, false, 0);
    }
    // Adornos que solo aparecen con el Detalle alto: sin esto el deslizador no
    // cambiaba nada en este estilo (medido: 16 piezas a 0, 18 a 100).
    if (alto > 34 && rnd() < dens * 0.7){
      const m = MOTIVOS.semillero(r0 + alto*0.16, r1 - alto*0.16, hw * 0.5, rnd);
      add(m.d, k, off + hw, false, 0);
    }
    if (alto > 46 && rnd() < dens * 0.6)
      add(MOTIVOS.vena(r0 + alto*0.18, r1 - alto*0.14, hw*0.40).d, k, off, true, 1.8);
    // Ningún aro en la última banda: así el contorno del mandala lo dibujan
    // las puntas de los pétalos y queda lobulado, no un círculo perfecto.
    if (iB < bs.length - 1 && rnd() < 0.4)
      add(circuloPath(0, 0, r1), 1, 0, true, entre(rnd, 1.5, 3));
  });
  return { semilla, N, partes };
}

/* --- Estilo animales: siluetas curadas distribuidas por los anillos --- */
function generarAnimales(semilla, cfg){
  const rnd = mulberry32((semilla ^ 0x51ED270B) >>> 0);
  const N = cfg.simetria, dens = cfg.densidad / 100;
  const partes = [];
  let zB = 0;   // profundidad de la banda en curso (ver cuerpoMandala)
  const add = (d, k, off, trazo, grosor, tr) =>
    partes.push({ d, k: k || 1, off: off || 0, trazo: !!trazo, grosor: grosor || 0, tr: tr || '', z: zB });
  const nombres = Object.keys(SILUETAS);

  add(circuloPath(0, 0, R_MIN * 0.8), 1, 0, false, 0);
  let usadas = 0;

  const faseA = rnd() < 0.5 ? 0 : 1;
  bandas(cfg, rnd, 0.16, 1.05, 0.16).forEach(([r0, r1, alto], i) => {
    const mid = (r0 + r1) / 2;
    zB = -mid;
    // Las siluetas necesitan sitio: por debajo de cierto alto no se leen.
    if (alto > 44 && (usadas === 0 || rnd() < 0.8)){
      usadas++;
      // Muchas repeticiones = siluetas diminutas. Se limita a 12.
      const k = repeticionesArmonicas(Math.max(4, Math.min(N, 12)), rnd);
      const cuerda = 2 * mid * Math.sin(180 / k * D2R);
      const s = Math.min(alto, cuerda) / 94;
      const off = ((i + faseA) % 2) ? 180 / k : 0;
      add(SILUETAS[elegir(rnd, nombres)], k, off, false, 0,
          ` translate(0,${(-mid).toFixed(1)}) scale(${s.toFixed(3)})`);
      // Puntos en el hueco entre siluetas: sin esto el anillo se ve vacío,
      // porque las siluetas son pocas y no llenan la circunferencia.
      const [px, py] = pt(0, mid);
      add(circuloPath(px, py, Math.min(alto * 0.09, 6)), k, off + 180 / k, false, 0);
      // Collar extra, controlado por el deslizador de Detalle.
      if (dens > 0.35){
        const [qx, qy] = pt(0, r0 + alto * 0.14);
        add(circuloPath(qx, qy, Math.min(alto * 0.05, 4)), k * 2, 0, false, 0);
      }
    } else {
      const k = repeticionesParaBanda(N, mid, alto, rnd), hw = 180 / k;
      const tipo = elegir(rnd, ['punto','hoja','arco','escama','rombo','circulo']);
      const m = MOTIVOS[tipo](r0, r1, hw * entre(rnd, 0.95, 1), rnd);
      add(m.d, k, ((i + faseA) % 2) ? hw : 0, !!m.trazo, m.trazo ? entre(rnd, 2.5, 5) : 0);
    }
    if (rnd() < 0.6) add(circuloPath(0, 0, r1), 1, 0, true, entre(rnd, 2, 4.5));
  });
  return { semilla, N, partes };
}

/* --- Estilo robots: engranajes, tuercas, paneles y antenas --- */
function generarRobot(semilla, cfg){
  const rnd = mulberry32((semilla ^ 0x3D9A61B7) >>> 0);
  const N = cfg.simetria, dens = cfg.densidad / 100;
  const partes = [];
  let zB = 0;   // profundidad de la banda en curso (ver cuerpoMandala)
  const add = (d, k, off, trazo, grosor, eo) =>
    partes.push({ d, k: k || 1, off: off || 0, trazo: !!trazo, grosor: grosor || 0, evenodd: !!eo, z: zB });
  const g = 3 + dens * 3;

  // Núcleo: el ojo del mecha. Monoojo tipo Zaku o visor con cresta en V.
  const kOjo = Math.max(4, Math.min(12, N));
  if (rnd() < 0.5){
    add(MOTIVOS.monoojo(R_MIN * 0.5, R_MIN * 2.0, 180 / kOjo).d, kOjo, 0, false, 0);
  } else {
    add(MOTIVOS.visor(R_MIN * 0.5, R_MIN * 1.7, 180 / kOjo).d, kOjo, 0, false, 0);
    add(MOTIVOS.vfin(R_MIN * 1.7, R_MIN * 2.4, 180 / kOjo).d, kOjo, 0, false, 0);
  }
  add(circuloPath(0, 0, R_MIN * 2.6), 1, 0, true, g * 1.6);

  // Coloca un motivo dentro de unos límites, respetando su trazo y evenodd.
  const poner = (tipo, ra, rb, kk, anc, oo, forzarTrazo) => {
    if (rb - ra < 4) return;
    const m = MOTIVOS[tipo](ra, rb, (180 / kk) * anc, rnd);
    const esTrazo = forzarTrazo || !!m.trazo;
    add(m.d, kk, oo, esTrazo, esTrazo ? g * (forzarTrazo ? 0.5 : 1) : 0, !!m.evenodd);
  };

  // Sombreado cel. La sombra es una CUÑA recortada con la propia pieza, no una
  // copia desplazada: así queda siempre DENTRO de la figura, con el borde duro
  // atravesándola, que es como sombrea el anime. Con una copia desplazada, en
  // las piezas estrechas (un cañón, una antena) la sombra caía fuera y parecía
  // sombra proyectada al lado del objeto.
  const sombra = (tipo, ra, rb, kk, anc, oo) => {
    if (rb - ra < 12) return;
    const sector = (180 / kk) * anc;
    const m = MOTIVOS[tipo](ra, rb, sector, rnd);
    if (m.trazo) return;
    const a = Math.max(ra - 30, 1), b = rb + 30;
    const cuna = `M ${P(-sector*1.6, a)} L ${P(-sector*1.6, b)} `
               + `L ${P(-sector*0.12, b)} L ${P(-sector*0.12, a)} Z`;
    partes.push({ d: cuna, recorte: m.d, recorteEo: !!m.evenodd,
                  k: kk, off: oo, trazo: false, grosor: 0, z: zB, sombra: true });
  };

  const faseR = rnd() < 0.5 ? 0 : 1;
  bandas(cfg, rnd, 0.10, 1.05, 0.18).forEach(([r0, r1, alto], iB) => {
    const mid = (r0 + r1) / 2;
    zB = -mid;
    const k = repeticionesParaBanda(N, mid, alto, rnd), hw = 180 / k;
    const off = ((iB + faseR) % 2) ? hw : 0;
    const h = r1 - r0;

    // --- Banda ancha: CONJUNTO DE PLACA, no un motivo suelto ---
    // Esto es lo que separa un mandala geométrico de una pieza de maquinaria:
    // una placa base con sus detalles anidados dentro de sus propios límites
    // (rótulo, tornillería, ranura), más una pieza pequeña intercalada entre
    // placa y placa. Un solo motivo repetido nunca lee como máquina.
    if (alto > 56){
      const fam = rnd();

      // Corona de artillería. Solo la familia del cañón: los tubos son
      // alargados y si llenan el sector salen achatados, así que van
      // estrechos y el hueco se rellena con una pieza intercalada.
      if (fam < 0.16){
        const arma = elegir(rnd, ['canon','canonDoble','railgun','multitubo','bocacha']);
        poner(arma, r0, r1, k, 0.60, off);
        sombra(arma, r0, r1, k, 0.60, off);
        poner(elegir(rnd, ['acople','rotula','brida','cruzAviso','tuerca','diamante']),
              r0 + h*0.26, r1 - h*0.26, k, 0.36, off + hw);
        if (rnd() < dens * 0.7) poner('desgaste', r0, r1, k, 0.55, off, true);
        if (rnd() < 0.45) add(circuloPath(0, 0, r1), 1, 0, true, g * 0.7);
        return;
      }

      // Corona de cabezas: lo que identifica al mecha de un vistazo. El casco
      // lleva su visor dentro y las antenas se intercalan entre casco y casco.
      if (fam < 0.30){
        const cara = elegir(rnd, ['cascoMecha','cascoMecha','ojoVisor']);
        poner(cara, r0, r1, k, 0.92, off);
        sombra(cara, r0, r1, k, 0.92, off);
        if (cara === 'cascoMecha' && rnd() < 0.7)
          poner('ojoVisor', r0 + h*0.22, r0 + h*0.60, k, 0.52, off);
        poner(elegir(rnd, ['antenaDoble','antenaDoble','sensor','pines']),
              r0 + h*0.10, r1 - h*0.14, k, 0.34, off + hw);
        if (rnd() < dens * 0.6) poner('desgaste', r0, r1, k, 0.7, off, true);
        if (rnd() < 0.5) add(circuloPath(0, 0, r1), 1, 0, true, g * 0.7);
        return;
      }

      // Corona de uniones y transmisión: rótulas, bisagras y piñones. Es el
      // rasgo que más se repite en las referencias — el mecha se lee por
      // cómo están articuladas sus piezas, no solo por la chapa.
      if (fam < 0.46){
        const un = elegir(rnd, ['rotula','bisagra','acople','pinon']);
        poner(un, r0, r1, k, 0.86, off);
        sombra(un, r0, r1, k, 0.86, off);
        poner(elegir(rnd, ['pinon','tuerca','remaches','brida','cruzAviso']),
              r0 + h*0.24, r1 - h*0.24, k, 0.38, off + hw);
        if (rnd() < dens * 0.6) poner('desgaste', r0, r1, k, 0.7, off, true);
        if (rnd() < 0.5) add(circuloPath(0, 0, r1), 1, 0, true, g * 0.7);
        return;
      }

      const base = elegir(rnd, ['blindaje','blindaje','chapaOndulada','viga','refuerzo',
                                'capsula','escotilla','hombrera','ala','ojiva','thruster']);
      poner(base, r0, r1, k, 0.99, off);
      sombra(base, r0, r1, k, 0.99, off);                          // sombreado cel
      poner(base, r0 + h*0.11, r1 - h*0.11, k, 0.76, off, true);   // línea de panel

      // Detalle en el tercio exterior de la placa: la señalética.
      poner(elegir(rnd, ['etiqueta','placaTexto','teclas','codigo','flechaDir','flechaDir',
                         'peligro','barrasAviso','trianguloAviso','cruzAviso','diamante']),
            r0 + h*0.56, r1 - h*0.13, k, 0.58, off);
      // Detalle en el tercio interior: tornillería, unión o engranaje.
      poner(elegir(rnd, ['brida','discoJunta','remaches','rejilla','sensor','diana',
                         'tuerca','perilla','pinon','rotula','acople','bisagra']),
            r0 + h*0.14, r0 + h*0.44, k, 0.52, off);
      // Pieza pequeña ENTRE placas: rompe la uniformidad del anillo.
      if (rnd() < 0.8)
        poner(elegir(rnd, ['pinon','rotula','acople','bisagra','tuerca','brida',
                           'punto','pines','cruzAviso','flechaDir','refuerzo']),
              r0 + h*0.28, r1 - h*0.28, k, 0.40, off + hw);
      // Desgaste: rayas de uso sobre el blindaje.
      if (rnd() < dens) poner('desgaste', r0, r1, k, 0.9, off, true);
      if (rnd() < dens * 0.5) poner('desgaste', r0 + h*0.3, r1, k, 0.6, off + hw*0.5, true);
      if (rnd() < 0.45) add(circuloPath(0, 0, r1), 1, 0, true, g * 0.7);
      return;
    }

    // --- Banda estrecha: rótulo de bahía, o una pieza suelta ---
    if (alto > 34 && rnd() < 0.30){
      const kN = Math.max(4, Math.min(k, 12));
      const cuerda = 2 * mid * Math.sin(180 / kN * D2R);
      const txt = codigoBahia(rnd);
      const sN = Math.min(alto * 0.72, cuerda / Math.max(txt.length, 1) * 1.5) / 74;
      add(textoPath(txt), kN, ((iB + faseR) % 2) ? 180 / kN : 0, false, 0,
          ` translate(0,${(-mid).toFixed(1)}) scale(${sN.toFixed(3)})`);
      if (rnd() < 0.6) add(circuloPath(0, 0, r1), 1, 0, true, g * 0.7);
      return;
    }

    const tipo = elegir(rnd, ['etiqueta','placaTexto','diamante','trianguloAviso','cruzAviso',
                              'barrasAviso','flechaDir','flechaDir','peligro','codigo','teclas',
                              'brida','discoJunta','remaches','tuerca','pines','diana','sensor',
                              'rotula','rotula','bisagra','acople','pinon','pinon','engranaje',
                              'viga','refuerzo','chapaOndulada','corrugada','eslabon',
                              'articulacion','piston','pistonVastago','cable','ranura',
                              'rejilla','radiador','perilla','diente','antena','antenaDoble',
                              'ojoVisor','capsula','multitubo','bocacha']);
    const m = MOTIVOS[tipo](r0, r1, hw * (tipo === 'diente' ? 1 : entre(rnd, 0.94, 1)), rnd);
    // El engranaje ya es una corona completa: repetirlo k veces solo apila
    // copias idénticas encima de sí mismo.
    const kM = tipo === 'engranaje' ? 1 : k;
    add(m.d, kM, tipo === 'engranaje' ? 0 : off, !!m.trazo, m.trazo ? g : 0, !!m.evenodd);
    if (tipo === 'diente') add(circuloPath(0, 0, r0 + alto * 0.05), 1, 0, true, g * 1.8);
    if (rnd() < 0.5) add(circuloPath(0, 0, r1), 1, 0, true, g * 0.7);
  });
  return { semilla, N, partes };
}

  africano: { motivos:['romboAnidado','triRayado','greca','espiralAfr','ojoAfr','dientes','lente',
                       'chevron','escalera','damero','abanico','zigzagMulti','ojo','triangulo','peine'],
              ancho:[0.96, 1.00], grosor:[6, 12], aros:0.5, hueco:1.04, solape:0.22,
              // Cenefas apiladas: cada anillo lleva su motivo MÁS una tira de
              // textura, que es como se construyen los tejidos de referencia.
              compuesto:['conteo','punto','zigzagMulti','damero','radial','greca'] }
};

const ESTILOS = {
  geo:      { n:'Geométrico',     pal:'Clásico',  gen:(s,c) => generarAnillos(s, c, VOC.geo) },
  hindu:    { n:'Hindú · Yantra', pal:'Flor',     gen:generarHindu },
  africano: { n:'Africano',       pal:'Kente',    gen:(s,c) => generarAnillos(s, c, VOC.africano) },
  circuito: { n:'Circuitos',      pal:'Circuito', gen:generarCircuito },
  natura:   { n:'Naturaleza',     pal:'Escarcha', gen:generarNatura },
  animal:   { n:'Animales',       pal:'Fauna',    gen:generarAnimales },
  robot:    { n:'Robots · Mecha', pal:'Casco',    gen:generarRobot }
};

function generar(semilla, cfg){
  const id = (ESTILOS[cfg.estilo] && limites().estilos.includes(cfg.estilo)) ? cfg.estilo : 'geo';
  const m = ESTILOS[id].gen(semilla, cfg);
  m.estilo = id;
  return m;
}

function instantanea(){
  return JSON.stringify({ s:estado.semilla, c:estado.cfg, p:estado.paleta, k:estado.colores,
                          f:estado.fondo, v:estado.vista, l:estado.lineas, t:estado.trazos,

                          n:estado.pincel, q:estado.piezas });
}
/* Lo que se está pintando sobrevive a cerrar la app. Se guarda la misma
   instantánea que usa el historial —semilla, ajustes, paleta y el color de cada
   figura—, que son menos de 1 KB: nunca la imagen. Al volver, el mandala se
   regenera de la semilla y se le aplican los colores guardados. */
const GUARDADO = 'mandalas.actual';
function guardarActual(){
  try { localStorage.setItem(GUARDADO, instantanea()); } catch {}
}

/* --- Galería ---------------------------------------------------------------
   El guardado automático conserva UNA sola mandala: la que se está pintando.
   Generar otra la reemplaza, que para una app de colorear es perder el trabajo.
   La galería guarda las que uno quiera conservar, con el mismo formato: la
   receta, no la imagen. Treinta entradas son unos 25 KB.                     */
const GALERIA = 'mandalas.galeria', GAL_MAX = 30;
function galeria(){
  try { const l = JSON.parse(localStorage.getItem(GALERIA) || '[]'); return Array.isArray(l) ? l : []; }
  catch { return []; }
}
function escribirGaleria(lista){
  // Si no cabe, se sueltan las más viejas en vez de fallar en silencio.
  for (let i = 0; i < 4; i++){
    try { localStorage.setItem(GALERIA, JSON.stringify(lista)); return true; }
    catch { lista = lista.slice(0, Math.max(1, Math.floor(lista.length / 2))); }
  }
  return false;
}

// `guardar:false` para el arranque cuando se abre el enlace compartido de otra
// persona: mirar un mandala ajeno no puede borrar el que uno tenía a medio
// pintar. En cuanto se toca algo, se guarda — ahí sí se cambió de trabajo.
function empujar(guardar){
  const snap = instantanea();
  if (guardar !== false) guardarActual();
  if (historial[hPtr] === snap) return;
  historial.splice(hPtr + 1);
  historial.push(snap);
  if (historial.length > 40) historial.shift();
  hPtr = historial.length - 1;
  botonesHistorial();
}
function aplicarSnap(snap){
  const o = JSON.parse(snap);
  estado.semilla = o.s; estado.cfg = o.c; estado.paleta = o.p;
  estado.colores = o.k; estado.fondo = o.f; estado.vista = o.v; estado.lineas = o.l;
  estado.trazos = o.t || 'tinta';
  estado.acabado = o.a || 'plano';
  estado.enBlanco = !!o.b;
  estado.fondoColor = o.g || null;
  estado.pincel = o.n || 'anillo';
  estado.piezas = (o.q && typeof o.q === 'object') ? o.q : {};
  mandala = generar(estado.semilla, estado.cfg);
  // Red de seguridad para lo que se restaura de una sesión anterior: si la app
  // se actualizó y ese estilo ahora genera otro número de figuras, los colores
  // guardados ya no corresponden y saldrían piezas grises sueltas.
  if (estado.colores.length !== mandala.partes.length) colorearInicial();
  sincronizarControles();
  pintar(false);
  botonesHistorial();
}
function deshacer(){ if (hPtr > 0){ hPtr--; aplicarSnap(historial[hPtr]); } }
function rehacer(){ if (hPtr < historial.length - 1){ hPtr++; aplicarSnap(historial[hPtr]); } }
function botonesHistorial(){
  bDeshacer.disabled = hPtr <= 0;
  bRehacer.disabled  = hPtr >= historial.length - 1;
}

// Color sólido del fondo/material. null = transparente.
function colorFondo(){
  // El papel es SIEMPRE el último color de la paleta, no el quinto: hay paletas
  // de siete para que el coloreado automático tenga más variedad.
  if (estado.fondo === 'paleta'){
    const c = PALETAS[estado.paleta].c;
    return c[c.length - 1];
  }
  const f = FONDOS.find(x => x.id === estado.fondo);
  return f ? f.color : '#ffffff';
}
// Color sólido y opaco equivalente al fondo, para tapar en modo línea. El
// degradado de oro no sirve dentro de un grupo escalado (la maqueta): se
// resolvería en otra escala y se verían las costuras.
function opaco(c){
  if (!c) return '#ffffff';
  return c.startsWith('url') ? '#D4AF37' : c;
}
// Tinta que contrasta con el fondo elegido, para el modo "solo líneas".
function tinta(){
  const c = colorFondo();
  if (!c || c.startsWith('url')) return '#111111';
  const h = c.replace('#','');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (0.2126*r + 0.7152*g + 0.0722*b) > 140 ? '#111111' : '#ffffff';
}
/* Lienzo en blanco: la mandala queda como una lámina recién impresa —papel y
   contornos de tinta— y el usuario la pinta figura por figura.

   No hace falta un modo de dibujo aparte: basta con que TODOS los rellenos
   valgan el color del papel. Así el resto de la app (pintar tocando, deshacer,
   capas, acabados, exportar, maquetas) sigue funcionando igual, sin una sola
   rama especial. El modo "solo líneas" no sirve para esto: ahí los rellenos no
   se guardan y al pintar se sale del modo — es para imprimir, no para pintar
   en pantalla. */
function vaciarColores(){
  estado.piezas = {};                 // los índices de copia dejan de valer
  const papel = opaco(colorFondo()), t = tinta();
  // Las sombras cel se pintan del color del papel: con opacidad 0.28 encima del
  // papel desaparecen, que es lo que corresponde en una lámina sin colorear.
  estado.colores = mandala.partes.map(p => p.sombra ? papel : (p.trazo ? t : papel));
}

function autoColorear(){
  estado.piezas = {};                 // recolorear por paleta manda sobre lo pintado a mano
  const pal = PALETAS[estado.paleta].c;
  const n = pal.length - 2;
  estado.colores = mandala.partes.map((p, i) => {
    // Las sombras cel van al tono más oscuro: borde duro y plano, como en el
    // anime. Que coincida con el color del contorno es justo lo que se busca.
    if (p.sombra) return pal[0];
    if (!p.trazo) return pal[1 + (i % n)];
    // Los contornos ya no van todos al color más oscuro: el usuario elige.
    if (estado.trazos === 'varios') return pal[1 + ((i + 2) % n)];
    if (estado.trazos === 'claro')  return pal[n];   // el acento de la paleta
    return pal[0];
  });
}
// Con qué colores nace un mandala recién generado. Es el único punto que
// decide entre lámina en blanco y coloreado automático.
function colorearInicial(){
  if (estado.enBlanco) vaciarColores(); else autoColorear();
}

      <path d="M -215,224 L 186,224" fill="none" stroke="#0000001c" stroke-width="3"/>`
  }
};

// `capa` filtra qué se dibuja: 'relleno' (solo las figuras macizas), 'trazo'
// (solo los contornos) o nada (todo junto). Se separa para poder texturizar el
// relleno sin tocar las líneas: en una acuarela o un lápiz de color reales, la
// tinta del dibujo queda nítida y solo el color está pintado. Aplicar el
// filtro a todo hacía que las líneas ondularan y parecía un reflejo en el agua.
let CLIP_SEQ = 0;   // ids únicos para los recortes de las sombras

function cuerpoMandala(lineas, paraExport, papel, capa){
  const tin = tinta();
  let s = '';
  // Orden de dibujado por radio: primero lo más lejano al centro, al final lo
  // más cercano. Así, donde dos anillos se entrelazan, las figuras interiores
  // quedan POR ENCIMA de las exteriores — que es como se ve una flor abierta
  // desde arriba. El índice original se conserva en data-i, porque es el
  // número de capa de color. El sort es estable: dentro de un mismo anillo se
  // respeta el orden en que el generador creó las piezas.
  const orden = mandala.partes
    .map((p, i) => i)
    .sort((a, b) => (mandala.partes[a].z || 0) - (mandala.partes[b].z || 0));

  // "Lámina" = todo lleva su contorno de tinta, esté pintado o no. Vale tanto
  // para el modo línea (papel en todos los rellenos) como para la lámina en
  // blanco que se va coloreando.
  //
  // Sin esto, al dar el primer color se salía del modo línea y el dibujo pasaba
  // a pintarse solo con rellenos: las figuras que no tienen capa de contorno
  // propia se quedaban SIN borde y no se veía qué faltaba por pintar. Es lo
  // primero que se nota al colorear de verdad.
  const laminar = lineas || estado.enBlanco;

  orden.forEach(i => {
    const p = mandala.partes[i];
    // Las sombras no van en una lámina para colorear: ahí solo interesa el
    // dibujo limpio.
    if (p.sombra && laminar) return;
    // En lámina todo es contorno, así que no se separa.
    if (capa && !laminar){
      if (capa === 'relleno' && p.trazo) return;
      if (capa === 'trazo' && !p.trazo) return;
    }
    const col = estado.colores[i] || '#333';
    // En modo línea las figuras se rellenan con el color del papel, opaco.
    // Así TAPAN lo que tienen debajo y no se ven las líneas de un anillo
    // cruzando las del anillo de al lado: queda una lámina limpia, con las
    // figuras interiores enteras sobre las exteriores. De paso el interior
    // sigue siendo sensible al toque (con `none` no lo sería).
    // En lámina el relleno es papel (modo línea) o el color que se le haya dado
    // (lámina en blanco), y el contorno SIEMPRE es tinta: es lo que deja ver
    // qué falta por pintar.
    const relleno = p.trazo ? 'none' : (lineas ? (papel || 'transparent') : col);
    const trz     = laminar ? tin : (p.trazo ? col : 'none');
    // En modo línea, las figuras macizas se pintan con `paint-order="stroke
    // fill"`: primero el trazo y encima el relleno. Así el relleno tapa los
    // trazos que caen DENTRO de la figura y solo queda visible su contorno
    // exterior. Sin esto, una silueta de varios subtrazados (el cuerpo de un
    // animal más sus patas y alas) mostraba las líneas internas cruzándola,
    // como si las piezas estuvieran separadas en vez de fundidas.
    // El grosor se dobla porque la mitad interior del trazo queda tapada.
    const unir    = laminar && !p.trazo;
    const gr      = laminar ? (unir ? 5.2 : 2.6) : (p.trazo ? p.grosor : 0);

    // Las piezas con `recorte` (las sombras cel) se recortan con la silueta de
    // la figura a la que sombrean. El recorte y la rotación van en el MISMO
    // grupo, con el `clip-path` en el path interior sin transform propio: así
    // el recorte gira con la pieza sin depender de en qué espacio lo resuelva
    // el navegador.
    let clipId = '';
    if (p.recorte && !lineas) clipId = 'rc' + (++CLIP_SEQ);

    s += `<g class="parte" data-i="${i}" fill="${relleno}" stroke="${trz}" stroke-width="${gr.toFixed(1)}" `
       + (p.evenodd ? `fill-rule="evenodd" ` : '')
       + (unir ? `paint-order="stroke fill" ` : '')
       // La sombra se atenúa con opacidad, no eligiendo un tono más claro: así
       // oscurece lo que tiene debajo sea cual sea el color de la pieza, y
       // funciona igual con cualquier paleta.
       + (p.sombra ? `opacity="0.28" data-s="1" ` : '')
       + `stroke-linecap="round" stroke-linejoin="round">`;
    if (clipId)
      s += `<defs><clipPath id="${clipId}"><path d="${p.recorte}"`
         + (p.recorteEo ? ` clip-rule="evenodd"` : '') + `/></clipPath></defs>`;

    for (let j = 0; j < p.k; j++){
      const rot = p.k > 1 ? `rotate(${(j * 360 / p.k + p.off).toFixed(2)})`
                          : (p.off ? `rotate(${p.off})` : '');
      const t = (rot || p.tr) ? ` transform="${rot}${p.tr || ''}"` : '';
      // Copia pintada a mano: lleva su propio color, distinto al de su capa.
      // El resto hereda el del grupo, que es lo que hace barato pintar un
      // anillo entero de un toque.
      const cj = estado.piezas[i + ':' + j];
      const suyo = cj ? (p.trazo ? ` stroke="${cj}"` : ` fill="${cj}"`) : '';
      if (clipId){
        s += `<g${t}><path d="${p.d}" clip-path="url(#${clipId})" data-j="${j}"/></g>`;
        continue;
      }
      s += `<path d="${p.d}"${t}${suyo} data-j="${j}"/>`;
      // Zona de toque ampliada para los motivos que son solo línea. Ojo con el
      // ancho: con 34 unidades, la banda invisible de una línea se comía los
      // toques de las figuras vecinas y no había zoom que valiera — se tocaba
      // una figura y se pintaba otra. Se ajusta al grosor real de la línea.
      if (p.trazo && !paraExport)
        s += `<path d="${p.d}"${t} data-j="${j}" fill="none" stroke="transparent" `
           + `stroke-width="${Math.max(gr * 2.2, 10).toFixed(1)}" pointer-events="stroke"/>`;
    }
    s += `</g>`;
  });
  return s;
}

/* Celdas del fondo: los huecos entre figuras, como zonas pintables sueltas.
   Antes el fondo era UN rectángulo: tocar un hueco pintaba todo el fondo de
   golpe, que al colorear no es lo que se quiere.

   No se pueden recortar los huecos de verdad —son el negativo del dibujo, y
   eso pide operaciones booleanas sobre trazados que el navegador no trae—, así
   que se cubre el fondo con una retícula de sectores de corona que sigue la
   estructura del propio mandala: los cortes salen de los radios de sus anillos
   y los sectores, de su simetría. Cada celda se pinta sola y queda DETRÁS del
   dibujo, así que las figuras siguen ganando el toque donde se superponen. */
let CELDAS = { token: '', lista: [] };
function celdasFondo(){
  const token = estado.semilla + '|' + JSON.stringify(estado.cfg) + '|' + LIENZO_M;
  if (CELDAS.token === token) return CELDAS.lista;

  const radios = [...new Set(mandala.partes.filter(p => p.k > 1)
                    .map(p => Math.round(-(p.z || 0))))]
                 .filter(r => r > 10).sort((a, b) => a - b);
  let cortes = [8];
  for (let i = 0; i < radios.length - 1; i++) cortes.push(Math.round((radios[i] + radios[i+1]) / 2));
  cortes.push(Math.round(LIENZO_M));
  // Fuera las bandas demasiado finas para acertarles con el dedo.
  cortes = cortes.filter((v, i) => i === 0 || v - cortes[i-1] > 18);
  if (cortes[cortes.length-1] < LIENZO_M - 4) cortes.push(Math.round(LIENZO_M));

  const N = Math.max(4, Math.min(estado.cfg.simetria, 24)), paso = 360 / N;
  const lista = [];
  for (let b = 0; b < cortes.length - 1; b++)
    for (let s = 0; s < N; s++){
      const a0 = -paso/2 + s*paso;
      lista.push(sectorAnillo(cortes[b], cortes[b+1], a0, a0 + paso));
    }
  CELDAS = { token, lista };
  return lista;
}

/* Emite el mandala. Sin acabado va de una pasada. Con acabado va en dos: los
   rellenos texturizados dentro del filtro y los contornos limpios encima. */
function pintado(lineas, paraExport, papel, filtro, tr){
  // En lámina no se separan relleno y trazo: `cuerpoMandala` ignora el filtro
  // de capa, así que las dos pasadas dibujarían el mandala entero dos veces.
  if (!filtro || lineas || estado.enBlanco)
    return `<g${tr}${filtro}>` + cuerpoMandala(lineas, paraExport, papel) + `</g>`;
  return `<g${tr}${filtro}>` + cuerpoMandala(lineas, paraExport, papel, 'relleno') + `</g>`
       + `<g${tr}>`          + cuerpoMandala(lineas, paraExport, papel, 'trazo')   + `</g>`;
}

function svgMarkup(op){
  op = op || {};
  const lineas = op.lineas ?? estado.lineas;
  const vista  = op.vista  ?? estado.vista;
  const px     = op.px;
  const tam    = px ? ` width="${px}" height="${px}"` : '';
  const V      = VISTAS[vista];
  let fondo    = op.forzarFondo || colorFondo();

  const acabado = op.acabado ?? estado.acabado;
  const filtro = FILTROS[acabado] ? ` filter="url(#f${acabado[0].toUpperCase()}${acabado.slice(1)})"` : '';

  // Lienzo ajustado al dibujo. El de 1000 dejaba hasta un 13% de margen vacío
  // alrededor, que en un teléfono es el mandala viéndose más pequeño a cambio
  // de nada. Pero un margen FIJO no sirve: medido sobre 25 semillas por estilo,
  // el hindú llega a 436 y el de robots a 495, porque las esquinas de un motivo
  // ancho sobresalen del radio máximo (a radio r y medio sector hw, la esquina
  // cae en r/cos(hw)). Así que lo mide `ajustarLienzo()` en cada dibujo y lo
  // deja en LIENZO_M. En maqueta NO se toca: la camiseta, la taza y la pared
  // están dibujadas en el espacio de 1000 y se recortarían.
  const M = V ? VB / 2 : LIENZO_M;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-M} ${-M} ${M*2} ${M*2}"${tam}>`;
  const recorte = V && V.clip ? `<clipPath id="cVista"><path d="${V.clip}"/></clipPath>` : '';
  const defs = (fondo === 'url(#oro)' ? GRADIENTE_ORO : '') + (FILTROS[acabado] || '') + recorte;
  if (defs) s += `<defs>${defs}</defs>`;

  if (!V){
    // El fondo es una capa pintable más (`data-i="-1"`): así se pueden pintar
    // los espacios en blanco que quedan entre las figuras. Ojo, es UNA sola
    // región: los huecos de un mandala se comunican entre sí, así que se pintan
    // todos a la vez — no hay hueco por hueco sin rasterizar el dibujo.
    const rect = estado.fondoColor || fondo;
    if (rect) s += `<rect class="parte" data-i="-1" x="${-M}" y="${-M}" `
                 + `width="${M*2}" height="${M*2}" fill="${rect}"/>`;
    // Al colorear, encima del fondo van las celdas: cada hueco es su propia
    // zona. Sin pintar son transparentes —invisibles pero sí sensibles al
    // toque, porque `transparent` es un color y no `none`—.
    if (lineas || estado.enBlanco)
      celdasFondo().forEach((d, n) => {
        const c = estado.piezas['-1:' + n];
        if (!c && px) return;                         // en el archivo no van vacías
        s += `<path class="parte" data-i="-1" data-j="${n}" d="${d}" `
           + `fill="${c || 'transparent'}"/>`;
      });
    // Las figuras conservan el color del PAPEL aunque el fondo esté pintado: en
    // una lámina, pintar alrededor no tiñe lo que aún no se ha coloreado.
    s += pintado(lineas, !!px, lineas ? opaco(fondo) : null, filtro, '');
  } else {
    // En maqueta, el "fondo" es el color del objeto. Transparente no aplica
    // a una camiseta: se cae a un gris neutro.
    const material = fondo || '#DCDCDC';
    s += V.obj(material, '#00000026');
    // El recorte va en un grupo EXTERIOR al del transform, para que sus
    // coordenadas sean las del objeto y no las del mandala escalado.
    const abre = V.clip ? `<g clip-path="url(#cVista)">` : '';
    s += abre
       + pintado(lineas, !!px, lineas ? opaco(material) : null, filtro,
                 ` transform="translate(${V.cx},${V.cy}) scale(${V.s})"`)
       + (V.clip ? `</g>` : '');
    if (V.encima) s += V.encima(material, '#00000026');
  }

  if (op.marcaAgua) s += `<text x="0" y="${M - 24}" text-anchor="middle" font-family="sans-serif" `
                       + `font-size="26" fill="#00000055">Mandalas</text>`;
  return s + `</svg>`;
}

/* Medio lado del lienzo en vista plana. Lo fija `ajustarLienzo()` con la caja
   real del dibujo; arranca en el valor seguro de siempre. */
let LIENZO_M = VB / 2;

/* Ajusta el lienzo a lo que ocupa este mandala. Se mide DESPUÉS de dibujar,
   porque el alcance depende de las repeticiones de cada anillo y no se puede
   deducir de los radios. Si cambia, se corrige el viewBox y el rectángulo de
   fondo sobre el SVG ya insertado: no hace falta volver a generar el marcado. */
let LIENZO_TOKEN = '';
function ajustarLienzo(){
  if (estado.vista !== 'plano') return;
  const svg = svgHost.querySelector('svg');
  if (!svg) return;

  // Se mide UNA vez por mandala. Antes se medía en cada pintado y el dibujo
  // cambiaba de tamaño al alternar entre color y solo líneas, porque las
  // sombras cel no se dibujan en la lámina y con ellas la caja daba distinta.
  const token = estado.semilla + '|' + JSON.stringify(estado.cfg);
  if (token === LIENZO_TOKEN) return;

  // Las sombras se excluyen de la medida: son cuñas grandes recortadas con la
  // silueta de su pieza, y `getBBox` no sabe del recorte — devuelve la cuña
  // entera y agranda la caja por algo que no se ve.
  let ext = 0;
  try {
    svg.querySelectorAll('g.parte:not([data-s])').forEach(g => {
      const b = g.getBBox();
      if (!b || !b.width) return;
      ext = Math.max(ext, Math.abs(b.x), Math.abs(b.y), b.x + b.width, b.y + b.height);
    });
  } catch { return; }
  if (!ext) return;
  LIENZO_TOKEN = token;

  // getBBox ignora el grosor del trazo: se añade un margen para que el contorno
  // exterior no quede cortado justo al borde.
  const M = Math.min(VB / 2, Math.max(120, Math.ceil(ext + 8)));
  if (Math.abs(M - LIENZO_M) < 2) return;
  LIENZO_M = M;
  svg.setAttribute('viewBox', `${-M} ${-M} ${M*2} ${M*2}`);
  const r = svg.querySelector('rect.parte[data-i="-1"]');
  if (r){
    r.setAttribute('x', -M); r.setAttribute('y', -M);
    r.setAttribute('width', M*2); r.setAttribute('height', M*2);
  }
}

function pintar(conFade){
  svgHost.innerHTML = svgMarkup();
  ajustarLienzo();
  svgHost.classList.toggle('damero', estado.fondo === 'transparente'
    && !estado.fondoColor && estado.vista === 'plano');
  if (conFade !== false){
    svgHost.classList.remove('fade'); void svgHost.offsetWidth; svgHost.classList.add('fade');
  }
  dibujarCapas();
  iSemilla.value = estado.semilla;
  history.replaceState(null, '', '?seed=' + estado.semilla);
}
