  dibujarSwatches();
}

function regenerar(nuevaSemilla){
  // Semilla nueva = mandala nuevo, y nuevo quiere decir NUEVO: se sueltan el
  // fondo pintado y el modo lámina. Antes se arrastraban, y salía otro dibujo
  // con el color de fondo del anterior y todavía sin colorear, que no es lo que
  // uno pide al tocar "Generar nuevo".
  // Mover los deslizadores NO cuenta: ahí se está ajustando el mismo dibujo.
  if (nuevaSemilla !== undefined){
    estado.semilla = nuevaSemilla;
    estado.fondoColor = null;
    estado.enBlanco = false;
    estado.piezas = {};
  }
  mandala = generar(estado.semilla, estado.cfg);
  colorearInicial();
  if (nuevaSemilla !== undefined) marcarBlanco();
  pintar(nuevaSemilla !== undefined);
}

/* --- Selector de color propio ---------------------------------------------
   Reemplaza a `<input type="color">`. Ese input delega en el selector del
   sistema operativo: en el escritorio abre una paleta cómoda, pero en Android
   abre un diálogo tosco y en iPhone otro distinto, así que la misma app se
   usaba de tres maneras y en el celular era la peor. Aquí se elige de dos
   formas, las dos pensadas para el dedo: tocando un tono de la rejilla, o
   moviendo tres deslizadores (tono, intensidad, brillo).                    */
function hslHex(h, s, l){
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const c = n => Math.round(f(n) * 255).toString(16).padStart(2, '0');
  return '#' + c(0) + c(8) + c(4);
}
function hexHsl(hex){
  const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(hex || '');
  if (!m) return [0, 70, 50];
  const [r, g, b] = m.slice(1).map(v => parseInt(v, 16) / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  let h = 0;
  if (d !== 0){
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
}

// Ocho tonos por tres claridades, más seis grises: 30 chips.
// La primera versión tenía 56 y la hoja crecía tanto que el botón de confirmar
// quedaba fuera de la pantalla del teléfono. Para el resto de los colores están
// los deslizadores, que es justo para lo que sirven.
const CS_TONOS = (() => {
  const out = [];
  [72, 52, 34].forEach(l =>
    [0, 28, 52, 120, 175, 210, 265, 320].forEach(h => out.push(hslHex(h, 70, l))));
  [100, 84, 64, 44, 24, 0].forEach(l => out.push(hslHex(0, 0, l)));
  return out;
})();

function csRecientes(){
  try { return JSON.parse(localStorage.getItem('mandalas.recientes') || '[]'); }
  catch { return []; }
}
function csGuardarReciente(hex){
  const l = [hex].concat(csRecientes().filter(c => c !== hex)).slice(0, 10);
  try { localStorage.setItem('mandalas.recientes', JSON.stringify(l)); } catch {}
}

function csPintar(){
  const [h, s, l] = csHSL, hex = hslHex(h, s, l);
  $('csMuestra').style.background = hex;
  $('csHex').textContent = hex.toUpperCase();
  $('csH').value = h; $('csS').value = s; $('csL').value = l;
  // Cada deslizador muestra el resultado de moverlo, no una barra genérica.
  $('csH').style.backgroundImage = 'linear-gradient(to right,'
    + [0,60,120,180,240,300,360].map(t => hslHex(t, s, l)).join(',') + ')';
  $('csS').style.backgroundImage =
    `linear-gradient(to right,${hslHex(h,0,l)},${hslHex(h,100,l)})`;
  $('csL').style.backgroundImage =
    `linear-gradient(to right,${hslHex(h,s,4)},${hslHex(h,s,50)},${hslHex(h,s,96)})`;
  document.querySelectorAll('#csTonos b').forEach(b =>
    b.classList.toggle('on', b.dataset.c.toLowerCase() === hex.toLowerCase()));

/* --- miniaturas de la galería ---
   Se dibujan generando la mandala de nuevo a partir de su semilla, no guardando
   imágenes. Se fuerzan tres cosas para la miniatura: vista plana (una taza de
   74 px no se entiende), acabado plano (treinta filtros de acuarela cuestan
   carísimo) y el lienzo de 1000 (medir el ajustado exige tenerla en pantalla).
   El estado global se presta y se devuelve tal cual estaba. */
function miniatura(snap){
  const previo = instantanea(), pMandala = mandala, pLienzo = LIENZO_M;
  let svg = '';
  try {
    const o = JSON.parse(snap);
    estado.semilla = o.s; estado.cfg = o.c; estado.paleta = o.p; estado.colores = o.k || [];
    estado.fondo = o.f; estado.vista = 'plano'; estado.lineas = !!o.l;
    estado.trazos = o.t || 'tinta'; estado.acabado = 'plano';
    estado.enBlanco = !!o.b; estado.fondoColor = o.g || null;
    estado.piezas = (o.q && typeof o.q === 'object') ? o.q : {};
    LIENZO_M = VB / 2;
    mandala = generar(estado.semilla, estado.cfg);
    if (estado.colores.length !== mandala.partes.length) colorearInicial();
    svg = svgMarkup();
  } catch { svg = ''; }
  const r = JSON.parse(previo);
  estado.semilla = r.s; estado.cfg = r.c; estado.paleta = r.p; estado.colores = r.k;
  estado.fondo = r.f; estado.vista = r.v; estado.lineas = r.l; estado.trazos = r.t;
  estado.acabado = r.a; estado.enBlanco = !!r.b; estado.fondoColor = r.g || null;
  estado.pincel = r.n || 'anillo';
  estado.piezas = (r.q && typeof r.q === 'object') ? r.q : {};
  mandala = pMandala; LIENZO_M = pLienzo;
  return svg;
}

/* Pinta la capa `i`, o solo la copia `j` de esa capa si el pincel está en
   "figura". Un mandala repite cada figura hasta 40 veces alrededor del anillo:
   pintar la capa entera es lo que hace rápido colorear, pero al colorear a mano
   uno espera que se pinte SOLO lo que tocó — que es justo lo que sorprendía. */
function aplicarColor(i, j){
  // Pintar estando en "solo líneas" guardaba el color sin mostrar nada: la app
  // parecía rota. Si el usuario pinta, es que quiere ver color — se sale del
  // modo línea solo.
  if (estado.lineas){
    estado.lineas = false;
    marcar('#modoLineas', 'lineas', '0');
    $('bLineas').classList.remove('on');
    // Y se cae en la LÁMINA EN BLANCO, no en el coloreado automático. Antes al
    // dar el primer color aparecían de golpe todos los demás, como si la app
    // hubiera pintado sola el resto: justo lo contrario de lo que uno quiere
    // cuando está coloreando una lámina.
    estado.enBlanco = true;
    vaciarColores();
    marcarBlanco();
    // Al entrar a colorear, el pincel pasa a figura sola: es lo que se espera
    // de una lámina, y con el anillo entero un solo toque pintaba 40 figuras.
    estado.pincel = 'figura';
    marcar('#pinceles', 'pincel', 'figura');
    // El primer toque puede caer en un hueco del fondo, no en una figura.
    if (i < 0){ if (j != null) estado.piezas['-1:' + j] = colorActivo; }
    else if (j != null) estado.piezas[i + ':' + j] = colorActivo;
    else estado.colores[i] = colorActivo;
    pintar(false);
    avisar('Pintando figura por figura');
    clearTimeout(aplicarColor._t);
    aplicarColor._t = setTimeout(empujar, 400);
    return;
  }
  // Los huecos entre figuras. Al colorear, cada uno es su propia zona; fuera de
  // la lámina, el fondo entero de un toque.
  if (i < 0){
    if (estado.enBlanco && j != null){
      const clave = '-1:' + j;
      if (estado.piezas[clave] === colorActivo) return;
      estado.piezas[clave] = colorActivo;
      const el = svgHost.querySelector(`.parte[data-i="-1"][data-j="${j}"]`);
      if (el) el.setAttribute('fill', colorActivo);
    } else {
      if (estado.fondoColor === colorActivo) return;
      estado.fondoColor = colorActivo;
      pintar(false);
    }
    if (navigator.vibrate) navigator.vibrate(10);
    clearTimeout(aplicarColor._t);
    aplicarColor._t = setTimeout(empujar, 400);
    return;
  }
  const atributo = mandala.partes[i].trazo ? 'stroke' : 'fill';

  // Una sola figura: solo esa copia cambia. Se pinta el path directamente, sin
  // volver a generar el SVG entero.
  if (estado.pincel === 'figura' && j != null){
    const clave = i + ':' + j;
    if (estado.piezas[clave] === colorActivo) return;
    estado.piezas[clave] = colorActivo;
    const el = svgHost.querySelector(`.parte[data-i="${i}"] [data-j="${j}"]`);
    if (el) el.setAttribute(atributo, colorActivo);
    if (navigator.vibrate) navigator.vibrate(10);
    clearTimeout(aplicarColor._t);
    aplicarColor._t = setTimeout(empujar, 400);
    return;
  }

  // El anillo entero. Borra lo que se hubiera pintado a mano en esa capa: si no,
  // quedarían copias sueltas del color viejo y parecería que no obedeció.
  const habia = Object.keys(estado.piezas).some(k => k.startsWith(i + ':'));
  if (estado.colores[i] === colorActivo && !habia) return;
  estado.colores[i] = colorActivo;
  if (habia){
    Object.keys(estado.piezas).forEach(k => { if (k.startsWith(i + ':')) delete estado.piezas[k]; });
    pintar(false);
  } else {
    const g = svgHost.querySelector(`.parte[data-i="${i}"]`);
    if (g) g.setAttribute(atributo, colorActivo);
  }
  const chip = $('capas').children[i];
  if (chip) chip.style.background = colorActivo;
  if (navigator.vibrate) navigator.vibrate(10);
  clearTimeout(aplicarColor._t);
  aplicarColor._t = setTimeout(empujar, 400);
}

bDeshacer.onclick = deshacer;
bRehacer.onclick  = rehacer;

/* =========================================================================
   10. ZOOM Y PINTADO TÁCTIL
   ========================================================================= */
let vista = { esc:1, x:0, y:0 };
const punteros = new Map();
let base = null, movido = 0, tIni = 0;

function aplicarVista(){
  lienzo.style.transform = `translate(${vista.x}px,${vista.y}px) scale(${vista.esc})`;
  botonesZoom();
  const z = $('zoomInfo');
  z.textContent = Math.round(vista.esc * 100) + '%';
  z.classList.add('ver');
  clearTimeout(aplicarVista._t);
  aplicarVista._t = setTimeout(() => z.classList.remove('ver'), 900);
}
// Botones explícitos de zoom. Sin ellos la única forma de acercar eran el
// pellizco y Ctrl+rueda, que no se ven por ninguna parte: para quien usa ratón
// el zoom simplemente no existía.
function zoom(factor){
  const antes = vista.esc;
  vista.esc = Math.min(8, Math.max(1, vista.esc * factor));
  // Al alejar se recentra proporcionalmente, o el mandala se queda fuera de vista.
  const k = vista.esc / antes;
  vista.x *= k; vista.y *= k;
  if (vista.esc === 1){ vista.x = 0; vista.y = 0; }
  aplicarVista();
}
function botonesZoom(){
  $('bMas').disabled   = vista.esc >= 8;
  $('bMenos').disabled = vista.esc <= 1;
}
$('bMas').onclick   = () => zoom(1.35);
$('bMenos').onclick = () => zoom(1 / 1.35);
$('bZoom').onclick  = () => { vista = { esc:1, x:0, y:0 }; aplicarVista(); };

const escenaEl = $('escena');

// Los botones flotantes viven DENTRO de #escena. Sin esta guarda, el
// setPointerCapture de abajo se traga el pointerup y el click del botón nunca
// llega a dispararse: los cuatro botones de la esquina quedaban muertos.
const enControl = e => !!(e.target.closest && e.target.closest('#acciones'));

escenaEl.addEventListener('pointerdown', e => {
  if (enControl(e)) return;
  escenaEl.setPointerCapture(e.pointerId);
  punteros.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (punteros.size === 1){ movido = 0; tIni = Date.now(); }
  base = null;
});
escenaEl.addEventListener('pointermove', e => {
  if (!punteros.has(e.pointerId)) return;
  const prev = punteros.get(e.pointerId);
  punteros.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if (punteros.size === 1){
    movido += Math.hypot(e.clientX - prev.x, e.clientY - prev.y);
    if (vista.esc > 1.02){
      vista.x += e.clientX - prev.x; vista.y += e.clientY - prev.y;
      aplicarVista();
    }
  } else if (punteros.size === 2){
    movido = 999;
    const [a, b] = [...punteros.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const cen  = { x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 };
    if (base){
      vista.esc = Math.min(8, Math.max(1, vista.esc * (dist / base.dist)));
      vista.x += cen.x - base.cen.x; vista.y += cen.y - base.cen.y;
      aplicarVista();
    }
    base = { dist, cen };
  }
});
escenaEl.addEventListener('pointerup', e => {
  const era = punteros.size;
  punteros.delete(e.pointerId);
  base = null;
  if (era === 1 && movido < 12 && Date.now() - tIni < 500 && !enControl(e)){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const g = el && el.closest ? el.closest('.parte') : null;
    // `data-j` dice QUÉ copia de la capa se tocó, para poder pintar una sola.
    if (g) aplicarColor(+g.dataset.i, el.dataset && el.dataset.j != null ? +el.dataset.j : null);
  }
});
escenaEl.addEventListener('pointercancel', e => { punteros.delete(e.pointerId); base = null; });

// Rueda = zoom, como en cualquier visor de imágenes. Debajo del lienzo no hay
// nada que desplazar (el panel tiene su propio scroll), así que la rueda aquí
// no compite con ningún otro gesto.
escenaEl.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive:false });

/* =========================================================================
   11. CAPA DE ARCHIVO / COMPARTIR
   Único punto del código que toca descargas, portapapeles o share.
   Al empaquetar con Capacitor solo se reescribe esta sección.
   ========================================================================= */
function avisar(txt){
  const a = $('aviso');
  a.textContent = txt; a.classList.add('ver');
  clearTimeout(avisar._t);
  avisar._t = setTimeout(() => a.classList.remove('ver'), 1800);
}

async function entregar(blob, nombre){
  const file = new File([blob], nombre, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:'Mandala' }); return; }
    catch (err){ if (err.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  avisar('Guardado: ' + nombre);
}

function svgBlob(){
  return new Blob([svgMarkup({ marcaAgua: limites().marcaAgua })], { type:'image/svg+xml;charset=utf-8' });
}

async function guardarImagen(){
  const px = limites().exportPx;
  const str = svgMarkup({ px, marcaAgua: limites().marcaAgua });
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
  await img.decode();
  const cv = document.createElement('canvas');
  cv.width = cv.height = px;
  cv.getContext('2d').drawImage(img, 0, 0, px, px);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  await entregar(blob, `mandala-${estado.semilla}.png`);
}

$('bPNG').onclick = () => guardarImagen().catch(() => avisar('No se pudo exportar'));
$('bSVG').onclick = () => entregar(svgBlob(), `mandala-${estado.semilla}.svg`);

/* =========================================================================
   12. ARRANQUE
   ========================================================================= */
(function inicio(){
  const q = parseInt(new URLSearchParams(location.search).get('seed') || '', 10);

  // Se recupera lo último que se estaba pintando, salvo que la dirección traiga
  // una semilla DISTINTA a la guardada: eso significa que alguien abrió un
  // enlace compartido, y ahí manda el enlace. Como `pintar()` deja la semilla
  // en la URL, al recargar coincide y se restaura igual.
  let restaurado = false;
  try {
    const crudo = localStorage.getItem(GUARDADO);
    const o = crudo && JSON.parse(crudo);
    if (o && o.c && Array.isArray(o.k) && o.k.length && (isNaN(q) || q === o.s)){
      aplicarSnap(crudo);
      restaurado = true;
    }
  } catch {}

  if (!restaurado){
    estado.semilla = isNaN(q) ? Math.floor(Math.random() * 1e9) : q;
    mandala = generar(estado.semilla, estado.cfg);
    colorearInicial();
    sincronizarControles();
    pintar(true);
  }
  botonesZoom();
  empujar(restaurado);
  // La galería se dibuja después del primer pintado: con el tope de 30 cuesta
  // ~120 ms, y eso retrasaría la aparición de la mandala, que es lo que el
  // usuario está esperando ver.
  setTimeout(dibujarGaleria, 0);

  // Service worker: la app abre sin internet. Solo funciona servida por HTTPS
  // (o localhost); con file:// el registro falla y no pasa nada — la app anda
  // igual, simplemente sin caché offline.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
    window.addEventListener('load', () =>
      navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
