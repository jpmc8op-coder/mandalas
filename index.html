<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#141821">
<meta name="description" content="Genera mandalas procedurales y coloréalos con un toque.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mandalas">
<title>Mandalas</title>
<style>
  :root{
    --bg:#141821;
    --panel:#1c212d;
    --panel-2:#242b3a;
    --linea:#333c4f;
    --txt:#e8ecf4;
    --txt-2:#8e99b0;
    --acento:#f2a65a;
    --sa-b:env(safe-area-inset-bottom,0px);
    --sa-t:env(safe-area-inset-top,0px);
    --sa-l:env(safe-area-inset-left,0px);
    --sa-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    overscroll-behavior:none;touch-action:none;
  }

  /* ---------- Lienzo ---------- */
  #escena{
    flex:1;position:relative;min-height:0;
    display:flex;align-items:center;justify-content:center;
    /* En un teléfono el mandala está limitado por el ANCHO, no por el alto:
       cada píxel de relleno lateral es un píxel menos de dibujo. */
    padding:calc(var(--sa-t) + 6px) 3px 6px;
    overflow:hidden;
  }
  #lienzo{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    transform-origin:center center;will-change:transform;
  }
  #svgHost{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #svgHost.damero{
    background-image:
      linear-gradient(45deg,#c9ced8 25%,transparent 25%,transparent 75%,#c9ced8 75%),
      linear-gradient(45deg,#c9ced8 25%,#eef1f5 25%,#eef1f5 75%,#c9ced8 75%);
    background-size:22px 22px;background-position:0 0,11px 11px;
  }
  #svgHost svg{width:100%;height:100%;max-width:100%;max-height:100%;display:block}
  #svgHost.fade{animation:aparece .28s ease}
  @keyframes aparece{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:scale(1)}}
  .parte path{transition:fill .18s ease,stroke .18s ease}

  #zoomInfo{
    position:absolute;top:calc(var(--sa-t) + 10px);left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;
    opacity:0;transition:opacity .2s;pointer-events:none;
  }
  #zoomInfo.ver{opacity:1}

  #acciones{
    position:absolute;top:calc(var(--sa-t) + 10px);right:calc(var(--sa-r) + 10px);
    display:flex;gap:6px;
  }
  #acciones button{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--linea);
    background:rgba(28,33,45,.85);color:var(--txt);font-size:15px;cursor:pointer;
    display:grid;place-items:center;backdrop-filter:blur(6px);
  }
  #acciones button:disabled{opacity:.35}
  #acciones button.on{background:var(--acento);border-color:var(--acento);color:#1a1206}

  /* ---------- Panel ---------- */
  #panel{background:var(--panel);border-top:1px solid var(--linea);padding-bottom:var(--sa-b);flex:0 0 auto}
  #tabs{display:flex;gap:4px;padding:8px 10px 0}
  #tabs button{
    flex:1;padding:9px 0;border:0;border-radius:10px 10px 0 0;cursor:pointer;
    background:transparent;color:var(--txt-2);font-size:14px;font-weight:600;
  }
  #tabs button.on{background:var(--panel-2);color:var(--txt)}
  /* Plegar el panel: cuando se está pintando, lo que se quiere es el dibujo. Va
     como botón visible en la barra de pestañas, no como gesto oculto. */
  #bPlegar{flex:0 0 auto;width:40px;font-size:13px;color:var(--txt-2)}
  #panel.plegado .hoja{display:none}
  .hoja{display:none;padding:12px 12px 14px;background:var(--panel-2);max-height:42vh;overflow-y:auto}
  .hoja.on{display:block}

  .fila{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .fila label{font-size:12px;color:var(--txt-2);width:82px;flex:0 0 auto}
  .fila output{font-size:12px;color:var(--txt);width:26px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:26px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--linea);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--acento);
    margin-top:-9px;border:0;cursor:pointer;
  }
  input[type=range]::-moz-range-track{height:4px;background:var(--linea);border-radius:2px}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--acento);border:0}

  .btn{
    width:100%;padding:13px;border-radius:12px;border:0;cursor:pointer;
    background:var(--acento);color:#1a1206;font-size:15px;font-weight:700;
  }
  .btn.sec{background:var(--panel);color:var(--txt);border:1px solid var(--linea);font-weight:600}
  .btn.sec.on{border-color:var(--acento);background:#2c3446}
  .duo{display:flex;gap:8px}

  .semilla{display:flex;gap:8px;align-items:center;margin-bottom:11px}
  .semilla input{
    flex:1;background:var(--panel);border:1px solid var(--linea);color:var(--txt);
    border-radius:10px;padding:10px;font-size:14px;font-variant-numeric:tabular-nums;min-width:0;
  }

  .titulo{font-size:11px;color:var(--txt-2);text-transform:uppercase;letter-spacing:.07em;margin:0 0 7px}
  .pista{font-size:11px;color:var(--txt-2);line-height:1.45;margin:8px 0 0}

  /* Galería: miniaturas generadas en el momento a partir de la semilla, no
     imágenes guardadas. Cada una pesa menos de 1 KB en localStorage. */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px;margin-top:9px}
  .gal:empty{display:none}
  .gal figure{
    margin:0;position:relative;border-radius:10px;overflow:hidden;cursor:pointer;
    border:2px solid var(--linea);background:#fff;aspect-ratio:1;
  }
  .gal figure:hover{border-color:var(--acento)}
  .gal svg{width:100%;height:100%;display:block}
  /* Discreta: la acción principal de una miniatura es abrirla, no borrarla. */
  .gal .x{
    position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
    border:0;background:#0007;color:#fff;font-size:10px;line-height:1;cursor:pointer;
    display:grid;place-items:center;
  }

  /* filas de opciones */
  /* Las filas que sí se deslizan llevan un degradado en el borde derecho para
     que se vea que hay más contenido fuera de pantalla. */
  .ops{
    display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;
    scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
            mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
  }
  .ops::-webkit-scrollbar{display:none}
  .seg.ops{-webkit-mask-image:none;mask-image:none}
  .ops button{
    flex:0 0 auto;padding:10px 14px;border-radius:10px;border:1px solid var(--linea);cursor:pointer;
    background:var(--panel);color:var(--txt-2);font-size:13px;white-space:nowrap;
  }
  .ops button.on{border-color:var(--acento);color:var(--txt);background:#2c3446}
  .seg{display:flex;gap:7px;margin-bottom:12px}
  .seg button{flex:1}

  /* Las paletas van en rejilla, no en fila deslizante: con 28 solo se veían
     cuatro y nada indicaba que hubiera más. */
  #paletas{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));
    gap:6px;overflow:visible;margin-bottom:12px;
  }
  .paleta{
    display:flex;border-radius:8px;overflow:hidden;cursor:pointer;
    border:2px solid transparent;height:30px;position:relative;
  }
  .paleta.on{border-color:var(--acento);box-shadow:0 0 0 2px #f2a65a55}
  .paleta i{display:block;flex:1;height:100%}
  .paleta.bloq::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);font-size:13px}

  #swatches{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .sw{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:0 0 auto}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--acento)}
  /* Botón de color libre: anillo de arcoíris para que se distinga de los
     swatches de la paleta y se lea como "cualquier otro color". */
  #pickerWrap{
    position:relative;width:48px;height:48px;border-radius:50%;flex:0 0 auto;cursor:pointer;
    display:grid;place-items:center;margin-left:2px;border:0;padding:0;
    background:conic-gradient(from 0deg,#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,
                              #0a84ff,#5e5ce6,#bf5af2,#ff2d55,#ff3b30);
    box-shadow:0 2px 10px #0007;
    animation:latido 2.6s ease-in-out infinite;
  }
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #pickerWrap i{
    width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    border:2px solid #fff;font-style:normal;font-size:17px;line-height:1;font-weight:700;
    color:#fff;text-shadow:0 1px 3px #000c;
  }

  .capa{flex:0 0 auto;width:34px;height:34px;border-radius:9px;border:2px solid var(--linea);cursor:pointer;position:relative}
  .capa span{position:absolute;bottom:-1px;right:1px;font-size:9px;color:#fff;text-shadow:0 0 3px #000;font-weight:700}

  .muestraFondo{
    flex:0 0 auto;width:46px;height:38px;border-radius:10px;border:2px solid var(--linea);
    cursor:pointer;position:relative;overflow:hidden;
  }
  .muestraFondo.on{border-color:var(--acento)}
  .muestraFondo b{
    position:absolute;left:0;right:0;bottom:0;font-size:8px;text-align:center;
    background:#000a;color:#fff;font-weight:600;letter-spacing:.02em;
  }

  /* ---------- Selector de color propio ----------
     Todo con objetivos grandes: los chips son de 44px, que es el mínimo que se
     acierta con el dedo sin apuntar. */
  #colorSheet{position:fixed;inset:0;z-index:60}
  #colorSheet[hidden]{display:none}
  .cs-fondo{position:absolute;inset:0;background:#000a}
  .cs-caja{
    position:absolute;left:0;right:0;bottom:0;background:var(--panel-2);
    border-radius:18px 18px 0 0;padding:14px 14px calc(var(--sa-b) + 16px);
    max-height:86vh;overflow-y:auto;animation:sube .18s ease-out;
  }
  @keyframes sube{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .cs-cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .cs-muestra{width:42px;height:42px;border-radius:12px;border:2px solid #fff3;flex:0 0 auto}
  .cs-hex{font-size:15px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .cs-x{
    margin-left:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--linea);
    background:var(--panel);color:var(--txt);font-size:15px;cursor:pointer;
  }
  .cs-rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;margin-bottom:14px}
  .cs-rejilla b{height:44px;border-radius:10px;cursor:pointer;border:2px solid transparent;display:block}
  .cs-rejilla b.on{border-color:#fff;box-shadow:0 0 0 2px var(--acento)}
  .cs-rec{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .cs-rec b{width:38px;height:38px;border-radius:50%;cursor:pointer;border:2px solid #fff3;display:block}
  .cs-rec:empty{display:none}
  /* El botón queda pegado abajo dentro de la hoja: con la rejilla y los tres
     deslizadores, en un teléfono se iba fuera de la pantalla. */
  #csUsar{position:sticky;bottom:0;margin-top:4px;box-shadow:0 -10px 12px var(--panel-2)}
  /* Los deslizadores llevan su propio degradado: el tono se elige mirando, no
     leyendo un número. */
  input[type=range].slcolor{background-size:100% 6px;background-position:center;background-repeat:no-repeat;border-radius:3px}
  input[type=range].slcolor::-webkit-slider-runnable-track{background:transparent}
  input[type=range].slcolor::-moz-range-track{background:transparent}
  input[type=range].slcolor::-webkit-slider-thumb{border:2px solid #fff;box-shadow:0 1px 4px #0008}
  input[type=range].slcolor::-moz-range-thumb{border:2px solid #fff}

  #aviso{
    position:fixed;left:50%;bottom:calc(var(--sa-b) + 16px);transform:translate(-50%,20px);
    background:#000d;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;
    opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:88vw;text-align:center;
  }
  #aviso.ver{opacity:1;transform:translate(-50%,0)}

  /* ---------- Escritorio ---------- */
  @media (min-width:860px){
    body{flex-direction:row}
    #escena{padding:24px}
    #panel{width:330px;flex:0 0 330px;border-top:0;border-left:1px solid var(--linea);overflow-y:auto;padding-top:var(--sa-t)}
    #tabs{padding:14px 12px 0}
    .hoja{background:transparent;max-height:none;overflow:visible}
    /* En escritorio no tiene sentido una hoja pegada al borde inferior de una
       pantalla ancha: se ancla al panel, del lado donde está el botón. */
    .cs-caja{left:auto;right:24px;bottom:24px;width:340px;border-radius:16px;padding-bottom:16px}
  }
</style>
</head>
<body>

<div id="escena">
  <div id="lienzo"><div id="svgHost"></div></div>
  <div id="zoomInfo">100%</div>
  <div id="acciones">
    <button id="bDeshacer" title="Deshacer">↶</button>
    <button id="bRehacer" title="Rehacer">↷</button>
    <button id="bLineas" title="Ver solo líneas">✎</button>
    <button id="bMenos" title="Alejar">−</button>
    <button id="bMas" title="Acercar">+</button>
    <button id="bZoom" title="Ver entera (100%)">⤢</button>
  </div>
</div>

<div id="panel">
  <div id="tabs">
    <button data-hoja="gen" class="on">Generar</button>
    <button data-hoja="col">Color</button>
    <button data-hoja="ver">Ver</button>
    <button id="bPlegar" title="Plegar el panel" aria-label="Plegar el panel">▼</button>
  </div>

  <!-- ---------------- GENERAR ---------------- -->
  <div class="hoja on" id="hoja-gen">
    <p class="titulo">Estilo</p>
    <div class="ops" id="estilos"></div>
    <div class="fila" title="Cuántas veces se repite la figura alrededor del centro">
      <label for="sSimetria">Simetría</label>
      <input type="range" id="sSimetria" min="3" max="64" step="1" value="12" autocomplete="off">
      <output id="oSimetria">12</output>
    </div>
    <div class="fila" title="Cuántas coronas concéntricas tiene el mandala">
      <label for="sAnillos">Anillos</label>
      <input type="range" id="sAnillos" min="3" max="14" step="1" value="6" autocomplete="off">
      <output id="oAnillos">6</output>
    </div>
    <div class="fila" title="Cuántos adornos lleva cada figura: contornos interiores, puntos, perlas y nervaduras">
      <label for="sDensidad">Detalle</label>
      <input type="range" id="sDensidad" min="0" max="100" step="1" value="55" autocomplete="off"
             title="Cuántos adornos lleva cada figura: contornos interiores, puntos, perlas y nervaduras">
      <output id="oDensidad">55</output>
    </div>
    <div class="semilla">
      <input type="text" id="iSemilla" inputmode="numeric" aria-label="Semilla" autocomplete="off">
      <button class="btn sec" id="bCopiar" style="width:auto;padding:10px 14px">Copiar</button>
    </div>
    <button class="btn" id="bGenerar">Generar nuevo</button>
    <div class="duo" style="margin-top:8px">
      <button class="btn sec" id="bPNG">Guardar PNG</button>
      <button class="btn sec" id="bSVG">Guardar SVG</button>
    </div>

    <p class="titulo" style="margin-top:16px">Mis mandalas</p>
    <button class="btn sec" id="bGuardar">Guardar esta en mi galería</button>
    <div class="gal" id="galeria"></div>
    <p class="pista" id="galVacia">Lo que estás pintando se guarda solo. Guardá aquí las
      que quieras conservar antes de generar otra.</p>
  </div>

  <!-- ---------------- COLOR ---------------- -->
  <div class="hoja" id="hoja-col">
    <p class="titulo">Paletas</p>
    <div class="ops" id="paletas"></div>

    <p class="titulo">Un toque pinta</p>
    <div class="seg ops" id="pinceles">
      <button data-pincel="anillo" class="on">El anillo entero</button>
      <button data-pincel="figura">Una sola figura</button>
    </div>

    <p class="titulo">Color activo</p>
    <div id="swatches"></div>

    <p class="titulo">Acabado</p>
    <div class="seg ops" id="acabados">
      <button data-acabado="plano" class="on">Plano</button>
      <button data-acabado="acuarela">Acuarela</button>
      <button data-acabado="lapiz">Lápiz</button>
    </div>

    <p class="titulo">Contornos</p>
    <div class="seg ops" id="trazos">
      <button data-trazos="tinta" class="on">Oscuros</button>
      <button data-trazos="varios">Variados</button>
      <button data-trazos="claro">Vivos</button>
    </div>

    <p class="titulo">Capas · toca para pintar</p>
    <div class="ops" id="capas"></div>

    <div class="duo">
      <button class="btn sec" id="bBlanco">Pintar desde cero</button>
      <button class="btn" id="bAuto">Auto-colorear</button>
    </div>
  </div>

  <!-- ---------------- VER ---------------- -->
  <div class="hoja" id="hoja-ver">
    <p class="titulo">Vista</p>
    <div class="ops" id="vistas">
      <button data-vista="plano" class="on">Plano</button>
      <button data-vista="camiseta">Camiseta</button>
      <button data-vista="bolsa">Bolsa</button>
      <button data-vista="pared">Pared</button>
      <button data-vista="taza">Taza</button>
    </div>

    <p class="titulo">Fondo / material</p>
    <div class="ops" id="fondos"></div>

    <p class="titulo">Sin color</p>
    <div class="seg ops" id="modoLineas">
      <button data-lineas="0" class="on">Con color</button>
      <button data-lineas="1">Solo líneas</button>
    </div>
    <button class="btn sec" id="bImprimir">Página para colorear</button>
  </div>
</div>

<div id="aviso"></div>

<!-- Selector de color propio. Antes esto era un <input type="color">, que
     delega en el selector del sistema: en el escritorio es una paleta cómoda,
     pero en Android abre un diálogo distinto y torpe, y en iPhone otro. Un
     selector propio se ve y se usa igual en los tres. -->
<div id="colorSheet" hidden>
  <div class="cs-fondo"></div>
  <div class="cs-caja">
    <div class="cs-cab">
      <span class="cs-muestra" id="csMuestra"></span>
      <span class="cs-hex" id="csHex">#000000</span>
      <button class="cs-x" id="csCerrar" aria-label="Cerrar">✕</button>
    </div>
    <div id="csRecientes" class="cs-rec"></div>
    <div id="csTonos" class="cs-rejilla"></div>
    <div class="fila"><label>Tono</label><input type="range" id="csH" min="0" max="360" class="slcolor"></div>
    <div class="fila"><label>Intensidad</label><input type="range" id="csS" min="0" max="100" class="slcolor"></div>
    <div class="fila"><label>Brillo</label><input type="range" id="csL" min="0" max="100" class="slcolor"></div>
    <button class="btn" id="csUsar">Usar este color</button>
  </div>
</div>

<script>
/* =========================================================================
   1. LÍMITES Y FRONTERA DE PAGO
   Todo lo premium se consulta con esPro()/limites(). Hoy esPro() es true;
   el día que se conecte la compra in-app, solo cambia esta función.
   ========================================================================= */
const LIMITES_GRATIS = { exportPx: 800,  marcaAgua: true,  paletas: 3,        motivos: 5,
                         estilos:['geo','natura'] };
const LIMITES_PRO    = { exportPx: 2400, marcaAgua: false, paletas: Infinity, motivos: Infinity,
                         estilos:['geo','hindu','africano','circuito','natura','animal','robot'] };

function esPro(){ return true; }
function limites(){ return esPro() ? LIMITES_PRO : LIMITES_GRATIS; }

/* =========================================================================
   2. PRNG DETERMINISTA (mulberry32)
   Misma semilla -> mismo mandala, siempre.
   ========================================================================= */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const elegir = (rnd, arr) => arr[Math.floor(rnd() * arr.length)];
const entre  = (rnd, a, b) => a + rnd() * (b - a);

/* =========================================================================
   3. GEOMETRÍA Y CATÁLOGO DE MOTIVOS
   Cada motivo se dibuja dentro de UN sector apuntando hacia arriba
   (ángulo 0). El renderer lo replica con rotate().
   ========================================================================= */
const VB = 1000, R_MAX = 452, R_MIN = 24, D2R = Math.PI / 180;

function pt(ang, rad){
  const a = ang * D2R;
  return [ +(rad * Math.sin(a)).toFixed(2), +(-rad * Math.cos(a)).toFixed(2) ];
}
const P = (ang, rad) => pt(ang, rad).join(',');

function circuloPath(cx, cy, r){
  r = +Math.max(r, 0.5).toFixed(2);
  return `M ${(cx-r).toFixed(2)},${cy.toFixed(2)} a ${r},${r} 0 1,0 ${(2*r).toFixed(2)},0 a ${r},${r} 0 1,0 ${(-2*r).toFixed(2)},0 Z`;
}
function estrellaPath(cx, cy, r, puntas){
  let d = '';
  for (let i = 0; i < puntas * 2; i++){
    const a = (i * 180 / puntas - 90) * D2R;
    const rr = i % 2 ? r * 0.44 : r;
    d += (i ? 'L ' : 'M ') + (cx + rr*Math.cos(a)).toFixed(2) + ',' + (cy + rr*Math.sin(a)).toFixed(2) + ' ';
  }
  return d + 'Z';
}

/* Sector de corona relleno: el trozo de anillo entre dos radios y dos ángulos.
   Es la pieza base de todo el HUD del estilo circuito — los arcos gruesos con
   huecos, los bloques sobre el arco y las marcas de escala son todos esto.
   El ángulo crece en sentido horario (pt() usa 0 = arriba), que con la Y hacia
   abajo del SVG es sweep 1 por fuera y sweep 0 al volver por dentro. */
function sectorAnillo(r0, r1, a0, a1){
  const grande = Math.abs(a1 - a0) > 180 ? 1 : 0;
  return `M ${P(a0,r1)} A ${r1.toFixed(1)},${r1.toFixed(1)} 0 ${grande},1 ${P(a1,r1)} `
       + `L ${P(a1,r0)} A ${r0.toFixed(1)},${r0.toFixed(1)} 0 ${grande},0 ${P(a0,r0)} Z`;
}

// firma: (r0, r1, hw, rnd) -> { d, trazo }
const MOTIVOS = {
  petalo(r0, r1, hw){
    const mid = (r0 + r1) / 2;
    return { d:`M ${P(0,r0)} Q ${P(-hw,mid)} ${P(0,r1)} Q ${P(hw,mid)} ${P(0,r0)} Z` };
  },
  gota(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r0)} C ${P(-hw*0.75, r0+h*0.32)} ${P(-hw, r1-h*0.12)} ${P(0,r1)} `
              + `C ${P(hw, r1-h*0.12)} ${P(hw*0.75, r0+h*0.32)} ${P(0,r0)} Z` };
  },
  rombo(r0, r1, hw){
    const mid = (r0 + r1) / 2;
    return { d:`M ${P(0,r0)} L ${P(-hw,mid)} L ${P(0,r1)} L ${P(hw,mid)} Z` };
  },
  triangulo(r0, r1, hw){
    return { d:`M ${P(-hw,r0)} L ${P(hw,r0)} L ${P(0,r1)} Z` };
  },
  arco(r0, r1, hw){
    return { d:`M ${P(-hw,r0)} A ${r0.toFixed(2)},${r0.toFixed(2)} 0 0,1 ${P(hw,r0)} `
              + `L ${P(hw,r1)} A ${r1.toFixed(2)},${r1.toFixed(2)} 0 0,0 ${P(-hw,r1)} Z` };
  },
  circulo(r0, r1, hw){
    const mid = (r0 + r1) / 2;
    const [cx, cy] = pt(0, mid);
    const r = Math.min((r1 - r0) / 2, mid * Math.sin(hw * D2R)) * 0.94;
    return { d: circuloPath(cx, cy, Math.max(r, 3)) };
  },
  punto(r0, r1, hw){
    const mid = (r0 + r1) / 2;
    const [cx, cy] = pt(0, mid);
    const r = Math.min((r1 - r0) * 0.24, mid * Math.sin(hw * D2R) * 0.7, 16);
    return { d: circuloPath(cx, cy, Math.max(r, 2.5)) };
  },
  estrella(r0, r1, hw, rnd){
    const mid = (r0 + r1) / 2;
    const [cx, cy] = pt(0, mid);
    const r = Math.min((r1 - r0) / 2, mid * Math.sin(hw * D2R)) * 0.96;
    return { d: estrellaPath(cx, cy, Math.max(r, 4), rnd() < 0.5 ? 5 : 6) };
  },
  radial(r0, r1){
    return { d:`M ${P(0,r0)} L ${P(0,r1)}`, trazo:true };
  },

  /* --- motivos del vocabulario indio --- */
  // Pétalo de loto: almendra apuntada en los dos extremos, más ancha hacia
  // la mitad baja. Es la silueta de los anillos de loto del yantra.
  loto(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r0)} C ${P(-hw*0.62, r0+h*0.08)} ${P(-hw, r0+h*0.48)} ${P(0,r1)} `
              + `C ${P(hw, r0+h*0.48)} ${P(hw*0.62, r0+h*0.08)} ${P(0,r0)} Z` };
  },
  // Pétalo ojival: base ancha, hombros marcados y punta. Es LA forma de los
  // pétalos de las láminas de mandala clásicas; la almendra de `loto` es más
  // pobre y se nota enseguida.
  ojival(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r0)} C ${P(-hw*0.98, r0+h*0.14)} ${P(-hw*0.94, r0+h*0.56)} ${P(-hw*0.31, r0+h*0.78)} `
              + `C ${P(-hw*0.15, r0+h*0.90)} ${P(-hw*0.05, r1-h*0.03)} ${P(0,r1)} `
              + `C ${P(hw*0.05, r1-h*0.03)} ${P(hw*0.15, r0+h*0.90)} ${P(hw*0.31, r0+h*0.78)} `
              + `C ${P(hw*0.94, r0+h*0.56)} ${P(hw*0.98, r0+h*0.14)} ${P(0,r0)} Z` };
  },
  // Boteh / paisley: gota con la punta enroscada hacia un lado.
  paisley(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r0)} C ${P(-hw, r0+h*0.30)} ${P(-hw*0.92, r1-h*0.12)} ${P(-hw*0.18, r1)} `
              + `C ${P(hw*0.34, r1+h*0.02)} ${P(hw*0.60, r1-h*0.44)} ${P(hw*0.30, r0+h*0.34)} `
              + `C ${P(hw*0.16, r0+h*0.16)} ${P(hw*0.10, r0+h*0.05)} ${P(0,r0)} Z` };
  },
  // Festón: arco que se repite formando una orla ondulada.
  escama(r0, r1, hw){
    return { d:`M ${P(-hw,r0)} Q ${P(0, r1 + (r1-r0)*0.22)} ${P(hw,r0)}`, trazo:true };
  },

  /* --- vocabulario africano: geometría angular, trazo grueso, alto contraste --- */
  chevron(r0, r1, hw){
    return { d:`M ${P(-hw,r0)} L ${P(0,r1)} L ${P(hw,r0)}`, trazo:true };
  },
  peine(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw,r0)} L ${P(hw,r0)}`;
    [-0.62, 0, 0.62].forEach(f => { d += ` M ${P(hw*f, r0)} L ${P(hw*f, r0 + h*0.82)}`; });
    return { d, trazo:true };
  },
  escalera(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw,r0)} L ${P(-hw,r0+h*0.48)} L ${P(0,r0+h*0.48)} L ${P(0,r1)} `
              + `L ${P(hw,r1)} L ${P(hw,r0)} Z` };
  },
  equis(r0, r1, hw){
    return { d:`M ${P(-hw,r0)} L ${P(hw,r1)} M ${P(hw,r0)} L ${P(-hw,r1)}`, trazo:true };
  },
  // Rombo con el centro vaciado (fill-rule evenodd).
  ojo(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0;
    return { d:`M ${P(0,r0)} L ${P(-hw,mid)} L ${P(0,r1)} L ${P(hw,mid)} Z `
              + `M ${P(0,r0+h*0.32)} L ${P(-hw*0.42,mid)} L ${P(0,r1-h*0.32)} L ${P(hw*0.42,mid)} Z`,
             evenodd:true };
  },
  dientes(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw,r0)}`;
    for (let i = 0; i < 3; i++){
      const a = -hw + (2*hw) * i / 3, b = -hw + (2*hw) * (i + 0.5) / 3, c = -hw + (2*hw) * (i + 1) / 3;
      d += ` L ${P(a,r0)} L ${P(b,r1)} L ${P(c,r0)}`;
    }
    return { d: d + ' Z' };
  },
  // Espiral de una sola línea: el motivo africano por excelencia (adinkra).
  espiralAfr(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)/2, mid*Math.sin(hw*D2R)) * 0.95, 5);
    let d = '';
    for (let i = 0; i <= 40; i++){
      const t = i / 40, th = t * 2.6 * 2 * Math.PI, rr = R * t;
      d += (i ? 'L ' : 'M ') + (cx + rr*Math.cos(th)).toFixed(1) + ',' + (cy + rr*Math.sin(th)).toFixed(1) + ' ';
    }
    return { d: d.trim(), trazo:true };
  },
  // Ojo: círculos concéntricos con pupila, el remate de casi toda cenefa.
  ojoAfr(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)/2, mid*Math.sin(hw*D2R)) * 0.95, 5);
    return { d: circuloPath(cx,cy,R) + ' ' + circuloPath(cx,cy,R*0.62) + ' ' + circuloPath(cx,cy,R*0.26),
             evenodd:true };
  },
  // Greca: meandro angular continuo.
  greca(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw, r0+h*0.18)} L ${P(-hw, r1-h*0.18)} L ${P(hw*0.15, r1-h*0.18)} `
              + `L ${P(hw*0.15, r0+h*0.50)} L ${P(-hw*0.42, r0+h*0.50)} L ${P(-hw*0.42, r1-h*0.50)} `
              + `L ${P(hw*0.58, r1-h*0.50)} L ${P(hw*0.58, r0+h*0.18)} L ${P(hw, r0+h*0.18)}`,
             trazo:true };
  },
  // Lente con pupila.
  lente(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0, [cx, cy] = pt(0, mid);
    return { d:`M ${P(-hw,mid)} Q ${P(0,r1)} ${P(hw,mid)} Q ${P(0,r0)} ${P(-hw,mid)} Z `
              + circuloPath(cx, cy, Math.min(h*0.16, 7)), evenodd:true };
  },
  // Rombo anidado con punto.
  romboAnidado(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0, [cx, cy] = pt(0, mid);
    return { d:`M ${P(0,r0)} L ${P(-hw,mid)} L ${P(0,r1)} L ${P(hw,mid)} Z `
              + `M ${P(0,r0+h*0.26)} L ${P(-hw*0.48,mid)} L ${P(0,r1-h*0.26)} L ${P(hw*0.48,mid)} Z `
              + circuloPath(cx, cy, Math.min(h*0.09, 5)), evenodd:true };
  },
  // Marcas de conteo: rayas cortas paralelas.
  conteo(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    for (let i = 0; i < 4; i++){
      const a = -hw*0.8 + 1.6*hw*i/3.4;
      d += ` M ${P(a, r0+h*0.18)} L ${P(a, r1-h*0.18)}`;
    }
    return { d: d.trim(), trazo:true };
  },
  // Triángulo con rayado interior.
  triRayado(r0, r1, hw){
    let d = `M ${P(-hw,r0)} L ${P(hw,r0)} L ${P(0,r1)} Z`;
    for (let i = 1; i <= 3; i++){
      const t = i/4, rr = r0 + (r1-r0)*t, w = hw*(1-t);
      d += ` M ${P(-w,rr)} L ${P(w,rr)}`;
    }
    return { d, trazo:true };
  },
  // Abanico: semirrosetón de rayos sobre un arco.
  abanico(r0, r1, hw){
    let d = `M ${P(-hw,r0)} A ${r0.toFixed(1)},${r0.toFixed(1)} 0 0,1 ${P(hw,r0)}`;
    for (let i = 0; i <= 6; i++){
      const a = -hw + 2*hw*i/6;
      d += ` M ${P(a,r0)} L ${P(a*0.5, r1)}`;
    }
    return { d: d.trim(), trazo:true };
  },
  // Varios zigzag paralelos.
  zigzagMulti(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [0.2, 0.5, 0.8].forEach(f => {
      const rr = r0 + h*f, amp = h*0.13;
      d += ` M ${P(-hw, rr-amp)} L ${P(-hw*0.33, rr+amp)} L ${P(hw*0.33, rr-amp)} L ${P(hw, rr+amp)}`;
    });
    return { d: d.trim(), trazo:true };
  },
  // Damero de bloques alternos.
  damero(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    for (let f = 0; f < 2; f++)
      for (let c = 0; c < 2; c++){
        if ((f + c) % 2) continue;
        const ra = r0 + h*f/2, rb = r0 + h*(f+1)/2;
        const a = -hw + hw*c, b = -hw + hw*(c+1);
        d += ` M ${P(a,ra)} L ${P(a,rb)} L ${P(b,rb)} L ${P(b,ra)} Z`;
      }
    return { d: d.trim() };
  },

  /* --- vocabulario de circuito impreso --- */
  traza(r0, r1, hw){
    const h = r1 - r0, a = hw * 0.72;
    return { d:`M ${P(0,r0)} L ${P(0,r0+h*0.28)} L ${P(a,r0+h*0.56)} L ${P(a,r1)}`, trazo:true };
  },
  pad(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)/2, mid*Math.sin(hw*D2R)) * 0.88, 4);
    return { d: circuloPath(cx, cy, R) + ' ' + circuloPath(cx, cy, Math.max(R*0.42, 1.6)), evenodd:true };
  },
  chip(r0, r1, hw){
    const h = r1 - r0, a = hw * 0.5;
    return { d:`M ${P(-a,r0+h*0.22)} L ${P(-a,r1-h*0.22)} L ${P(a,r1-h*0.22)} L ${P(a,r0+h*0.22)} Z` };
  },
  pines(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [-0.72,-0.24,0.24,0.72].forEach(f => {
      d += ` M ${P(hw*f,r0)} L ${P(hw*f, r0+h*0.26)} M ${P(hw*f, r1-h*0.26)} L ${P(hw*f,r1)}`;
    });
    return { d: d.trim(), trazo:true };
  },

  /* --- vocabulario natural: dendritas, hojas, venas --- */
  // Brazo de copo de nieve: espina con ramas laterales a 60°.
  rama(r0, r1){
    const h = r1 - r0, n = 3;
    let d = `M ${P(0,r0)} L ${P(0,r1)}`;
    for (let i = 1; i <= n; i++){
      const t = r0 + h * i / (n + 1), L = (r1 - t) * 0.62;
      const [ax, ay] = pt(0, t);
      d += ` M ${ax},${ay} L ${(ax + L*0.866).toFixed(1)},${(ay - L*0.5).toFixed(1)}`
         + ` M ${ax},${ay} L ${(ax - L*0.866).toFixed(1)},${(ay - L*0.5).toFixed(1)}`;
    }
    return { d, trazo:true };
  },
  hoja(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r0)} C ${P(-hw*0.92, r0+h*0.30)} ${P(-hw*0.55, r1-h*0.16)} ${P(0,r1)} `
              + `C ${P(hw*0.55, r1-h*0.16)} ${P(hw*0.92, r0+h*0.30)} ${P(0,r0)} Z` };
  },
  vena(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(0,r0)} L ${P(0,r1)}`;
    for (let i = 1; i <= 3; i++){
      const t = r0 + h * i / 4.6;
      d += ` M ${P(0,t)} L ${P(-hw*0.55, t + h*0.24)} M ${P(0,t)} L ${P(hw*0.55, t + h*0.24)}`;
    }
    return { d, trazo:true };
  },

  /* --- vocabulario mecánico --- */
  diente(r0, r1, hw){
    return { d:`M ${P(-hw*0.58,r0)} L ${P(-hw*0.34,r1)} L ${P(hw*0.34,r1)} L ${P(hw*0.58,r0)} Z` };
  },
  tuerca(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)/2, mid*Math.sin(hw*D2R)) * 0.95, 5);
    let d = '';
    for (let i = 0; i < 6; i++){
      const a = (i * 60 - 90) * D2R;
      d += (i ? 'L ' : 'M ') + (cx + R*Math.cos(a)).toFixed(1) + ',' + (cy + R*Math.sin(a)).toFixed(1) + ' ';
    }
    return { d: d + 'Z ' + circuloPath(cx, cy, Math.max(R*0.44, 2)), evenodd:true };
  },
  panel(r0, r1, hw){
    const h = r1 - r0, a = hw * 0.82;
    return { d:`M ${P(-a,r0)} L ${P(-a,r1)} L ${P(a*0.45,r1)} L ${P(a,r1-h*0.32)} L ${P(a,r0)} Z` };
  },
  antena(r0, r1, hw){
    const h = r1 - r0, [cx, cy] = pt(0, r1 - h*0.13);
    return { d:`M ${P(0,r0)} L ${P(0, r1-h*0.13)} ` + circuloPath(cx, cy, Math.max(h*0.12, 2.5)), trazo:true };
  },

  /* --- vocabulario de microchip (die / floorplan) ---
     Un die real tiene: anillo de pads de I/O en el perímetro, anillos de
     potencia VDD/VSS, macros duros (SRAM) con textura de líneas paralelas,
     filas de celdas estándar y rutado Manhattan (solo tramos rectos y
     giros de 90°) con vías en cada cambio de capa.                        */
  padIO(r0, r1, hw){
    const h = r1 - r0, a = hw * 0.62, c = r0 + h * 0.36;
    return { d:`M ${P(-a,c)} L ${P(-a,r1)} L ${P(a,r1)} L ${P(a,c)} Z `
              + `M ${P(-a*0.24,r0)} L ${P(-a*0.24,c)} L ${P(a*0.24,c)} L ${P(a*0.24,r0)} Z` };
  },
  manhattan(r0, r1, hw){
    const h = r1 - r0, ra = r0 + h * 0.42, a = hw * 0.66;
    return { d:`M ${P(0,r0)} L ${P(0,ra)} `
              + `A ${ra.toFixed(1)},${ra.toFixed(1)} 0 0,1 ${P(a,ra)} L ${P(a,r1)}`, trazo:true };
  },
  // Macro de memoria: haz de líneas paralelas encerrado entre dos arcos.
  arrayMem(r0, r1, hw){
    let d = '';
    for (let i = 0; i < 7; i++){
      const t = -hw + 2 * hw * (i + 0.5) / 7;
      d += ` M ${P(t,r0)} L ${P(t,r1)}`;
    }
    d += ` M ${P(-hw,r0)} A ${r0.toFixed(1)},${r0.toFixed(1)} 0 0,1 ${P(hw,r0)}`
       + ` M ${P(-hw,r1)} A ${r1.toFixed(1)},${r1.toFixed(1)} 0 0,1 ${P(hw,r1)}`;
    return { d: d.trim(), trazo:true };
  },
  // Filas de celdas estándar abutadas.
  celdas(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [0.05, 0.39, 0.73].forEach(f => {
      const b0 = r0 + h*f, b1 = r0 + h*(f + 0.19);
      d += ` M ${P(-hw*0.92,b0)} L ${P(-hw*0.92,b1)} L ${P(hw*0.92,b1)} L ${P(hw*0.92,b0)} Z`;
    });
    return { d: d.trim() };
  },
  viaCuadrada(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const s = Math.max(Math.min((r1-r0)*0.28, mid*Math.sin(hw*D2R)*0.7, 11), 2.5);
    return { d:`M ${(cx-s).toFixed(1)},${(cy-s).toFixed(1)} L ${(cx+s).toFixed(1)},${(cy-s).toFixed(1)} `
              + `L ${(cx+s).toFixed(1)},${(cy+s).toFixed(1)} L ${(cx-s).toFixed(1)},${(cy+s).toFixed(1)} Z` };
  },

  /* --- HUD de instrumento: lo que en las referencias rodea el disco central ---
     Arcos partidos, bloques sobre el arco, escalas de marcas, cuñas y flechas.
     Es lo que hace que una placa se lea como instrumento y no como retícula, y
     lo que le faltaba al estilo: sin esto, todos los anillos eran variaciones
     de lo mismo. Casi todo es RELLENO, no trazo, para que se pueda pintar. */
  // Arco grueso partido en tramos desiguales.
  arcoSegmentado(r0, r1, hw){
    const h = r1 - r0;
    return { d: sectorAnillo(r0 + h*0.28, r0 + h*0.60, -hw*0.94, hw*0.26) + ' '
              + sectorAnillo(r0 + h*0.28, r0 + h*0.60, hw*0.44, hw*0.88) + ' '
              + sectorAnillo(r0 + h*0.72, r0 + h*0.88, -hw*0.66, hw*0.60) };
  },
  // Arco con bloques encima, de largo desigual. El rasgo más repetido de las
  // referencias de HUD.
  arcoBloques(r0, r1, hw){
    const h = r1 - r0, largos = [0.34, 0.72, 0.46, 0.88, 0.38];
    let d = sectorAnillo(r0 + h*0.08, r0 + h*0.24, -hw*0.94, hw*0.94);
    largos.forEach((L, i) => {
      const a0 = -hw*0.90 + 1.80*hw*(i + 0.14) / largos.length;
      const a1 = -hw*0.90 + 1.80*hw*(i + 0.82) / largos.length;
      d += ' ' + sectorAnillo(r0 + h*0.34, r0 + h*(0.34 + 0.56*L), a0, a1);
    });
    return { d };
  },
  // Escala circular: marcas largas y cortas alternadas, como una regla curvada.
  escalaRadial(r0, r1, hw){
    // Cinco marcas por sector, no nueve: multiplicadas por las repeticiones del
    // anillo, nueve daban doscientas marcas y el anillo dejaba de leerse como
    // escala para leerse como un peine negro.
    const h = r1 - r0, n = 5;
    let d = '';
    for (let i = 0; i < n; i++){
      const a = -hw*0.92 + 1.84*hw*i/(n - 1), larga = i % 3 === 0;
      const w = hw * (larga ? 0.055 : 0.028);
      d += ' ' + sectorAnillo(r0 + h*0.16, r0 + h*(larga ? 0.88 : 0.56), a - w, a + w);
    }
    return { d: d.trim() };
  },
  // Anillo de datos: bloques de largo variable, un código de barras curvado.
  anilloDatos(r0, r1, hw){
    const h = r1 - r0;
    let d = '', a = -hw*0.94;
    for (let i = 0; i < 14 && a < hw*0.88; i++){
      const w = hw * (0.06 + 0.10 * ((i * 7 % 5) / 5));
      d += ' ' + sectorAnillo(r0 + h*0.30, r0 + h*0.74, a, Math.min(a + w, hw*0.94));
      a += w + hw*0.07;
    }
    return { d: d.trim() };
  },
  // Cuña de retícula: el sector fino que enmarca una zona del panel.
  cunaHud(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.88, r0+h*0.10)} L ${P(-hw*0.60, r1)} L ${P(hw*0.60, r1)} `
              + `L ${P(hw*0.88, r0+h*0.10)} Z`, trazo:true };
  },
  // Los triángulos de sentido que aparecen sueltos sobre el fondo.
  flechaTicks(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [0, 1, 2].forEach(i => {
      const b = r0 + h*(0.14 + i*0.27), s = 1 - i*0.20;
      d += ` M ${P(0, b + h*0.22*s)} L ${P(-hw*0.34*s, b)} L ${P(hw*0.34*s, b)} Z`;
    });
    return { d: d.trim() };
  },

  /* --- rutado: pistas, vías y pads --- */
  // Haz de pistas en diagonal a 45°, que es como se rutea de verdad.
  busDiagonal(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    for (let i = 0; i < 4; i++){
      const a = -hw*0.74 + hw*0.46*i, q = r0 + h*(0.22 + i*0.16);
      d += ` M ${P(a, r0)} L ${P(a, q)} L ${P(a + hw*0.52, q + h*0.20)} L ${P(a + hw*0.52, r1)}`;
    }
    return { d: d.trim(), trazo:true };
  },
  // Pista con dos quiebres que muere en su vía.
  trazaVia(r0, r1, hw){
    const h = r1 - r0, rr = r0 + h*0.74, [cx, cy] = pt(hw*0.42, rr);
    const R = Math.max(Math.min(h*0.13, 7), 2.4);
    return { d:`M ${P(-hw*0.44, r0)} L ${P(-hw*0.44, r0+h*0.24)} L ${P(0, r0+h*0.46)} `
              + `L ${P(hw*0.42, r0+h*0.46)} L ${P(hw*0.42, rr - R)} `
              + circuloPath(cx, cy, R), trazo:true };
  },
  // Vía redonda con su taladro.
  viaRedonda(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)*0.30, mid*Math.sin(hw*D2R)*0.8, 12), 3);
    return { d: circuloPath(cx, cy, R) + ' ' + circuloPath(cx, cy, R*0.42), evenodd:true };
  },
  // Pad de terminación: el punto gordo en el que muere una pista.
  padTermina(r0, r1, hw){
    const h = r1 - r0, [cx, cy] = pt(0, r0 + h*0.74);
    const R = Math.max(Math.min(h*0.22, 12), 3);
    return { d:`M ${P(-hw*0.10, r0)} L ${P(-hw*0.10, r0+h*0.64)} L ${P(hw*0.10, r0+h*0.64)} `
              + `L ${P(hw*0.10, r0)} Z ` + circuloPath(cx, cy, R) };
  },
  // Matriz de puntos: la retícula densa que rellena los huecos de la placa.
  matrizPuntos(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    for (let f = 0; f < 4; f++)
      for (let c = 0; c < 5; c++){
        const [cx, cy] = pt(-hw*0.72 + hw*1.44*c/4, r0 + h*(0.18 + 0.64*f/3));
        d += circuloPath(cx, cy, Math.max(Math.min(h*0.05, 3.4), 1.2)) + ' ';
      }
    return { d: d.trim() };
  },
  // Conector: el bloque macizo con sus taladros.
  conector(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.36, r0+h*0.06)} L ${P(-hw*0.36, r1-h*0.06)} `
              + `L ${P(hw*0.36, r1-h*0.06)} L ${P(hw*0.36, r0+h*0.06)} Z `
              + circuloPath(...pt(0, r0+h*0.30), Math.min(h*0.09, 6)) + ' '
              + circuloPath(...pt(0, r0+h*0.70), Math.min(h*0.09, 6)), evenodd:true };
  },

  /* --- más vocabulario natural: hojas, frondas y fractales --- */
  hojaLobulada(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r0)} `
      + `C ${P(-hw*0.5,r0+h*0.10)} ${P(-hw,r0+h*0.22)} ${P(-hw*0.72,r0+h*0.38)} `
      + `C ${P(-hw*1.02,r0+h*0.50)} ${P(-hw*0.84,r0+h*0.68)} ${P(-hw*0.44,r0+h*0.72)} `
      + `C ${P(-hw*0.58,r0+h*0.88)} ${P(-hw*0.20,r1)} ${P(0,r1)} `
      + `C ${P(hw*0.20,r1)} ${P(hw*0.58,r0+h*0.88)} ${P(hw*0.44,r0+h*0.72)} `
      + `C ${P(hw*0.84,r0+h*0.68)} ${P(hw*1.02,r0+h*0.50)} ${P(hw*0.72,r0+h*0.38)} `
      + `C ${P(hw,r0+h*0.22)} ${P(hw*0.5,r0+h*0.10)} ${P(0,r0)} Z` };
  },
  // Fronda pinnada: raquis con hojuelas enfrentadas que decrecen hacia la punta.
  helecho(r0, r1, hw){
    const h = r1 - r0, n = 5;
    let d = `M ${P(0,r0)} L ${P(0,r1)}`;
    for (let i = 1; i <= n; i++){
      const t = r0 + h * i / (n + 1), L = (1 - i / (n + 1.2));
      const w = hw * L, alto = h * 0.13 * (0.5 + L);
      d += ` M ${P(0,t)} Q ${P(-w*0.8, t + alto*0.4)} ${P(-w, t + alto)}`
         + ` Q ${P(-w*0.35, t + alto*0.35)} ${P(0,t)}`
         + ` M ${P(0,t)} Q ${P(w*0.8, t + alto*0.4)} ${P(w, t + alto)}`
         + ` Q ${P(w*0.35, t + alto*0.35)} ${P(0,t)}`;
    }
    return { d, trazo:true };
  },
  // Borde de copo de Koch: la fractal clásica, dos niveles de recursión.
  koch(r0, r1, hw){
    const [x0, y0] = pt(-hw, r0), [x1, y1] = pt(hw, r0);
    const pts = kochPuntos(x0, y0, x1, y1, 2);
    return { d: `M ${x0.toFixed(1)},${y0.toFixed(1)} `
                + pts.map(p => `L ${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' '), trazo:true };
  },
  // Espiral logarítmica: la curva del nautilus y de las cabezuelas.
  espiral(r0, r1, hw){
    let d = '';
    for (let i = 0; i <= 22; i++){
      const t = i / 22;
      d += (i ? 'L ' : 'M ') + P(-hw + 2*hw*t*t, r0 + (r1 - r0) * t) + ' ';
    }
    return { d: d.trim(), trazo:true };
  },

  /* --- agua --- */
  // Rizos concéntricos, como los que deja una gota al caer.
  onda(r0, r1, hw){
    let d = '';
    [0.18, 0.5, 0.82].forEach(f => {
      const rr = r0 + (r1 - r0) * f;
      d += ` M ${P(-hw,rr)} A ${rr.toFixed(1)},${rr.toFixed(1)} 0 0,1 ${P(hw,rr)}`;
    });
    return { d: d.trim(), trazo:true };
  },
  // Cresta con voluta enroscada, al modo de la ola de Hokusai.
  ola(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw,r0)} C ${P(-hw*0.62, r0+h*0.78)} ${P(hw*0.08, r1)} ${P(hw*0.52, r1-h*0.16)} `
              + `C ${P(hw*0.74, r1-h*0.52)} ${P(hw*0.40, r0+h*0.26)} ${P(hw*0.08, r0+h*0.44)} `
              + `C ${P(hw*0.32, r0+h*0.20)} ${P(hw*0.70, r0+h*0.07)} ${P(hw,r0)} Z` };
  },
  gotaAgua(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r1)} C ${P(-hw*0.52, r0+h*0.60)} ${P(-hw*0.66, r0+h*0.18)} ${P(0,r0)} `
              + `C ${P(hw*0.66, r0+h*0.18)} ${P(hw*0.52, r0+h*0.60)} ${P(0,r1)} Z` };
  },
  burbujas(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [[0.24, 0.34, 0.30], [0.60, -0.38, 0.22], [0.85, 0.26, 0.14]].forEach(([f, g, s]) => {
      const [cx, cy] = pt(hw * g, r0 + h * f);
      d += circuloPath(cx, cy, Math.max(h * s * 0.5, 2)) + ' ';
    });
    return { d: d.trim(), trazo:true };
  },

  /* --- viento --- */
  // Voluta: la espiral abierta con la que se dibuja una racha de aire.
  remolino(r0, r1, hw){
    let d = '';
    for (let i = 0; i <= 20; i++){
      const t = i / 20;
      d += (i ? 'L ' : 'M ')
         + P(-hw * 0.9 + hw * 2.4 * t * t, r0 + (r1 - r0) * Math.sin(t * Math.PI * 0.9)) + ' ';
    }
    return { d: d.trim(), trazo:true };
  },
  // Líneas de corriente paralelas.
  racha(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [0.22, 0.5, 0.78].forEach((f, i) => {
      const rr = r0 + h * f;
      d += ` M ${P(-hw*0.95, rr)} Q ${P(0, rr + h*0.16)} ${P(hw*(0.55 + i*0.16), rr - h*0.05)}`;
    });
    return { d: d.trim(), trazo:true };
  },

  /* --- naturaleza RELLENA ---
     Las mismas reglas de crecimiento de arriba, pero en figuras cerradas. El
     estilo tenía nueve motivos de trazo suelto contra ocho de relleno: en una
     lámina para colorear eso significa que media mandala no se puede pintar.
     Estos motivos existen para que sí se pueda. */
  // Fronda de helecho en silueta: hojuelas que decrecen hacia la punta.
  fronda(r0, r1, hw){
    const h = r1 - r0, n = 5;
    let d = `M ${P(0,r0)}`;
    for (let i = 0; i < n; i++){                       // sube lobulando por la izquierda
      const a = r0 + h*i/n, b = r0 + h*(i+1)/n, L = 1 - i/(n + 0.7);
      d += ` Q ${P(-hw*L, a + (b-a)*0.20)} ${P(-hw*L*0.34, b)}`;
    }
    d += ` L ${P(0,r1)}`;
    for (let i = n - 1; i >= 0; i--){                  // baja por la derecha
      const a = r0 + h*i/n, b = r0 + h*(i+1)/n, L = 1 - i/(n + 0.7);
      d += ` Q ${P(hw*L, a + (b-a)*0.80)} ${P(hw*L*0.34, a)}`;
    }
    return { d: d + ' Z' };
  },
  // Dendrita de escarcha: brazo con ramas que repiten el brazo. Es la fractal
  // del hielo, y no se construye sobre un triángulo.
  dendrita(r0, r1, hw){
    const h = r1 - r0, w = hw*0.11;
    let d = `M ${P(-w, r0)} L ${P(-w*0.45, r1)} L ${P(w*0.45, r1)} L ${P(w, r0)} Z`;
    [0.20, 0.44, 0.68].forEach((f, i) => {
      const rr = r0 + h*f, L = hw*(0.88 - i*0.22), alto = h*0.15;
      [-1, 1].forEach(s => {
        d += ` M ${P(s*w*0.6, rr)} L ${P(s*L, rr + alto*0.95)} `
           + `L ${P(s*L*0.70, rr + alto*1.22)} L ${P(s*w*0.6, rr + alto*0.40)} Z`;
        d += ` M ${P(s*L*0.52, rr + alto*0.55)} L ${P(s*L*0.80, rr + alto*1.55)} `
           + `L ${P(s*L*0.60, rr + alto*1.66)} L ${P(s*L*0.42, rr + alto*0.74)} Z`;
      });
    });
    return { d: d.trim() };
  },
  // Rama con hojuelas rellenas.
  ramaHojas(r0, r1, hw){
    const h = r1 - r0, w = hw*0.09;
    let d = `M ${P(-w, r0)} L ${P(-w*0.4, r1)} L ${P(w*0.4, r1)} L ${P(w, r0)} Z`;
    [0.18, 0.44, 0.70].forEach((f, i) => {
      const rr = r0 + h*f, L = hw*(0.92 - i*0.20), alto = h*0.20;
      [-1, 1].forEach(s => {
        d += ` M ${P(0, rr)} Q ${P(s*L, rr + alto*0.12)} ${P(s*L*0.70, rr + alto)} `
           + `Q ${P(s*L*0.18, rr + alto*0.48)} ${P(0, rr)} Z`;
      });
    });
    return { d: d.trim() };
  },
  // Escama de piña: lóbulo con su nervadura vaciada. Se apilan como en la piña.
  escamaPina(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.94, r0)} Q ${P(-hw*0.88, r0+h*0.70)} ${P(0, r1)} `
              + `Q ${P(hw*0.88, r0+h*0.70)} ${P(hw*0.94, r0)} Z `
              + `M ${P(-hw*0.44, r0+h*0.14)} Q ${P(-hw*0.40, r0+h*0.58)} ${P(0, r0+h*0.76)} `
              + `Q ${P(hw*0.40, r0+h*0.58)} ${P(hw*0.44, r0+h*0.14)} Z`, evenodd:true };
  },
  // Semillero: el parche de semillas colocadas con el ángulo áureo.
  semillero(r0, r1, hw){
    const h = r1 - r0, n = 14;
    let d = '';
    for (let i = 0; i < n; i++){
      const t = Math.sqrt((i + 0.5) / n), a = ((i * 137.507) % 360) - 180;
      const [cx, cy] = pt(hw*0.88*Math.sin(a*D2R)*t, r0 + h*(0.12 + 0.76*t));
      d += circuloPath(cx, cy, Math.max(h*0.055*(0.7 + t), 1.4)) + ' ';
    }
    return { d: d.trim() };
  },
  // Nautilo: la espiral logarítmica cerrada, con sus cámaras vaciadas.
  nautilo(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min(h*0.46, mid*Math.sin(hw*D2R)*0.90), 9);
    const A = 2.4*Math.PI, b = Math.log(3.4) / (2*Math.PI), pasos = 40;
    const f = a => {
      const rr = R*Math.exp(b*(a - A));
      return `${(cx + rr*Math.cos(a)).toFixed(1)},${(cy + rr*Math.sin(a)).toFixed(1)}`;
    };
    let d = `M ${f(0)}`;
    for (let i = 1; i <= pasos; i++) d += ` L ${f(A*i/pasos)}`;
    for (let i = pasos; i >= 0; i--) d += ` L ${f(A*i/pasos - 2*Math.PI)}`;
    d += ' Z';
    for (let i = 1; i < 5; i++){                      // tabiques entre cámaras
      const a = A*i/5, e = 0.035;
      d += ` M ${f(a - e)} L ${f(a + e)} L ${f(a + e - 2*Math.PI)} L ${f(a - e - 2*Math.PI)} Z`;
    }
    return { d, evenodd:true };
  },
  // Cúmulo de burbujas relleno, cada una con su reflejo vaciado.
  cumulo(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [[0.28, 0, 0.34], [0.60, -0.44, 0.24], [0.64, 0.44, 0.22], [0.88, 0.04, 0.16]]
      .forEach(([f, gg, s]) => {
        const [cx, cy] = pt(hw*gg, r0 + h*f), R = Math.max(h*s*0.62, 2.5);
        d += circuloPath(cx, cy, R) + ' ' + circuloPath(cx - R*0.32, cy - R*0.32, R*0.22) + ' ';
      });
    return { d: d.trim(), evenodd:true };
  },
  // Cinta de agua: la onda con cuerpo, no la línea suelta.
  ondaBanda(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [0.14, 0.54].forEach(f => {
      const a = r0 + h*f, b = a + h*0.24;
      d += ` M ${P(-hw, a)} Q ${P(-hw*0.5, a + h*0.15)} ${P(0, a)} `
         + `Q ${P(hw*0.5, a - h*0.15)} ${P(hw, a)} L ${P(hw, b)} `
         + `Q ${P(hw*0.5, b - h*0.15)} ${P(0, b)} Q ${P(-hw*0.5, b + h*0.15)} ${P(-hw, b)} Z`;
    });
    return { d: d.trim() };
  },
  // Racha de viento con cuerpo: el trazo ancho que se afila.
  rachaAncha(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [[0.16, 1], [0.48, -1], [0.78, 1]].forEach(([f, s], i) => {
      const rr = r0 + h*f, gr = h*0.11*(1 - i*0.16);
      d += ` M ${P(-hw*0.96, rr)} Q ${P(0, rr + h*0.16*s)} ${P(hw*0.84, rr)} `
         + `Q ${P(0, rr + h*0.16*s + gr)} ${P(-hw*0.96, rr + gr)} Z`;
    });
    return { d: d.trim() };
  },
  // Remolino con cuerpo: la voluta convertida en cinta.
  remolinoAncho(r0, r1, hw){
    const h = r1 - r0, n = 16;
    const ang = t => -hw*0.92 + hw*2.4*t*t;
    const rad = t => r0 + h*Math.sin(t*Math.PI*0.92);
    let d = `M ${P(ang(0), rad(0))}`;
    for (let i = 1; i <= n; i++) d += ` L ${P(ang(i/n), rad(i/n))}`;
    for (let i = n; i >= 0; i--){
      const t = i/n;
      d += ` L ${P(ang(t) + hw*0.05*(1 - t), rad(t) - h*0.17*(1 - t*0.65))}`;
    }
    return { d: d + ' Z' };
  },

  /* --- vocabulario mecha: robots de anime de los noventa --- */
  // Cresta en V de la frente: el rasgo más reconocible del género.
  vfin(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r0)} L ${P(-hw*0.88,r1)} L ${P(-hw*0.46,r1)} L ${P(0, r0+h*0.46)} `
              + `L ${P(hw*0.46,r1)} L ${P(hw*0.88,r1)} Z` };
  },
  // Cabeza de frente: visor ancho y mentón estrecho.
  visor(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.82, r0+h*0.52)} L ${P(-hw*0.48, r1)} L ${P(hw*0.48, r1)} `
              + `L ${P(hw*0.82, r0+h*0.52)} L ${P(hw*0.34, r0)} L ${P(-hw*0.34, r0)} Z` };
  },
  // El ojo único tipo Zaku.
  monoojo(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0;
    return { d:`M ${P(-hw*0.72, mid)} L ${P(-hw*0.26, mid+h*0.24)} L ${P(hw*0.26, mid+h*0.24)} `
              + `L ${P(hw*0.72, mid)} L ${P(hw*0.26, mid-h*0.24)} L ${P(-hw*0.26, mid-h*0.24)} Z` };
  },
  // Placa de hombro con bisel.
  hombrera(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.92,r0)} L ${P(-hw*0.92, r1-h*0.3)} L ${P(-hw*0.52,r1)} `
              + `L ${P(hw*0.52,r1)} L ${P(hw*0.92, r1-h*0.3)} L ${P(hw*0.92,r0)} Z` };
  },
  // Tobera de propulsor: cono con boca hueca.
  thruster(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.34,r0)} L ${P(-hw*0.92,r1)} L ${P(hw*0.92,r1)} L ${P(hw*0.34,r0)} Z `
              + `M ${P(-hw*0.5, r0+h*0.5)} L ${P(-hw*0.72,r1)} L ${P(hw*0.72,r1)} L ${P(hw*0.5, r0+h*0.5)} Z`,
             evenodd:true };
  },
  // Vernier: rejilla de aletas de ventilación.
  rejilla(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [0.10, 0.38, 0.66].forEach(f => {
      d += ` M ${P(-hw*0.78, r0+h*f)} L ${P(-hw*0.78, r0+h*(f+0.17))} `
         + `L ${P(hw*0.78, r0+h*(f+0.17))} L ${P(hw*0.78, r0+h*f)} Z`;
    });
    return { d: d.trim() };
  },
  // Cilindro hidráulico con sus anillos.
  piston(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.22,r0)} L ${P(-hw*0.22,r1)} L ${P(hw*0.22,r1)} L ${P(hw*0.22,r0)} Z`;
    [0.26, 0.52, 0.78].forEach(f => {
      d += ` M ${P(-hw*0.52, r0+h*f)} L ${P(-hw*0.52, r0+h*(f+0.09))} `
         + `L ${P(hw*0.52, r0+h*(f+0.09))} L ${P(hw*0.52, r0+h*f)} Z`;
    });
    return { d };
  },
  // Binder / ala de mochila, tipo Wing.
  ala(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r0)} L ${P(-hw*0.36, r0+h*0.16)} L ${P(-hw*0.98, r1-h*0.26)} `
              + `L ${P(-hw*0.56, r1)} L ${P(0, r1-h*0.20)} L ${P(hw*0.56, r1)} `
              + `L ${P(hw*0.98, r1-h*0.26)} L ${P(hw*0.36, r0+h*0.16)} Z` };
  },
  // Cañón de haz: tubo con anillos de refuerzo y boca.
  canon(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.28,r0)} L ${P(-hw*0.28,r1)} L ${P(hw*0.28,r1)} L ${P(hw*0.28,r0)} Z`;
    [0.16, 0.42, 0.68].forEach(f => {
      d += ` M ${P(-hw*0.62, r0+h*f)} L ${P(-hw*0.62, r0+h*(f+0.1))} `
         + `L ${P(hw*0.62, r0+h*(f+0.1))} L ${P(hw*0.62, r0+h*f)} Z`;
    });
    d += ` M ${P(-hw*0.46, r1-h*0.1)} L ${P(-hw*0.46, r1)} L ${P(hw*0.46, r1)} L ${P(hw*0.46, r1-h*0.1)} Z`;
    return { d };
  },
  // Manguera segmentada: los tubos expuestos del Zaku y del EVA.
  cable(r0, r1, hw){
    const h = r1 - r0, n = 5;
    let d = '';
    for (let i = 0; i < n; i++){
      const a = r0 + h*(i + 0.08)/n, b = r0 + h*(i + 0.84)/n;
      const w = hw * (0.30 + 0.12 * Math.sin(i * 1.7));
      d += ` M ${P(-w,a)} L ${P(-w,b)} L ${P(w,b)} L ${P(w,a)} Z`;
    }
    return { d: d.trim() };
  },
  // Articulación de rótula con horquilla.
  articulacion(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min(h * 0.3, mid * Math.sin(hw * D2R) * 0.85), 4);
    return { d: circuloPath(cx, cy, R)
              + ` M ${P(-hw*0.46,r0)} L ${P(-hw*0.46,mid)} L ${P(hw*0.46,mid)} L ${P(hw*0.46,r0)} Z`
              + ` M ${P(-hw*0.46,r1)} L ${P(-hw*0.46,mid)} L ${P(hw*0.46,mid)} L ${P(hw*0.46,r1)} Z`,
             evenodd:true };
  },
  // Garra manipuladora de tres dedos.
  garra(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.48,r0)} L ${P(-hw*0.48, r0+h*0.34)} L ${P(hw*0.48, r0+h*0.34)} L ${P(hw*0.48,r0)} Z`;
    [-0.68, 0, 0.68].forEach(f => {
      d += ` M ${P(hw*f - hw*0.13, r0+h*0.34)} L ${P(hw*f - hw*0.17, r1)} `
         + `L ${P(hw*f + hw*0.17, r1)} L ${P(hw*f + hw*0.13, r0+h*0.34)} Z`;
    });
    return { d };
  },
  // Sensor / cámara con iris.
  sensor(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)/2, mid*Math.sin(hw*D2R)) * 0.9, 5);
    return { d: circuloPath(cx,cy,R) + ' ' + circuloPath(cx,cy,R*0.58) + ' ' + circuloPath(cx,cy,R*0.22),
             evenodd:true };
  },
  // Placa de blindaje con remaches.
  remaches(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.88,r0)} L ${P(-hw*0.88,r1)} L ${P(hw*0.88,r1)} L ${P(hw*0.88,r0)} Z`;
    [[-0.58, 0.2], [0.58, 0.2], [-0.58, 0.78], [0.58, 0.78]].forEach(([a, f]) => {
      const [cx, cy] = pt(hw*a, r0 + h*f);
      d += ' ' + circuloPath(cx, cy, Math.min(h*0.09, 5));
    });
    return { d, evenodd:true };
  },
  // Aspa de turbina curvada, como las de un rotor de compresor.
  turbina(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.80, r0)} C ${P(-hw*0.52, r0+h*0.48)} ${P(-hw*0.12, r1-h*0.22)} ${P(hw*0.04, r1)} `
              + `L ${P(hw*0.62, r1)} C ${P(hw*0.42, r1-h*0.42)} ${P(hw*0.14, r0+h*0.42)} ${P(hw*0.06, r0)} Z` };
  },
  // Destello de impacto: la estrella de los golpes del manga.
  destello(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0;
    let d = '';
    for (let i = 0; i < 8; i++){
      d += (i ? 'L ' : 'M ') + P(-hw + 2*hw*i/7, i % 2 ? mid + h*0.46 : mid - h*0.12) + ' ';
    }
    return { d: d.trim() + ' Z' };
  },
  // Líneas de velocidad.
  velocidad(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [-0.62, -0.21, 0.21, 0.62].forEach((f, i) => {
      d += ` M ${P(hw*f, r0 + h*0.08*i)} L ${P(hw*f, r1 - h*0.08*(3-i))}`;
    });
    return { d: d.trim(), trazo:true };
  },
  // Placa de blindaje escalonada con esquinas biseladas: la forma base del
  // panelado de un mecha ochentero.
  blindaje(r0, r1, hw){
    const h = r1 - r0, b = hw * 0.22;
    return { d:`M ${P(-hw+b, r0)} L ${P(-hw, r0 + h*0.22)} L ${P(-hw, r1 - h*0.34)} `
              + `L ${P(-hw*0.62, r1)} L ${P(hw*0.62, r1)} L ${P(hw, r1 - h*0.34)} `
              + `L ${P(hw, r0 + h*0.22)} L ${P(hw-b, r0)} Z` };
  },
  // Disipador: aletas paralelas muy juntas.
  radiador(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw,r0)} L ${P(-hw,r0+h*0.16)} L ${P(hw,r0+h*0.16)} L ${P(hw,r0)} Z`;
    for (let i = 0; i < 6; i++){
      const a = -hw + 2*hw*(i + 0.16)/6, b = -hw + 2*hw*(i + 0.84)/6;
      d += ` M ${P(a, r0+h*0.2)} L ${P(a, r1)} L ${P(b, r1)} L ${P(b, r0+h*0.2)} Z`;
    }
    return { d };
  },
  // Escotilla con bisagras.
  escotilla(r0, r1, hw){
    const h = r1 - r0, a = hw * 0.72;
    return { d:`M ${P(-a, r0+h*0.12)} L ${P(-a, r1-h*0.12)} L ${P(a, r1-h*0.12)} L ${P(a, r0+h*0.12)} Z `
              + `M ${P(-a*0.55, r0)} L ${P(-a*0.55, r0+h*0.12)} L ${P(-a*0.2, r0+h*0.12)} L ${P(-a*0.2, r0)} Z `
              + `M ${P(a*0.2, r0)} L ${P(a*0.2, r0+h*0.12)} L ${P(a*0.55, r0+h*0.12)} L ${P(a*0.55, r0)} Z `
              + `M ${P(-a*0.3, r0+h*0.4)} L ${P(-a*0.3, r1-h*0.4)} L ${P(a*0.3, r1-h*0.4)} L ${P(a*0.3, r0+h*0.4)} Z`,
             evenodd:true };
  },
  // Ranuras de ventilación inclinadas.
  ranura(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    for (let i = 0; i < 4; i++){
      const a = -hw*0.8 + 1.6*hw*i/4, b = a + hw*0.26;
      d += ` M ${P(a, r0+h*0.1)} L ${P(b, r1-h*0.1)} L ${P(b + hw*0.14, r1-h*0.1)} `
         + `L ${P(a + hw*0.14, r0+h*0.1)} Z`;
    }
    return { d: d.trim() };
  },
  // Ojiva: punta de misil o de blindaje frontal.
  ojiva(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r1)} C ${P(-hw*0.62, r1-h*0.38)} ${P(-hw*0.82, r0+h*0.22)} ${P(-hw*0.82, r0)} `
              + `L ${P(hw*0.82, r0)} C ${P(hw*0.82, r0+h*0.22)} ${P(hw*0.62, r1-h*0.38)} ${P(0,r1)} Z` };
  },

  /* --- panelado de casco (referencias de mecha ochentero) --- */
  // Matriz de pulsadores: la retícula de teclas redondeadas de un panel.
  teclas(r0, r1, hw){
    const h = r1 - r0, filas = 3, cols = 4;
    let d = '';
    for (let f = 0; f < filas; f++)
      for (let c = 0; c < cols; c++){
        const ra = r0 + h*(f + 0.13)/filas, rb = r0 + h*(f + 0.87)/filas;
        const a = -hw + 2*hw*(c + 0.11)/cols, b = -hw + 2*hw*(c + 0.89)/cols;
        d += ` M ${P(a,ra)} L ${P(a,rb)} L ${P(b,rb)} L ${P(b,ra)} Z`;
      }
    return { d: d.trim() };
  },
  // Ranura cápsula: hueco alargado de extremos redondos.
  capsula(r0, r1, hw){
    const h = r1 - r0, a = hw * 0.44, t = h * 0.20;
    return { d:`M ${P(-a, r0+t)} L ${P(-a, r1-t)} Q ${P(-a, r1)} ${P(0, r1)} Q ${P(a, r1)} ${P(a, r1-t)} `
              + `L ${P(a, r0+t)} Q ${P(a, r0)} ${P(0, r0)} Q ${P(-a, r0)} ${P(-a, r0+t)} Z` };
  },
  // Etiqueta de advertencia: placa con el damero vaciado.
  etiqueta(r0, r1, hw){
    const h = r1 - r0, a = hw * 0.66;
    let d = `M ${P(-a, r0+h*0.18)} L ${P(-a, r1-h*0.18)} L ${P(a, r1-h*0.18)} L ${P(a, r0+h*0.18)} Z`;
    for (let f = 0; f < 2; f++)
      for (let c = 0; c < 3; c++){
        if ((f + c) % 2) continue;
        const ra = r0 + h*(0.30 + f*0.20), rb = ra + h*0.16;
        const x0 = -a*0.78 + 1.56*a*c/3, x1 = -a*0.78 + 1.56*a*(c+1)/3;
        d += ` M ${P(x0,ra)} L ${P(x0,rb)} L ${P(x1,rb)} L ${P(x1,ra)} Z`;
      }
    return { d, evenodd:true };
  },
  // Brida: puerto redondo con su círculo de tornillos.
  brida(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)/2, mid*Math.sin(hw*D2R)) * 0.92, 6);
    let d = circuloPath(cx, cy, R) + ' ' + circuloPath(cx, cy, R*0.50);
    for (let i = 0; i < 8; i++){
      const ang = i * Math.PI / 4;
      d += ' ' + circuloPath(cx + R*0.75*Math.cos(ang), cy + R*0.75*Math.sin(ang), Math.max(R*0.11, 1.4));
    }
    return { d, evenodd:true };
  },
  // Diamante de advertencia con el rayo vaciado.
  diamante(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0;
    const s = Math.max(Math.min(h*0.42, mid*Math.sin(hw*D2R)*0.82), 5);
    const [cx, cy] = pt(0, mid), f = (x, y) => `${(cx+x).toFixed(1)},${(cy+y).toFixed(1)}`;
    return { d:`M ${f(0,-s)} L ${f(s,0)} L ${f(0,s)} L ${f(-s,0)} Z `
              + `M ${f(s*0.16,-s*0.52)} L ${f(-s*0.24,s*0.04)} L ${f(s*0.02,s*0.04)} `
              + `L ${f(-s*0.16,s*0.54)} L ${f(s*0.26,-s*0.08)} L ${f(-s*0.02,-s*0.08)} Z`,
             evenodd:true };
  },

  /* --- señalética de mecha: franjas, dianas y códigos --- */
  // Franja de peligro: rayado diagonal continuo de lado a lado del sector.
  peligro(r0, r1, hw){
    const n = 4, paso = 2*hw/n, sesgo = hw * 0.55;
    let d = '';
    for (let i = -1; i < n; i++){
      const a0 = -hw + paso*i, a1 = a0 + paso*0.5;
      d += ` M ${P(Math.max(a0,-hw), r0)} L ${P(Math.max(a1,-hw), r0)} `
         + `L ${P(Math.min(a1+sesgo, hw), r1)} L ${P(Math.min(a0+sesgo, hw), r1)} Z`;
    }
    return { d: d.trim() };
  },
  // Diana / retícula de puntería.
  diana(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)/2, mid*Math.sin(hw*D2R)) * 0.86, 5);
    return { d: circuloPath(cx, cy, R) + ' ' + circuloPath(cx, cy, R*0.44)
              + ` M ${(cx-R*1.4).toFixed(1)},${cy.toFixed(1)} L ${(cx-R*0.55).toFixed(1)},${cy.toFixed(1)}`
              + ` M ${(cx+R*0.55).toFixed(1)},${cy.toFixed(1)} L ${(cx+R*1.4).toFixed(1)},${cy.toFixed(1)}`
              + ` M ${cx.toFixed(1)},${(cy-R*1.4).toFixed(1)} L ${cx.toFixed(1)},${(cy-R*0.55).toFixed(1)}`
              + ` M ${cx.toFixed(1)},${(cy+R*0.55).toFixed(1)} L ${cx.toFixed(1)},${(cy+R*1.4).toFixed(1)}`,
             trazo:true };
  },
  // Desgaste: rayas cortas de uso sobre el blindaje.
  desgaste(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    [[-0.52, 0.18, 0.30], [0.08, 0.50, 0.24], [0.58, 0.12, 0.34]].forEach(([a, f, L]) => {
      d += ` M ${P(hw*a, r0 + h*f)} L ${P(hw*(a + 0.16), r0 + h*Math.min(f + L, 0.98))}`;
    });
    return { d: d.trim(), trazo:true };
  },
  // Código de barras estarcido sobre el blindaje.
  codigo(r0, r1, hw){
    const h = r1 - r0;
    let d = '', a = -hw * 0.92;
    [0.07, 0.035, 0.10, 0.045, 0.03, 0.085, 0.05].forEach((v, i) => {
      const b = a + hw * 2 * v;
      if (i % 2 === 0)
        d += ` M ${P(a, r0+h*0.24)} L ${P(a, r1-h*0.24)} L ${P(b, r1-h*0.24)} L ${P(b, r0+h*0.24)} Z`;
      a = b + hw * 0.05;
    });
    return { d: d.trim() };
  },
  /* --- artillería ---
     Se dejó SOLO la familia del cañón. Espadas, hachas y lanzas leían como
     armamento medieval, no como mecha, y el resto de armas desviaba el estilo
     de lo que muestran las referencias: chapa, uniones, engranajes y
     señalética. Todo apunta hacia afuera, la culata en r0 y la boca en r1. */
  // Cañón de riel: tubo largo con anillos aceleradores y culata.
  railgun(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.19,r0+h*0.12)} L ${P(-hw*0.19,r1)} L ${P(hw*0.19,r1)} L ${P(hw*0.19,r0+h*0.12)} Z`;
    [0.22, 0.40, 0.58, 0.76].forEach(f => {
      d += ` M ${P(-hw*0.54,r0+h*f)} L ${P(-hw*0.54,r0+h*(f+0.08))} `
         + `L ${P(hw*0.54,r0+h*(f+0.08))} L ${P(hw*0.54,r0+h*f)} Z`;
    });
    d += ` M ${P(-hw*0.46,r0)} L ${P(-hw*0.46,r0+h*0.14)} L ${P(hw*0.46,r0+h*0.14)} L ${P(hw*0.46,r0)} Z`;
    return { d };
  },
  // Cañón doble con puente de unión.
  canonDoble(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.62,r0)} L ${P(-hw*0.62,r0+h*0.30)} L ${P(hw*0.62,r0+h*0.30)} L ${P(hw*0.62,r0)} Z`;
    [-0.34, 0.34].forEach(f => {
      d += ` M ${P(hw*f - hw*0.17, r0+h*0.26)} L ${P(hw*f - hw*0.17, r1)} `
         + `L ${P(hw*f + hw*0.17, r1)} L ${P(hw*f + hw*0.17, r0+h*0.26)} Z`;
      d += ` M ${P(hw*f - hw*0.26, r1-h*0.12)} L ${P(hw*f - hw*0.26, r1)} `
         + `L ${P(hw*f + hw*0.26, r1)} L ${P(hw*f + hw*0.26, r1-h*0.12)} Z`;
    });
    d += ` M ${P(-hw*0.20, r0+h*0.56)} L ${P(-hw*0.20, r0+h*0.68)} `
       + `L ${P(hw*0.20, r0+h*0.68)} L ${P(hw*0.20, r0+h*0.56)} Z`;
    return { d: d.trim() };
  },
  // Bocacha con venteos laterales.
  bocacha(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.36,r0)} L ${P(-hw*0.36,r1)} L ${P(hw*0.36,r1)} L ${P(hw*0.36,r0)} Z`;
    [0.24, 0.50, 0.76].forEach(f => {
      d += ` M ${P(-hw*0.62,r0+h*f)} L ${P(-hw*0.62,r0+h*(f+0.12))} `
         + `L ${P(hw*0.62,r0+h*(f+0.12))} L ${P(hw*0.62,r0+h*f)} Z`;
    });
    return { d: d.trim() };
  },

  /* --- cabeza del mecha: casco, ojos y antenas ---
     Es lo que identifica al robot de un vistazo, y en las referencias aparece
     una y otra vez. */
  // Casco completo: cresta en V, visor y mentón, en una sola pieza.
  cascoMecha(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.52,r0)} L ${P(-hw*0.66,r0+h*0.34)} L ${P(-hw*0.58,r0+h*0.62)} `
              + `L ${P(-hw*0.30,r0+h*0.74)} L ${P(-hw*0.86,r1)} L ${P(-hw*0.34,r0+h*0.86)} `
              + `L ${P(0,r1)} L ${P(hw*0.34,r0+h*0.86)} L ${P(hw*0.86,r1)} `
              + `L ${P(hw*0.30,r0+h*0.74)} L ${P(hw*0.58,r0+h*0.62)} L ${P(hw*0.66,r0+h*0.34)} `
              + `L ${P(hw*0.52,r0)} Z `
              + `M ${P(-hw*0.46,r0+h*0.30)} L ${P(-hw*0.20,r0+h*0.46)} L ${P(hw*0.20,r0+h*0.46)} `
              + `L ${P(hw*0.46,r0+h*0.30)} L ${P(hw*0.30,r0+h*0.20)} L ${P(-hw*0.30,r0+h*0.20)} Z`,
             evenodd:true };
  },
  // Ojo de visor: ranura horizontal con ceja.
  ojoVisor(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.82,r0+h*0.26)} L ${P(-hw*0.62,r0+h*0.62)} L ${P(hw*0.62,r0+h*0.62)} `
              + `L ${P(hw*0.82,r0+h*0.26)} L ${P(hw*0.50,r0+h*0.12)} L ${P(-hw*0.50,r0+h*0.12)} Z `
              + `M ${P(-hw*0.56,r0+h*0.32)} L ${P(-hw*0.44,r0+h*0.52)} L ${P(hw*0.44,r0+h*0.52)} `
              + `L ${P(hw*0.56,r0+h*0.32)} Z `
              + `M ${P(-hw*0.74,r0+h*0.70)} L ${P(-hw*0.74,r0+h*0.82)} L ${P(hw*0.74,r0+h*0.82)} `
              + `L ${P(hw*0.74,r0+h*0.70)} Z`, evenodd:true };
  },
  // Antenas gemelas segmentadas.
  antenaDoble(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.50,r0)} L ${P(-hw*0.50,r0+h*0.18)} L ${P(hw*0.50,r0+h*0.18)} L ${P(hw*0.50,r0)} Z`;
    [-0.28, 0.28].forEach(f => {
      d += ` M ${P(hw*f - hw*0.07, r0+h*0.14)} L ${P(hw*f - hw*0.04, r1)} `
         + `L ${P(hw*f + hw*0.04, r1)} L ${P(hw*f + hw*0.07, r0+h*0.14)} Z`;
      [0.36, 0.60].forEach(g => {
        d += ` M ${P(hw*f - hw*0.16, r0+h*g)} L ${P(hw*f - hw*0.16, r0+h*(g+0.07))} `
           + `L ${P(hw*f + hw*0.16, r0+h*(g+0.07))} L ${P(hw*f + hw*0.16, r0+h*g)} Z`;
      });
    });
    return { d: d.trim() };
  },

  /* --- uniones y transmisión --- */
  // Rótula: esfera entre dos horquillas.
  rotula(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min(h * 0.24, mid * Math.sin(hw * D2R) * 0.80), 5);
    return { d: circuloPath(cx, cy, R) + ' ' + circuloPath(cx, cy, R * 0.34)
              + ` M ${P(-hw*0.30,r0)} L ${P(-hw*0.30,mid - R*0.4)} L ${P(-hw*0.62,mid - R*0.4)} `
              + `L ${P(-hw*0.62,r0)} Z `
              + `M ${P(hw*0.62,r0)} L ${P(hw*0.62,mid - R*0.4)} L ${P(hw*0.30,mid - R*0.4)} `
              + `L ${P(hw*0.30,r0)} Z `
              + `M ${P(-hw*0.30,r1)} L ${P(-hw*0.30,mid + R*0.4)} L ${P(-hw*0.62,mid + R*0.4)} `
              + `L ${P(-hw*0.62,r1)} Z `
              + `M ${P(hw*0.62,r1)} L ${P(hw*0.62,mid + R*0.4)} L ${P(hw*0.30,mid + R*0.4)} `
              + `L ${P(hw*0.30,r1)} Z`, evenodd:true };
  },
  // Bisagra: nudillos alternos con el pasador.
  bisagra(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    for (let i = 0; i < 4; i++){
      const a = r0 + h*(i + 0.05)/4, b = r0 + h*(i + 0.95)/4;
      const lado = (i % 2) ? 1 : -1;
      d += ` M ${P(lado * hw*0.06, a)} L ${P(lado * hw*0.06, b)} `
         + `L ${P(lado * hw*0.72, b)} L ${P(lado * hw*0.72, a)} Z`;
    }
    d += ` M ${P(-hw*0.13,r0)} L ${P(-hw*0.13,r1)} L ${P(hw*0.13,r1)} L ${P(hw*0.13,r0)} Z`;
    return { d: d.trim() };
  },
  // Acople: collar con pestañas de bloqueo.
  acople(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.52,r0+h*0.20)} L ${P(-hw*0.52,r1-h*0.20)} `
          + `L ${P(hw*0.52,r1-h*0.20)} L ${P(hw*0.52,r0+h*0.20)} Z`;
    [-0.78, 0.78].forEach(f => {
      d += ` M ${P(hw*f - hw*0.16, r0+h*0.34)} L ${P(hw*f - hw*0.16, r1-h*0.34)} `
         + `L ${P(hw*f + hw*0.16, r1-h*0.34)} L ${P(hw*f + hw*0.16, r0+h*0.34)} Z`;
    });
    d += ` M ${P(-hw*0.30,r0+h*0.42)} L ${P(-hw*0.30,r1-h*0.42)} `
       + `L ${P(hw*0.30,r1-h*0.42)} L ${P(hw*0.30,r0+h*0.42)} Z`;
    return { d: d.trim(), evenodd:true };
  },
  // Piñón: rueda dentada pequeña con eje y chavetero.
  pinon(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min(h * 0.30, mid * Math.sin(hw * D2R) * 0.85), 6);
    let d = circuloPath(cx, cy, R * 0.82) + ' ' + circuloPath(cx, cy, R * 0.26);
    for (let i = 0; i < 10; i++){
      const a = i * Math.PI / 5, w = 0.16;
      const q = (rr, s) => `${(cx + rr*Math.cos(a+s)).toFixed(1)},${(cy + rr*Math.sin(a+s)).toFixed(1)}`;
      d += ` M ${q(R*0.78,-w)} L ${q(R,-w*0.6)} L ${q(R,w*0.6)} L ${q(R*0.78,w)} Z`;
    }
    d += ` M ${P(-hw*0.09, r0)} L ${P(-hw*0.09, r1)} L ${P(hw*0.09, r1)} L ${P(hw*0.09, r0)} Z`;
    return { d, evenodd:true };
  },

  /* --- estructura y chapa --- */
  // Viga en doble T con agujeros de aligeramiento.
  viga(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.80,r0)} L ${P(-hw*0.80,r0+h*0.16)} L ${P(-hw*0.20,r0+h*0.16)} `
          + `L ${P(-hw*0.20,r1-h*0.16)} L ${P(-hw*0.80,r1-h*0.16)} L ${P(-hw*0.80,r1)} `
          + `L ${P(hw*0.80,r1)} L ${P(hw*0.80,r1-h*0.16)} L ${P(hw*0.20,r1-h*0.16)} `
          + `L ${P(hw*0.20,r0+h*0.16)} L ${P(hw*0.80,r0+h*0.16)} L ${P(hw*0.80,r0)} Z`;
    [0.36, 0.64].forEach(f => {
      const [cx, cy] = pt(0, r0 + h*f);
      d += ' ' + circuloPath(cx, cy, Math.min(h*0.09, 6));
    });
    return { d, evenodd:true };
  },
  // Cartela de refuerzo con sus tornillos.
  refuerzo(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.86,r0)} L ${P(-hw*0.86,r0+h*0.24)} L ${P(0,r1)} `
          + `L ${P(hw*0.86,r0+h*0.24)} L ${P(hw*0.86,r0)} Z`;
    [[-0.56, 0.16], [0.56, 0.16], [0, 0.50]].forEach(([a, f]) => {
      const [cx, cy] = pt(hw*a, r0 + h*f);
      d += ' ' + circuloPath(cx, cy, Math.min(h*0.07, 4.5));
    });
    return { d, evenodd:true };
  },
  // Chapa ondulada.
  chapaOndulada(r0, r1, hw){
    const h = r1 - r0, n = 5;
    let d = '';
    for (let i = 0; i < n; i++){
      const a = -hw + 2*hw*(i + 0.10)/n, b = -hw + 2*hw*(i + 0.90)/n;
      d += ` M ${P(a, r0)} L ${P(a, r1)} L ${P(b, r1)} L ${P(b, r0)} Z`;
    }
    d += ` M ${P(-hw, r0)} L ${P(-hw, r0+h*0.10)} L ${P(hw, r0+h*0.10)} L ${P(hw, r0)} Z`;
    d += ` M ${P(-hw, r1-h*0.10)} L ${P(-hw, r1)} L ${P(hw, r1)} L ${P(hw, r1-h*0.10)} Z`;
    return { d: d.trim() };
  },
  // Flecha de señalización de sentido.
  flechaDir(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r1)} L ${P(-hw*0.62,r0+h*0.44)} L ${P(-hw*0.26,r0+h*0.44)} `
              + `L ${P(-hw*0.26,r0)} L ${P(hw*0.26,r0)} L ${P(hw*0.26,r0+h*0.44)} `
              + `L ${P(hw*0.62,r0+h*0.44)} Z` };
  },

  /* --- señalética rotulada (referencias de hangar) --- */
  // Placa rotulada: recuadro con renglones de texto diminuto vaciados.
  placaTexto(r0, r1, hw){
    const h = r1 - r0, a = hw * 0.70;
    let d = `M ${P(-a, r0+h*0.16)} L ${P(-a, r1-h*0.16)} L ${P(a, r1-h*0.16)} L ${P(a, r0+h*0.16)} Z`;
    [0.28, 0.46, 0.64].forEach((f, i) => {
      const w = a * (i === 2 ? 0.42 : 0.74);
      d += ` M ${P(-w, r0+h*f)} L ${P(-w, r0+h*(f+0.08))} L ${P(w, r0+h*(f+0.08))} L ${P(w, r0+h*f)} Z`;
    });
    return { d, evenodd:true };
  },
  // Triángulo de advertencia con la exclamación vaciada.
  trianguloAviso(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(0,r1)} L ${P(hw*0.86,r0)} L ${P(-hw*0.86,r0)} Z `
              + `M ${P(-hw*0.10, r0+h*0.30)} L ${P(hw*0.10, r0+h*0.30)} L ${P(hw*0.06, r0+h*0.62)} `
              + `L ${P(-hw*0.06, r0+h*0.62)} Z `
              + `M ${P(-hw*0.09, r0+h*0.13)} L ${P(hw*0.09, r0+h*0.13)} L ${P(hw*0.09, r0+h*0.22)} `
              + `L ${P(-hw*0.09, r0+h*0.22)} Z`, evenodd:true };
  },
  // Cruz de aviso hecha de cuadrados, como los pictogramas del panel.
  cruzAviso(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const s = Math.max(Math.min((r1-r0)*0.15, mid*Math.sin(hw*D2R)*0.28), 2.2);
    const q = (x, y) => `M ${(cx+x-s).toFixed(1)},${(cy+y-s).toFixed(1)} `
                      + `L ${(cx+x+s).toFixed(1)},${(cy+y-s).toFixed(1)} `
                      + `L ${(cx+x+s).toFixed(1)},${(cy+y+s).toFixed(1)} `
                      + `L ${(cx+x-s).toFixed(1)},${(cy+y+s).toFixed(1)} Z `;
    return { d: q(0,0) + q(-2.3*s,0) + q(2.3*s,0) + q(0,-2.3*s) + q(0,2.3*s) };
  },
  // Las barras diagonales que acompañan a las etiquetas de aviso.
  barrasAviso(r0, r1, hw){
    const h = r1 - r0;
    let d = '';
    for (let i = 0; i < 3; i++){
      const a = -hw*0.58 + hw*0.52*i;
      d += ` M ${P(a, r0+h*0.24)} L ${P(a + hw*0.20, r1-h*0.24)} `
         + `L ${P(a + hw*0.34, r1-h*0.24)} L ${P(a + hw*0.14, r0+h*0.24)} Z`;
    }
    return { d: d.trim() };
  },

  /* --- componentes mecánicos de mecha japonés --- */
  // Manguera corrugada: el tubo de acordeón del Zaku y del Patlabor.
  corrugada(r0, r1, hw){
    const h = r1 - r0, n = 7;
    let d = '';
    for (let i = 0; i < n; i++){
      const a = r0 + h*(i + 0.06)/n, b = r0 + h*(i + 0.82)/n;
      const w = hw * (0.28 + ((i % 2) ? 0.18 : 0));
      d += ` M ${P(-w,a)} L ${P(-w,b)} L ${P(w,b)} L ${P(w,a)} Z`;
    }
    return { d: d.trim() };
  },
  // Disco de articulación con círculo de tornillos y buje.
  discoJunta(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)/2, mid*Math.sin(hw*D2R)) * 0.95, 7);
    let d = circuloPath(cx, cy, R) + ' ' + circuloPath(cx, cy, R*0.32);
    for (let i = 0; i < 6; i++){
      const ang = i * Math.PI / 3;
      d += ' ' + circuloPath(cx + R*0.66*Math.cos(ang), cy + R*0.66*Math.sin(ang), Math.max(R*0.12, 1.4));
    }
    return { d, evenodd:true };
  },
  // Pistón con vástago salido y collarines.
  pistonVastago(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.42,r0)} L ${P(-hw*0.42,r0+h*0.54)} L ${P(hw*0.42,r0+h*0.54)} L ${P(hw*0.42,r0)} Z`;
    d += ` M ${P(-hw*0.16,r0+h*0.50)} L ${P(-hw*0.16,r1)} L ${P(hw*0.16,r1)} L ${P(hw*0.16,r0+h*0.50)} Z`;
    [0.08, 0.28].forEach(f => {
      d += ` M ${P(-hw*0.58,r0+h*f)} L ${P(-hw*0.58,r0+h*(f+0.08))} `
         + `L ${P(hw*0.58,r0+h*(f+0.08))} L ${P(hw*0.58,r0+h*f)} Z`;
    });
    d += ` M ${P(-hw*0.32,r1-h*0.09)} L ${P(-hw*0.32,r1)} L ${P(hw*0.32,r1)} L ${P(hw*0.32,r1-h*0.09)} Z`;
    return { d };
  },
  // Cañón de varios tubos sobre su cuna.
  multitubo(r0, r1, hw){
    const h = r1 - r0;
    let d = `M ${P(-hw*0.74,r0)} L ${P(-hw*0.74,r0+h*0.26)} L ${P(hw*0.74,r0+h*0.26)} L ${P(hw*0.74,r0)} Z`;
    [-0.46, 0, 0.46].forEach(f => {
      d += ` M ${P(hw*f - hw*0.15, r0+h*0.22)} L ${P(hw*f - hw*0.15, r1)} `
         + `L ${P(hw*f + hw*0.15, r1)} L ${P(hw*f + hw*0.15, r0+h*0.22)} Z`;
    });
    return { d: d.trim() };
  },
  // Perilla rotatoria con su marca indicadora.
  perilla(r0, r1, hw){
    const mid = (r0 + r1) / 2, [cx, cy] = pt(0, mid);
    const R = Math.max(Math.min((r1-r0)/2, mid*Math.sin(hw*D2R)) * 0.88, 5);
    return { d: circuloPath(cx,cy,R) + ' ' + circuloPath(cx,cy,R*0.30)
              + ` M ${(cx-R*0.11).toFixed(1)},${(cy-R*0.94).toFixed(1)} `
              + `L ${(cx+R*0.11).toFixed(1)},${(cy-R*0.94).toFixed(1)} `
              + `L ${(cx+R*0.11).toFixed(1)},${(cy-R*0.36).toFixed(1)} `
              + `L ${(cx-R*0.11).toFixed(1)},${(cy-R*0.36).toFixed(1)} Z`, evenodd:true };
  },
  // Eslabón de oruga.
  eslabon(r0, r1, hw){
    const h = r1 - r0;
    return { d:`M ${P(-hw*0.90,r0+h*0.18)} L ${P(-hw*0.90,r1-h*0.18)} `
              + `L ${P(hw*0.90,r1-h*0.18)} L ${P(hw*0.90,r0+h*0.18)} Z `
              + `M ${P(-hw*0.52,r0+h*0.34)} L ${P(-hw*0.52,r0+h*0.60)} `
              + `L ${P(-hw*0.18,r0+h*0.60)} L ${P(-hw*0.18,r0+h*0.34)} Z `
              + `M ${P(hw*0.18,r0+h*0.34)} L ${P(hw*0.18,r0+h*0.60)} `
              + `L ${P(hw*0.52,r0+h*0.60)} L ${P(hw*0.52,r0+h*0.34)} Z`, evenodd:true };
  },

  // Engranaje completo: corona dentada con cubo y agujero.
  engranaje(r0, r1, hw){
    const mid = (r0 + r1) / 2, h = r1 - r0;
    const Rr = mid + h * 0.18, Rd = mid + h * 0.42, Rc = mid - h * 0.30;
    const dientes = Math.max(8, Math.min(24, Math.round(hw ? 180 / hw : 12)));
    let d = circuloPath(0, 0, Rr) + ' ' + circuloPath(0, 0, Rc);
    for (let i = 0; i < dientes; i++){
      const c = i * 360 / dientes, w = (180 / dientes) * 0.5;
      d += ` M ${P(c-w, Rr)} L ${P(c-w*0.62, Rd)} L ${P(c+w*0.62, Rd)} L ${P(c+w, Rr)} Z`;
    }
    return { d, evenodd:true };
  }
};

/* Dígitos de siete segmentos, para la numeración estarcida de las unidades.
   Caja de ±20 × ±34; se colocan con `tr`, como las siluetas de animales.   */
const SEGMENTOS = {
  a:'M -14,-32 L 14,-32 L 9,-25 L -9,-25 Z',
  b:'M 17,-30 L 17,-4 L 11,-9 L 11,-25 Z',
  c:'M 17,4 L 17,30 L 11,25 L 11,9 Z',
  d:'M -14,32 L 14,32 L 9,25 L -9,25 Z',
  e:'M -17,4 L -17,30 L -11,25 L -11,9 Z',
  f:'M -17,-30 L -17,-4 L -11,-9 L -11,-25 Z',
  g:'M -13,0 L -8,-5 L 8,-5 L 13,0 L 8,5 L -8,5 Z'
};
// Solo las letras que el display de siete segmentos sabe formar. Basta para
// los códigos de bahía del tipo E-75, A-12 o CF-09 de las referencias.
const GLIFOS = {
  '0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg',
  '6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg',
  'A':'abcefg','B':'cdefg','C':'adef','D':'bcdeg','E':'adefg','F':'aefg',
  'H':'bcefg','L':'def','P':'abefg','U':'bcdef','-':'g'
};

// Texto estarcido, centrado en el origen. Los caracteres desconocidos se
// ignoran en vez de romper el path.
function textoPath(txt){
  const cars = [...String(txt).toUpperCase()].filter(c => GLIFOS[c]);
  const anchoD = 44, total = cars.length * anchoD;
  let d = '';
  cars.forEach((ch, i) => {
    const dx = -total/2 + anchoD/2 + i*anchoD;
    [...GLIFOS[ch]].forEach(seg => {
      d += ' ' + SEGMENTOS[seg].replace(/(-?[\d.]+),(-?[\d.]+)/g,
             (_, x, y) => `${(+x + dx).toFixed(1)},${y}`);
    });
  });
  return d.trim();
}
const numeroPath = textoPath;

// Código de bahía al estilo de los rótulos del hangar.
function codigoBahia(rnd){
  const letras = 'ABCDEFHLPU';
  const l = () => letras[Math.floor(rnd() * letras.length)];
  const n = (max) => String(Math.floor(rnd() * max)).padStart(2, '0');
  return elegir(rnd, [
    () => `${l()}-${n(100)}`,
    () => `${n(100)}-${l()}${Math.floor(rnd()*10)}`,
    () => `${l()}${l()}-${Math.floor(rnd()*10)}`,
    () => n(100)
  ])();
}

/* Subdivisión de Koch: cada segmento se parte en tres y el tramo central se
   sustituye por dos lados de un triángulo equilátero que apunta hacia afuera. */
function kochPuntos(x0, y0, x1, y1, n){
  if (n === 0) return [[x1, y1]];
  const dx = (x1 - x0) / 3, dy = (y1 - y0) / 3;
  const ax = x0 + dx, ay = y0 + dy, bx = x0 + 2*dx, by = y0 + 2*dy;
  const px = ax + dx*0.5 + dy*0.8660254;
